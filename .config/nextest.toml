# A failed test is tried once more: a failure on both tries is FAIL and blocks a lane's landing; a pass
# on the retry is FLAKY, recorded in the lane's file, and does not block (`flaky-result` stays "pass").
# A test still running after two minutes is ended, so a hung one fails rather than holding the run.
[profile.default]
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "package(sidekicks-shell) | package(sidekicks-daemon) | package(sidekicks-store)"
test-group = "heavy"

# A measurement, a live-provider test or an endurance test runs as long as it needs, never ended:
# each is ignored, run on demand with `--run-ignored only`, and the filter matches a test by the
# module it sits in, `measurements`, `live_provider` or `endurance`, at the start of the test's
# path or after `::`.
[[profile.default.overrides]]
filter = "test(/(^|::)(measurements|live_provider|endurance)::/)"
slow-timeout = "60s"

# Every failure is reported in one run.
[profile.ci]
fail-fast = false

# The heavy tests (a PTY, a daemon process, SQLite on disk) run at most two at a time, so one suite run
# does not start one per CPU and starve the machine's writers.
[test-groups]
heavy = { max-threads = 2 }
