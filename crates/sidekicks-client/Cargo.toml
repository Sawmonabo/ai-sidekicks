[package]
name = "sidekicks-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The typed daemon client: the command line's, and the desktop's through Node-API."
license.workspace = true
publish.workspace = true

[lib]
# The Node-API addon the desktop loads, built with the `node-api` feature.
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes.workspace = true
interprocess.workspace = true
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[build-dependencies]
napi-build = { workspace = true, optional = true }

[features]
node-api = ["dep:napi", "dep:napi-build", "dep:napi-derive"]

[lints]
workspace = true
