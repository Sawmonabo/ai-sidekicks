[dev-dependencies]
alacritty_terminal.workspace = true
proptest.workspace = true
rstest.workspace = true
# The artifact test store the tests open.
sidekicks-artifact = { workspace = true, features = ["test-support"] }
# The call fixtures and the credit gate the tests use.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The in-memory credential store, this process's pin and footprint, and the harness's test names
# the tests use.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The test driver registry, the mock driver and the runtime binding's test store the tests build
# on.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The provider session opening the tests compose.
sidekicks-queue = { workspace = true, features = ["test-support"] }
# The run rows, the live count's log, the transcript test log and the search index's test services
# the tests build on.
sidekicks-session = { workspace = true, features = ["test-support"] }
# The shell table the tests open.
sidekicks-shell = { workspace = true, features = ["test-support"] }
# The pause points the tests arm.
sidekicks-std = { workspace = true, features = ["test-support"] }
# The test database and the session rows the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The workflow rows the tests build on.
sidekicks-workflow = { workspace = true, features = ["test-support"] }
# The git runner the tests script.
sidekicks-workspace = { workspace = true, features = ["test-support"] }
standardwebhooks.workspace = true
# The paused clock the local gateway's tests drive.
tokio = { workspace = true, features = ["test-util"] }
x-wing.workspace = true

[build-dependencies]
# The SQLite shell, compiled from its vendored source after its hash is checked.
base16ct.workspace = true
cc.workspace = true
sha3.workspace = true

