[package]
name = "sidekicks-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The daemon: sessions with Claude Code and Codex, git worktrees, terminals and the SQLite store."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The linking digits of a device link.
  "hkdf",
  # The machine's identity key and the statements it signs.
  "ed25519-dalek",
  # The channel to each WSL 2 distribution's WSL server, the daemon the client and the WSL server
  # the server.
  "h2",
  # The Standard Webhooks signature on a run's web address calls.
  "hmac",
  "standardwebhooks",
  # Sealing a push notice to a linked device's push key.
  "web-push-native",
  "x-wing",
  # A machine's certificate and the HTTP forward to its shared ports.
  "hyper-util",
  "instant-acme",
  "tokio-rustls",
  # The DPoP proofs on the program's control-plane calls.
  "p256",
  # The email digest of what needs the person's attention.
  "lettre",
  # Its build script hands the daemon's build the bundled `sqlite3.h` the SQLite shell compiles
  # against.
  "libsqlite3-sys",
  # The passkey statement checks.
  "llrt_buffer",
  "llrt_crypto",
  "rquickjs",
  # The passkey relying party's and the relay channel's tokens.
  "pasetors",
  # The relay channel: its Noise sessions and the relay's certificate check.
  "rustls-platform-verifier",
  "snow",
]

