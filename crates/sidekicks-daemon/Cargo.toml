[package]
name = "sidekicks-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The daemon: sessions with Claude Code and Codex, git worktrees, terminals and the SQLite store."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The loopback listener for the agents' tool servers, the telemetry receiver and a machine's
  # shared ports.
  "axum",
  # The command channel the daemon shares with its command wrapper and askpass modes.
  "chacha20poly1305",
  "hkdf",
  "x25519-dalek",
  # The browser tools and Preview's pages over DevTools.
  "chromiumoxide_cdp",
  "psl",
  # Crash reports of the daemon and its modes.
  "crash-handler",
  "minidumper",
  # A workflow schedule's next run in its time zone.
  "croner",
  # The workflow step that parses CSV.
  "csv",
  # Laying out a workflow an agent wrote with no layout of its own.
  "dugong",
  # The machine's identity key and the statements it signs.
  "ed25519-dalek",
  # An attachment's picture, its first page and its covered copy.
  "fast_image_resize",
  "image",
  "pdfium-render",
  "webp",
  # The channel to each WSL 2 distribution's WSL server, the daemon the client and the WSL server
  # the server.
  "h2",
  # The Standard Webhooks signature on a run's web address calls.
  "hmac",
  "standardwebhooks",
  # Sealing a push notice to a linked device's push key.
  "hpke",
  "web-push-native",
  "x-wing",
  # A machine's certificate and the forward to its shared ports.
  "hyper-util",
  "instant-acme",
  "tokio-rustls",
  # A workflow's expressions.
  "jsonata-core",
  # The MCP sign-in's keys, thumbprints and proofs.
  "jwt-simple",
  "p256",
  # The email digest of what needs the person's attention.
  "lettre",
  # Its build script hands the daemon's build the bundled `sqlite3.h` the SQLite shell compiles
  # against.
  "libsqlite3-sys",
  # The passkey statement checks.
  "llrt_buffer",
  "llrt_crypto",
  # The token prices read from what the providers report.
  "opentelemetry-proto",
  # The passkey relying party's and the relay channel's tokens.
  "pasetors",
  # The redaction set built from each secret of a run.
  "form_urlencoded",
  "percent-encoding",
  # The daemon's own tool server and its connections to a session's tool servers.
  "rmcp",
  "sse-stream",
  # The relay channel: its Noise sessions and the relay's certificate check.
  "rustls-platform-verifier",
  "snow",
  # YAML front matter, skills and the workflow step that parses YAML, read and edited in place.
  "serde-saphyr",
  "yaml-edit",
  # Fetching and unpacking the tools a workflow code step runs on.
  "tar",
  "zip",
  # Editing the providers' and tool servers' TOML settings in place.
  "toml_edit",
  # The stored-body codec: a transcript body of 1 KiB or more kept compressed.
  "zstd",
]

