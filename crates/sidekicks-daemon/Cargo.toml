hmac.workspace = true
hyper-util.workspace = true
instant-acme.workspace = true
interprocess.workspace = true
jiff.workspace = true
lettre.workspace = true
# Its version is the one `rusqlite` bundles, whose SQLite the vendored shell is checked against.
libsqlite3-sys.workspace = true
llrt_buffer.workspace = true
llrt_crypto.workspace = true
lru.workspace = true
memchr.workspace = true
minidump.workspace = true
minidump-processor.workspace = true
minidump-unwind.workspace = true
minidumper.workspace = true
p256.workspace = true
pasetors.workspace = true
quick_cache.workspace = true
regex.workspace = true
reqwest.workspace = true
rquickjs.workspace = true
rusqlite.workspace = true
rustls-platform-verifier.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
