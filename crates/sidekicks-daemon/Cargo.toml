[dev-dependencies]
insta.workspace = true
mockall.workspace = true
proptest.workspace = true
rstest.workspace = true
# The test database and session rows the integration tests build on.
sidekicks-daemon = { path = ".", features = ["test-support"] }
# A file whose removal the system refuses, for the clone's failed-removal test.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The documents an index holds under a row's key, for the search apply's damaged-row test.
sidekicks-search = { workspace = true, features = ["index", "test-support"] }
# The screen copy drawn without a shell, for the screen listener's answer tests.
sidekicks-terminal = { workspace = true, features = ["test-support"] }
standardwebhooks.workspace = true
# The paused clock the clone progress gate's and the stream batcher's tests drive.
tokio = { workspace = true, features = ["test-util"] }
x-wing.workspace = true

[build-dependencies]
# The SQLite shell, compiled from its vendored source after its hash is checked.
cc.workspace = true
sha3.workspace = true

[features]
# Helpers the integration tests use: a database file with the daemon's schema and the session
# rows other tables build on.
test-support = []

[lints]
