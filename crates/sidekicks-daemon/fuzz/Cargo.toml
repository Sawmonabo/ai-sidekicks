[package]
name = "sidekicks-daemon-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The daemon's fuzz targets, built and run by `cargo fuzz`."
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-shear]
ignored = [
  # Used by the detection module the target includes by path, which the tool does not follow.
  "file-format",
]

[[bin]]
bench = false
doc = false
name = "media_type"
path = "fuzz_targets/media_type.rs"
test = false

# The target builds the artifact crate's detection module, so it takes that crate's `file-format`;
# the whole daemon does not build under sancov in 6 GB.
[dependencies]
file-format.workspace = true

# Only `cargo fuzz`, which sets `--cfg fuzzing`, builds libFuzzer; a workspace check, lint or test
# leaves it out.
[target."cfg(fuzzing)".dependencies]
libfuzzer-sys.workspace = true

[lints]
workspace = true
