[package]
name = "sidekicks-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The PTY each shell runs in, inside the daemon, and the screen copy of its output."
license.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal.workspace = true
bytes.workspace = true
sidekicks-platforms.workspace = true
sidekicks-std.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
vte = { workspace = true, features = ["ansi"] }

[dev-dependencies]
rstest.workspace = true
sidekicks-platforms = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[features]
# The screen copy drawn without a shell, for the shell crate's tests of its screen listener.
test-support = []

[lints]
workspace = true
