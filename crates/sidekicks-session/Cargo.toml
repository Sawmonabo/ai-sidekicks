[package]
name = "sidekicks-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sessions, the run engine, the transcript, questions, interventions, the queue store and the session directory."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
# The skipped-file cursor's base64url encoding.
base64.workspace = true
blake3.workspace = true
# The wire message other crates' tests split into its attachments.
bytes = { workspace = true, optional = true }
# The cron matches a provider's recurring job wakes a sleeping session for.
croner.workspace = true
diffy.workspace = true
futures.workspace = true
garde.workspace = true
# The web address's signature: HMAC-SHA256 under a key minted from the system's random source.
getrandom.workspace = true
hmac.workspace = true
ignore.workspace = true
jiff.workspace = true
lru.workspace = true
notify.workspace = true
# The user info a web address carries, decoded into its `Basic` header.
percent-encoding.workspace = true
regex.workspace = true
# The web address's posts.
reqwest.workspace = true
rusqlite.workspace = true
satteri-pulldown-cmark.workspace = true
# The web address and its signing secret, redacted and wiped.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-mcp.workspace = true
sidekicks-platforms.workspace = true
sidekicks-provider.workspace = true
sidekicks-search = { workspace = true, features = ["index"] }
sidekicks-std = { workspace = true, features = ["outbound-http"] }
sidekicks-store.workspace = true
sidekicks-workspace.workspace = true
strum.workspace = true
# The home folder of the questions service other crates' tests open.
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The web address's double on a loopback port.
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
mockall.workspace = true
rstest.workspace = true
# The credit gate the list feed's tests read through.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The illegal byte sequence check and the name that is not Unicode the tests read, and the
# credential store in memory the web address's secrets are kept in.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The test driver registry, the mock driver, the recorded diagnostics, the runtime binding's test
# store, the unanswered driver error and the starting level a test's driver answers.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The documents an index holds under a row's key, for the search apply's damaged-row test.
sidekicks-search = { workspace = true, features = ["index", "test-support"] }
# The pause points the tests arm and the wall clock the web address's retries are due on.
sidekicks-std = { workspace = true, features = ["test-support"] }
# The test database and session rows the session's tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The workspace rows the tests build on.
sidekicks-workspace = { workspace = true, features = ["test-support"] }
# The web address's signatures checked the Standard Webhooks way.
standardwebhooks.workspace = true
tempfile.workspace = true
# The paused clock the live index's and the list feed's tests drive.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[features]
# Helpers other crates' tests use: the run engine built over a test database and its restart pause,
# the live count's test log, the attention entries' test log and counting windowless starter, the
# transcript's test log, the questions service's fixtures, the list feed's test build, the follow
# count and the search index's test services.
test-support = [
  "dep:bytes",
  "dep:tempfile",
  "sidekicks-provider/test-support",
  "sidekicks-std/test-support",
  "sidekicks-store/test-support",
]

[lints]
workspace = true
