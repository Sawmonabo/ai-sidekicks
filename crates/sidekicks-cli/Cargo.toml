[package]
name = "sidekicks-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `sidekicks` command line."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The QR code `sidekicks device link` draws in the terminal.
  "fast_qr",
  # The hidden prompt for a provider account's token, held in memory until the one place that
  # passes it on.
  "rpassword",
  "secrecy",
]

[[bin]]
name = "sidekicks"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fast_qr.workspace = true
rpassword.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-client.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
tokio.workspace = true

[lints]
workspace = true
