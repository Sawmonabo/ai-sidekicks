[package]
name = "sidekicks-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `sidekicks` command line."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The QR code `sidekicks device link` draws in the terminal.
  "fast_qr",
  # The hidden prompt for a provider account's token, held in memory until the one place that
  # passes it on.
  "rpassword",
  "secrecy",
]

[[bin]]
name = "sidekicks"
path = "src/main.rs"

[dependencies]
# Whether each output stream shows styles: `anstream`'s own choice for a stream, the rule clap's
# output follows, picked over writing that rule again with `anstyle-query`; `anstyle-query` turns on
# a Windows console's escape codes, as `anstream` does before it writes styles to one. Only the
# choice is used, since clap's text is rendered into the run's own writers.
anstream.workspace = true
anstyle-query.workspace = true
anyhow.workspace = true
clap.workspace = true
fast_qr.workspace = true
icu_decimal.workspace = true
icu_locale_core.workspace = true
jiff.workspace = true
rpassword.workspace = true
secrecy.workspace = true
sidekicks-client.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
