[package]
name = "sidekicks-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `sidekicks` command line."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The QR code `sidekicks device link` draws in the terminal.
  "fast_qr",
  # The hidden prompt for a provider account's token, held in memory until the one place that
  # passes it on.
  "rpassword",
  "secrecy",
  # The Ctrl-C ending the command line takes behind the platforms interface.
  "sidekicks-platforms",
]

[[bin]]
name = "sidekicks"
path = "src/main.rs"

[dependencies]
# Whether each output stream shows styles, read as clap's own output reads it (`NO_COLOR`,
# `CLICOLOR_FORCE`, the terminal's color support): picked over `anstream`, whose stream wrappers
# the command line has no use for, since clap's text is rendered into the run's own writers.
anstyle-query.workspace = true
anyhow.workspace = true
clap.workspace = true
fast_qr.workspace = true
rpassword.workspace = true
secrecy.workspace = true
sidekicks-client.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
thiserror.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
