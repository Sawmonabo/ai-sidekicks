[package]
name = "sidekicks-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The local socket's server side without its handlers: the method registry and dispatch, the caller check, the stream subscriptions and their frame batching, the presence register of the devices connected, and the errors."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The redaction set built from each secret of a run.
  "form_urlencoded",
  "percent-encoding",
]

[lib]
doctest = false

[dependencies]
bytes.workspace = true
form_urlencoded.workspace = true
futures.workspace = true
garde.workspace = true
interprocess.workspace = true
percent-encoding.workspace = true
regex.workspace = true
# The schemas the call fixtures' test methods derive for their params and results.
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rstest.workspace = true
rusqlite.workspace = true
# The schemas the call fixtures' and the error-mapping tests' test methods derive.
schemars.workspace = true
# This process's pin, which the caller process tests read.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The paused clock the stream batcher's and the in-flight record's tests drive.
tokio = { workspace = true, features = ["test-util"] }

[features]
# Helpers other crates' tests use: the socket's call fixtures, the caller process's scripted reader
# and the feed's credit gate.
test-support = ["dep:schemars"]

[lints]
workspace = true
