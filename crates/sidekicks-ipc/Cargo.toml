[package]
name = "sidekicks-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The local socket's server side without its handlers: the registry, framing, streams and errors."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
bytes.workspace = true
futures.workspace = true
garde.workspace = true
interprocess.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rstest.workspace = true
rusqlite.workspace = true
# The stand-in programs and recorded system calls the tests use.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The paused clock the stream batcher's and the in-flight record's tests drive.
tokio = { workspace = true, features = ["test-util"] }

[features]
# Helpers other crates' tests use: the socket's call fixtures and the caller process's descent.
test-support = []

[lints]
workspace = true
