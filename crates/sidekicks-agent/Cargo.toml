[package]
name = "sidekicks-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Saved agent definitions, skills, plugins and the shared tool server."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored-paths = [
  # Each module's doc names what it will hold, for the saved agents and their tool server.
  "src/definition.rs",
  "src/plugin.rs",
  "src/skill.rs",
]

[lib]
doctest = false

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
futures.workspace = true
garde.workspace = true
http.workspace = true
jiff.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
sidekicks-provider.workspace = true
sidekicks-std.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
jsonschema.workspace = true
# The HTTP client the listener's tests reach it with on loopback.
reqwest.workspace = true
rstest.workspace = true
# The mock drivers and their registry the tool server's tests answer runs through.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The data folder the listener's tests keep its port in.
tempfile.workspace = true

[lints]
workspace = true
