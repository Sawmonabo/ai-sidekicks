[package]
name = "sidekicks-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The wire's serde types and garde checks, from which the TypeScript contracts are generated."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # On for the WebAssembly builds only, so the randomness `p256` (getrandom 0.4) and the schema
  # checker's hash maps (getrandom 0.3, through `ahash`) take is read from `crypto.getRandomValues`.
  "getrandom",
  "getrandom_03",
  # The statement chain's hash links and its P-256 signatures, built later in this crate.
  "p256",
  "sha2",
]

[dependencies]
base64.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
garde.workspace = true
icu_casemap.workspace = true
jiff.workspace = true
jsonschema.workspace = true
p256.workspace = true
regex.workspace = true
ryu-js.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_path_to_error.workspace = true
serde_with.workspace = true
sha2.workspace = true
strum.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_03 = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[features]
# The workflow checks' WebAssembly exports, which the builder runs in the page.
workflow-check-wasm = ["dep:wasm-bindgen"]

[lints]
workspace = true
