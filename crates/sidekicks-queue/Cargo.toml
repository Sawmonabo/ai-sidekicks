[package]
name = "sidekicks-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The run queue: sending, ordering, admitting, delivering and recording runs per session."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
futures.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-provider.workspace = true
sidekicks-session.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
# The paused clock the memory gate's and the delivery's tests drive.
tokio = { workspace = true, features = ["test-util"] }

[features]
# Helpers other crates' tests use: a provider session opened for a test.
test-support = []

[lints]
workspace = true
