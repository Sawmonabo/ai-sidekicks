[package]
name = "sidekicks-recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Repair of what the daemon keeps after a stop: the start's checks, damaged history and the database file's repair."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
futures.workspace = true
garde.workspace = true
getrandom.workspace = true
jiff.workspace = true
memchr.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-approval.workspace = true
sidekicks-artifact.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-platforms.workspace = true
sidekicks-provider.workspace = true
sidekicks-session.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
# The approval service's and the permission check's fixtures the tests build on.
sidekicks-approval = { workspace = true, features = ["test-support"] }
# The artifact test store and the plans fixtures the tests open.
sidekicks-artifact = { workspace = true, features = ["test-support"] }
# The call fixtures, the scripted caller reader and the credit gate the tests use.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The stand-in programs and recorded system calls the tests use.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The test driver registry, the mock driver and the stand-in stores the tests build on.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The run engine, the questions and the transcript fixtures the tests build on.
sidekicks-session = { workspace = true, features = ["test-support"] }
# The test database and the session rows the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
sidekicks-workflow.workspace = true
sidekicks-workspace.workspace = true
tempfile.workspace = true
# The paused clock the recovery stall watch's tests drive.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
