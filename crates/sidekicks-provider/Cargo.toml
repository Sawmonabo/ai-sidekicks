[package]
name = "sidekicks-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The driver interface, the run ports, shared provider code and every provider's driver."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The token prices read from what the providers report.
  "opentelemetry-proto",
  # Editing the providers' and tool servers' TOML settings in place.
  "toml_edit",
]

[lib]
doctest = false

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
base16ct.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
console.workspace = true
diffy.workspace = true
futures.workspace = true
getrandom.workspace = true
hpke.workspace = true
jiff.workspace = true
jsonc-parser.workspace = true
lru.workspace = true
memchr.workspace = true
mockall = { workspace = true, optional = true }
notify.workspace = true
opentelemetry-proto.workspace = true
process-wrap.workspace = true
regex.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
shlex.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-platforms.workspace = true
sidekicks-policy.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
sidekicks-workspace.workspace = true
starlark.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# The diagnostics recorder other crates' tests install.
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true
zeroize.workspace = true
zstd.workspace = true

[dev-dependencies]
interprocess.workspace = true
mockall.workspace = true
proptest.workspace = true
rstest.workspace = true
# The scripted caller reader and the credit gate the tests use.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The stand-in programs, the harness's test names and the socket folders the tests use.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The bounded reads' switch the scripted Claude driver arms for its paused clock.
sidekicks-std = { workspace = true, features = ["test-support"] }
# The test database and the session test log the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The paused clock the drivers' and the command waits' tests drive.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[build-dependencies]
# Codex's app-server protocol types, generated from the release's schema bundle after its hash is
# checked.
base16ct.workspace = true
serde_json.workspace = true
sha3.workspace = true
typify.workspace = true
zstd.workspace = true

[features]
# Helpers other crates' tests use: the drivers' test registry and provider, the driver's mock, the
# diagnostics recorder, the runtime binding's test store and the question port's test card.
test-support = ["dep:mockall", "dep:tracing-subscriber", "sidekicks-store/test-support"]

[lints]
workspace = true
