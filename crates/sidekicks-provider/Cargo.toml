[package]
name = "sidekicks-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The driver interface, the run ports, shared provider code and every provider's driver."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The token prices read from what the providers report.
  "opentelemetry-proto",
  # Editing the providers' and tool servers' TOML settings in place.
  "toml_edit",
]

[lib]
doctest = false

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
# The loopback stand-in endpoint the compaction calibration runs a provider build against.
axum = { workspace = true, features = ["http1", "tokio"] }
base16ct.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
console.workspace = true
diffy.workspace = true
futures.workspace = true
getrandom.workspace = true
hpke.workspace = true
# The local socket each session's inbox listens on.
interprocess.workspace = true
jiff.workspace = true
jsonc-parser.workspace = true
lru.workspace = true
memchr.workspace = true
mockall = { workspace = true, optional = true }
notify.workspace = true
opentelemetry-proto.workspace = true
process-wrap.workspace = true
regex.workspace = true
regex-lite.workspace = true
# The claude.ai connector list a connector's organization mark is read from.
reqwest.workspace = true
rusqlite.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
shlex.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-platforms.workspace = true
sidekicks-policy.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
sidekicks-workspace.workspace = true
starlark.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# The diagnostics recorder other crates' tests install.
tracing-subscriber = { workspace = true, optional = true }
unicode-normalization.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Compresses the loopback connector list's reply as the service may send it.
flate2.workspace = true
mockall.workspace = true
proptest.workspace = true
rstest.workspace = true
# The scripted caller reader and the credit gate the tests use.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The stand-in programs, the harness's test names and the socket folders the tests use.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The keyed lock's count of queued holders, which tells a declare waiting on its provider's turn,
# and the held file reads the posture tests resolve a root across.
sidekicks-std = { workspace = true, features = ["test-support"] }
# The test database and the session test log the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The scratch repository a staged review's test opens its worktree from.
sidekicks-workspace = { workspace = true, features = ["test-support"] }
# The paused clock the drivers' and the command waits' tests drive.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
zstd.workspace = true

[build-dependencies]
# Codex's app-server protocol types, generated from the release's schema bundle after its hash is
# checked.
base16ct.workspace = true
serde_json.workspace = true
sha3.workspace = true
typify.workspace = true
zstd.workspace = true

[features]
# Helpers other crates' tests use: the drivers' test registry with its session inbox addresser, the
# test provider id, the driver's mock, the unanswered request, the diagnostics recorder, the
# runtime binding's test store, the question port's test card, the provider process stand-in and
# its test identity, the late appendable row's `Clone` and `PartialEq`, and the kept terminal
# service with its listener and its recording `codex` command.
test-support = [
  "dep:mockall",
  "dep:tracing-subscriber",
  "sidekicks-platforms/test-support",
  "sidekicks-store/test-support",
]

[lints]
workspace = true
