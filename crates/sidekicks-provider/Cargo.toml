[package]
name = "sidekicks-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The driver interface, the run ports, shared provider code and every provider's driver."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
# The loopback stand-in endpoint the compaction calibration runs a provider build against.
axum = { workspace = true, features = ["http1", "tokio"] }
base16ct.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
console.workspace = true
diffy.workspace = true
# Reads the Agent SDK tarball's gzip, and compresses the tests' loopback connector list as the
# service may send it.
flate2.workspace = true
futures.workspace = true
getrandom.workspace = true
hpke.workspace = true
# The local socket each session's inbox listens on.
interprocess.workspace = true
jiff.workspace = true
jsonc-parser.workspace = true
lru.workspace = true
memchr.workspace = true
mockall = { workspace = true, optional = true }
notify.workspace = true
opentelemetry-proto.workspace = true
process-wrap.workspace = true
# Decodes the providers' OTLP exports and encodes the receiver's answers.
prost.workspace = true
regex.workspace = true
regex-lite.workspace = true
# The claude.ai connector list a connector's organization mark is read from.
reqwest.workspace = true
rusqlite.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_with.workspace = true
sha1.workspace = true
sha2.workspace = true
shlex.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-platforms.workspace = true
sidekicks-policy.workspace = true
# The outbound HTTP client's shared settings and capped body reader, which the price list's fetch
# and the connector list's read build on.
sidekicks-std = { workspace = true, features = ["outbound-http"] }
sidekicks-store.workspace = true
sidekicks-workspace.workspace = true
starlark.workspace = true
strum.workspace = true
subtle.workspace = true
# Reads the Agent SDK tarball's one entry, its `sdk.mjs`.
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# The diagnostics recorder and the captured log other crates' tests install.
tracing-subscriber = { workspace = true, optional = true }
unicode-normalization.workspace = true
# The character classes Claude Code strips from a sender name it parses back.
unicode-properties.workspace = true
url.workspace = true
uuid.workspace = true
# The terminal parser a sign-in's address line is read through.
vte.workspace = true
zeroize.workspace = true

[dev-dependencies]
mockall.workspace = true
proptest.workspace = true
rstest.workspace = true
# The environment row builder the spawn and sign-in tests use.
sidekicks-contracts = { workspace = true, features = ["test-support"] }
# The scripted caller reader and the credit gate the tests use.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The stand-in programs, the harness's test names and the socket folders the tests use.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The keyed lock's count of queued holders, which tells a declare waiting on its provider's turn,
# and the held file reads the posture tests resolve a root across.
sidekicks-std = { workspace = true, features = ["test-support"] }
# The test database and the session test log the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The scratch repository a staged review's test opens its worktree from.
sidekicks-workspace = { workspace = true, features = ["test-support"] }
# The paused clock the drivers' and the command waits' tests drive.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
zstd.workspace = true

[build-dependencies]
# Codex's app-server protocol types, generated from the release's schema bundle after its hash is
# checked.
base16ct.workspace = true
serde_json.workspace = true
sha3.workspace = true
typify.workspace = true
zstd.workspace = true

[features]
# Helpers other crates' tests use: the drivers' test registry with its session inbox addresser, the
# test provider id, the driver's mock, the unanswered request, the diagnostics recorder, the
# runtime binding's test store, the captured test log, the question port's test card, the provider
# process stand-in and its test identity, the late appendable row's `Clone` and `PartialEq`, the
# kept terminal service with its listener and its recording `codex` command, and the command
# capture whose opens a test holds.
test-support = [
  "dep:mockall",
  "dep:tracing-subscriber",
  "sidekicks-platforms/test-support",
  "sidekicks-std/test-support",
  "sidekicks-store/test-support",
]

[lints]
workspace = true
