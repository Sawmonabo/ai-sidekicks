[package]
name = "sidekicks-platforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "All operating-system code behind one interface: macOS, Windows and Linux."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # Claude Code's token pipe and the background browser's DevTools pipe on fixed descriptors.
  "command-fds",
  # The link to an agent's memory folder on Windows.
  "junction",
  # The wake helper's status, read through the system's service management.
  "objc2-foundation",
  "objc2-service-management",
]

[dependencies]
alacritty_terminal.workspace = true
base64.workspace = true
icu_locale_core.workspace = true
interprocess.workspace = true
keepawake.workspace = true
keyring-core.workspace = true
polling.workspace = true
process-wrap = { workspace = true, features = ["creation-flags", "process-session"] }
regex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
typed-path.workspace = true

[dev-dependencies]
rstest.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
icu_datetime.workspace = true
libmimalloc-sys.workspace = true
mimalloc.workspace = true
tree-sitter.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
notify.workspace = true
tokio-util.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
block2.workspace = true
dispatch2 = { workspace = true, features = ["libc", "std"] }
mach2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-io-kit = { workspace = true, features = ["dispatch2", "libc", "ps", "pwr_mgt", "std"] }
objc2-security = { workspace = true, features = ["CSCommon", "SecCode", "SecRequirement", "std"] }
objc2-service-management.workspace = true
security-framework.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
async-io.workspace = true
getrandom.workspace = true
junction.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
uds_windows.workspace = true
walkdir.workspace = true
windows = { workspace = true, features = ["UI_Notifications", "Win32_System_Threading"] }
windows-native-keyring-store.workspace = true
windows-sys.workspace = true
windows-sys.features = [
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
]

[target."cfg(unix)".dependencies]
command-fds.workspace = true
libc.workspace = true
nix.workspace = true
signal-hook.workspace = true

[features]
# Helpers other crates' tests use: the per-platform programs a test runs in a terminal, the name
# the harness gives a test (`harness_test_name`), the process's footprint and the `uptime` line the
# search index's measurements read, a file whose removal the system refuses, a credential store
# whose calls wait until the test releases them, and the system's refusal of a name its file system
# cannot hold.
test-support = []

[lints]
workspace = true
