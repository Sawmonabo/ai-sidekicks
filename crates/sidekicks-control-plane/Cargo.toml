[package]
name = "sidekicks-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The control plane: the Cloudflare Worker, the Compose relay's program and the schema runner."
license.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  # The Compose relay's program: its push sign-in, its DNS server for machine certificates, its
  # secrets made at first run and its server-name router.
  "gcp_auth",
  "getrandom",
  "hickory-server",
  "rustls",
  # The passkey sign-in's token issuer and its DPoP proof checks; `p256` also signs Web Push.
  "jwt-simple",
  "p256",
  "pasetors",
]

[lib]
# The Worker's entry, built to WebAssembly by `worker-build`.
crate-type = ["cdylib", "rlib"]

[dependencies]
axum.workspace = true
jiff.workspace = true
jwt-simple.workspace = true
p256.workspace = true
pasetors.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
thiserror.workspace = true
time.workspace = true

# The Compose relay's native program.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
gcp_auth.workspace = true
getrandom.workspace = true
hickory-server.workspace = true
rusqlite.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower-service.workspace = true

# The Worker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util.workspace = true
js-sys.workspace = true
time = { workspace = true, features = ["wasm-bindgen"] }
tower-service.workspace = true
wasm-bindgen.workspace = true
worker.workspace = true

[lints]
workspace = true
