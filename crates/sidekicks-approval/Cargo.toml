[package]
name = "sidekicks-approval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Approvals: the permission gate, the asks the daemon answers, the approval service, its store and projection."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
console.workspace = true
futures.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-platforms.workspace = true
sidekicks-policy.workspace = true
sidekicks-provider.workspace = true
sidekicks-session.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
sidekicks-workspace.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
# The folder links the tests make.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The test driver registry and the mock driver the tests build on.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The run engine and the paused run's answers the tests build on.
sidekicks-session = { workspace = true, features = ["test-support"] }
# The pause points the tests arm.
sidekicks-std = { workspace = true, features = ["test-support"] }
# The test database and the session rows the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The git runner and the workspace rows the tests build on.
sidekicks-workspace = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[features]
# Helpers other crates' tests use: the approval service's and the permission check's fixtures.
test-support = ["sidekicks-store/test-support", "sidekicks-workspace/test-support"]

[lints]
workspace = true
