[package]
name = "sidekicks-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The MCP client a session's tool servers are reached through, its tool calls and command receipts, each server's status folded from its bindings and session legs, and the MCP governance tables."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
jwt-simple.workspace = true
oauth2.workspace = true
p256.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sidekicks-contracts.workspace = true
sidekicks-ipc.workspace = true
sidekicks-platforms.workspace = true
sidekicks-provider.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
sse-stream.workspace = true
strum.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
rstest.workspace = true
# The credit gate the status tests read the notice board through.
sidekicks-ipc = { workspace = true, features = ["test-support"] }
# The in-memory credential store the sign-in's custody tests keep their items in.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
# The question port's test card the tests answer through.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The test database the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The data folder the custody tests' secret items keep their place record in.
tempfile.workspace = true
# The paused clock the client's tests drive.
tokio = { workspace = true, features = ["test-util"] }

[features]
# What other crates' tests use: the notice board's probe notice.
test-support = []

[lints]
workspace = true
