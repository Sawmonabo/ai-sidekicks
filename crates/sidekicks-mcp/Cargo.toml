[package]
name = "sidekicks-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The MCP client a session's tool servers are reached through, its tool calls and command receipts."
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
bytes.workspace = true
futures.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sidekicks-contracts.workspace = true
sidekicks-platforms.workspace = true
sidekicks-provider.workspace = true
sidekicks-std.workspace = true
sidekicks-store.workspace = true
sse-stream.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
rstest.workspace = true
# The test driver registry, the mock driver and the stand-in stores the tests build on.
sidekicks-provider = { workspace = true, features = ["test-support"] }
# The test database and the session rows the tests build on.
sidekicks-store = { workspace = true, features = ["test-support"] }
# The paused clock the client's tests drive.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
