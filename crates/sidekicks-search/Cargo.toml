[package]
name = "sidekicks-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The session search index on Tantivy and the one fuzzy matcher."
license.workspace = true
publish.workspace = true

[dependencies]
icu_casemap = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The longest find query, which sets how far a phrase reaches across a page's edge.
sidekicks-contracts = { workspace = true, optional = true }
sidekicks-platforms = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
# The memory map, built on every platform; `sidekicks-platforms` says where the index maps files.
tantivy = { workspace = true, features = ["mmap"], optional = true }
# Tantivy's own bit set, at the version Tantivy builds with, so the two crates share the type.
tantivy-common = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
unicode-properties = { workspace = true, optional = true }
writeable = { workspace = true, optional = true }

[dev-dependencies]
# The case fold the index's fold is held equal to.
caseless.workspace = true
rstest.workspace = true
# The process's footprint and the `uptime` line the measurements read.
sidekicks-platforms = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[features]
# The index, which only the daemon builds.
index = [
  "dep:icu_casemap",
  "dep:lru",
  "dep:serde",
  "dep:serde_json",
  "dep:sidekicks-contracts",
  "dep:sidekicks-platforms",
  "dep:strum",
  "dep:tantivy",
  "dep:tantivy-common",
  "dep:thiserror",
  "dep:unicode-normalization",
  "dep:unicode-properties",
  "dep:writeable",
]
# The index's budget measurements, compiled into the tests only when asked for.
measurements = ["index"]
# What another crate's tests read of an index: the documents left under a row's key.
test-support = ["index"]

[lints]
workspace = true
