[package]
name = "text-compression"
version = "0.1.0"
edition = "2024"
publish = false
description = "Packs and unpacks 16 KiB chunks of text with LZ4, in a WebAssembly module."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The block format alone: no frames, no standard library, and no unsafe code in the codec.
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode"] }
