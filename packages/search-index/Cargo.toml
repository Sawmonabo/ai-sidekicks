[package]
name = "search-index"
version = "0.1.0"
edition = "2024"
publish = false
description = "The daemon's session search index: Tantivy in a Node-API addon."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
caseless = "0.2.2"
lru = "0.18.5"
napi = "3.14.2"
napi-derive = "3.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# No stemmer, stop words, document-store compression or zstd columns: the index stores no text
# and folds its own tokens. Of Tantivy's default features only `mmap` is used, on macOS below.
tantivy = { version = "0.26.2", default-features = false }
# Tantivy's own bit set, which its `BitSetDocSet` walks; Tantivy does not re-export it. The version
# is the one Tantivy itself builds with, so the two crates share the type.
tantivy-common = "0.11.0"
unicode-normalization = "0.1.25"
unicode-properties = { version = "0.1.4", default-features = false, features = [
  "general-category",
] }

# The memory-mapped reader is built for macOS alone, where it measures the smaller footprint; every
# other target reads index files by positioned reads.
[target.'cfg(target_os = "macos")'.dependencies]
tantivy = { version = "0.26.2", default-features = false, features = ["mmap"] }
# The measurement runs read macOS's own footprint figure for the test process.
libc = { version = "0.2.186", optional = true }

[features]
# The budgets' measurement runs, compiled into the tests only when asked for.
measurements = ["dep:libc"]

[build-dependencies]
napi-build = "2.6.0"
