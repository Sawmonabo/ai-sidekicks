# Cloudflare Workers config for the control-plane bootstrap.
#
# Dual-gate enforcement: this file deliberately omits top-level [vars] so neither
# `CONTROL_PLANE_BOOTSTRAP_ENABLED` nor `ENVIRONMENT="development"` reaches any deployable surface.
# Both keys live in the gitignored `.dev.vars` file, which `wrangler dev` reads for local workerd
# development but `wrangler deploy` never consults.
#
# `[env.production.vars]` carries `ENVIRONMENT="production"` so `wrangler deploy --env production`
# publishes a Worker whose dev-environment allow-list gate (`env.ENVIRONMENT === 'development'`)
# returns false even if a hypothetical `wrangler secret put CONTROL_PLANE_BOOTSTRAP_ENABLED 1` is
# run after deploy.

name = "ai-sidekicks-control-plane"
main = "src/server/host.ts"
compatibility_date = "2026-04-30"

[env.production.vars]
ENVIRONMENT = "production"

# The sign-in routes' counter: one Durable Object per source address, so an address meets one
# count whichever edge location serves it. Its class is exported from `main`.
[[durable_objects.bindings]]
name = "RATE_LIMIT_IDENTITY"
class_name = "RateLimitIdentityDO"

# An environment inherits no Durable Object binding, so production declares its own.
[[env.production.durable_objects.bindings]]
name = "RATE_LIMIT_IDENTITY"
class_name = "RateLimitIdentityDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitIdentityDO"]
