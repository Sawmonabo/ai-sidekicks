# lefthook 2.1.6 configuration per ADR-023 §Axis 2.
#
# Job ORDER is load-bearing, not stylistic. `lint-staged` rewrites staged files
# (`prettier --write`, `eslint --fix`) and re-stages them twice over: once itself
# (`git add` inside lint-staged's `applyModifications`) and once via `stage_fixed: true`
# when the job exits. Every screen below screens INDEX content — the blob set that
# commits: `gitleaks --staged` scans the index. Run concurrently with lint-staged, a
# screen can pass over a blob that is NOT the one committed: the commit then carries
# unscreened content and the hook still reports clean. The screens therefore run AFTER
# lint-staged, never beside it. Do not "optimize" this back to a flat parallel list.
#
# Parallelism is preserved where it is safe and still pays: the screens run
# concurrently with each other (ADR-023 §Axis 2 Synthesis item 1 — Husky has no
# parallel primitive at all). Measured cost of the ordering, end-to-end on this
# repo (three timed runs per shape over the same staged diff): ~1.4s -> ~2.4s
# p50 (including the docs-anchor-check index materialization), still inside the
# <5s p99 budget.
#
# CI parity for the `git commit --no-verify` bypass closure (ADR-023 §Axis 2 D-1) is
# enforced via explicit `eslint .` + `prettier --check .` invocations in
# `.github/workflows/ci.yml`. lint-staged reads the git staging index, which is empty
# in a fresh CI checkout — running `lefthook run pre-commit --all-files` from CI
# would be an empirical no-op.

min_version: "2.1.6"

# Sourced by every generated git hook, immediately before lefthook is called
# (`internal/templates/hook.tmpl` emits `[ -f <rc> ] && . <rc>`). For `pre-commit`
# it takes a repository-wide mutex so two linked worktrees never sit inside
# lefthook's unstaged-changes backup window at once — that backup lives in the
# COMMON git dir (`--git-path info` resolves there for a linked worktree) plus the
# shared `refs/stash`, so concurrent runs overwrite and drop each other's. The rc
# file is the only repo-owned code that can wrap it: the backup opens before the
# first job below runs and closes after the last one, so nothing declared in this
# file is inside it. See `tools/lefthook-worktree-lock.mjs` for the primary sources
# and `CONTRIBUTING.md` §Pre-Commit Hooks for the operator-facing description.
rc: tools/lefthook-rc.sh

pre-commit:
  # Sequential at the top level so the screens observe lint-staged's re-staged output.
  parallel: false
  jobs:
    - name: lint-staged
      run: pnpm exec lint-staged --concurrent false
      stage_fixed: true

    # Screens read what lint-staged just wrote, so they sit after it.
    - name: screens
      group:
        parallel: true
        jobs:
          - name: gitleaks
            # Canonical gitleaks version is v8.30.1 per ADR-023 §Axis 4 sub-axis 4,
            # pinned identically here (local fast-feedback) and in
            # `.github/workflows/gitleaks.yml` (`env.GITLEAKS_VERSION`, authoritative
            # CI gate). The floor check below surfaces local-vs-CI drift loudly when
            # the installed binary is below v8.30.1 — v8.25-v8.30 added rules +
            # generic-api-key heuristics older binaries don't catch, so silently
            # running an older version would defeat the hook's fast-feedback purpose
            # (BL-126 closure). Floor (not exact-match) so future minor/patch bumps
            # work without lockstep config; majors trigger a coordinated bump of
            # workflow `env.GITLEAKS_VERSION` + ADR-023 + this floor + CONTRIBUTING.md.
            # `gitleaks protect --staged` was hidden in v8.19+ help and replaced by
            # `gitleaks git --pre-commit --staged`; use the supported invocation.
            # The hook surfaces drift via `WARNING:` (not exit-1) — CI is the
            # authoritative gate, so local drift becomes visible without blocking
            # the developer mid-flow.
            run: |
              if command -v gitleaks >/dev/null 2>&1; then
                required="8.30.1"
                installed=$(gitleaks version 2>/dev/null | sed 's/^v//' | head -1)
                if [ -n "$installed" ] && [ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -1)" != "$required" ]; then
                  echo "WARNING: gitleaks v$installed is below canonical v$required (CI runs v$required)." >&2
                  echo "WARNING: Per CONTRIBUTING.md §Pre-Commit Hooks: brew upgrade gitleaks" >&2
                fi
                gitleaks git --pre-commit --staged --no-banner --redact
              else
                echo "WARNING: gitleaks not installed locally; CI gitleaks job is the authoritative gate." >&2
                echo "WARNING: Install per CONTRIBUTING.md §Pre-Commit Hooks or https://github.com/gitleaks/gitleaks" >&2
              fi

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
