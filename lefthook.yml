# lefthook configuration.
#
# Job order is load-bearing. `lint-staged` rewrites staged files (`prettier --write`,
# `eslint --fix`) and re-stages them twice: once itself (`git add` inside lint-staged's
# `updateIndex`) and once via `stage_fixed: true` when the job exits. Every screen below
# reads index content, the blob set that commits (`gitleaks --staged` scans the index). Run
# concurrently with lint-staged, a screen can pass over a blob that is not the one committed, so the
# screens run after lint-staged, never beside it.
#
# The screens run concurrently with each other.
#
# CI closes the `git commit --no-verify` bypass with explicit `eslint .` and `prettier --check .`
# runs in `.github/workflows/ci.yml`. It cannot reuse this hook: lint-staged reads the git staging
# index, which is empty in a fresh CI checkout, so `lefthook run pre-commit --all-files` would do
# nothing.

# Sourced by every generated git hook immediately before lefthook is called
# (`internal/templates/hook.tmpl` emits `[ -f <rc> ] && . <rc>`). For `pre-commit` it takes a
# repository-wide mutex so two linked worktrees never sit inside lefthook's unstaged-changes backup
# window at once: that backup lives in the common git dir (`--git-path info` resolves there for a
# linked worktree) plus the shared `refs/stash`, so concurrent runs overwrite and drop each other's.
# The rc file is the only repo-owned code that can wrap the window, since it opens before the first
# job below runs and closes after the last. See `tools/lefthook-worktree-lock.mjs` for the primary
# sources and `CONTRIBUTING.md` §Hooks for what the hooks need from you.
rc: tools/lefthook-rc.sh

# The generated hooks run the first `lefthook` on PATH, so a copy installed another way (Homebrew)
# would run instead of the version this repository pins. This points them at the installed one.
lefthook: node_modules/.bin/lefthook

pre-commit:
  # Sequential at the top level so the screens observe lint-staged's re-staged output.
  parallel: false
  jobs:
    - name: lint-staged
      run: pnpm exec lint-staged --concurrent false
      stage_fixed: true

    # Screens read what lint-staged just wrote, so they sit after it.
    - name: screens
      group:
        parallel: true
        jobs:
          - name: gitleaks
            # `gitleaks git --pre-commit --staged` scans what is about to be committed. A machine
            # without gitleaks gets a warning, not a failure: the CI scan in
            # `.github/workflows/gitleaks.yml` is the gate that holds.
            run: |
              if command -v gitleaks >/dev/null 2>&1; then
                gitleaks git --pre-commit --staged --no-banner --redact
              else
                echo "WARNING: gitleaks not installed locally; CI gitleaks job is the authoritative gate." >&2
                echo "WARNING: Install per CONTRIBUTING.md §Hooks or https://github.com/gitleaks/gitleaks" >&2
              fi

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
