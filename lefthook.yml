# lefthook 2.1.6 configuration per ADR-023 §Axis 2.
#
# Job ORDER is load-bearing, not stylistic. `lint-staged` rewrites staged files
# (`prettier --write`, `eslint --fix`) and re-stages them twice over: once itself
# (`git add` inside lint-staged's `applyModifications`) and once via `stage_fixed: true`
# when the job exits. Every screen below reads a substrate lint-staged mutates —
# `docs-corpus-checks` reads INDEX content (`git show :path`), `gitleaks --staged`
# reads the same index, and `docs-anchor-check` reads the worktree, which lint-staged
# stashes and force-checks-out mid-run. Run concurrently with lint-staged, a screen
# can pass over a blob that is NOT the one committed: the commit then carries
# unscreened content and the hook still reports clean. Worse, the docs-corpus reader
# memoizes per path, so one run can mix two index generations and validate a citer
# against a target that never coexisted with it. The screens therefore run AFTER
# lint-staged, never beside it. Do not "optimize" this back to a flat parallel list.
#
# Parallelism is preserved where it is safe and still pays: the three screens run
# concurrently with each other (ADR-023 §Axis 2 Synthesis item 1 — Husky has no
# parallel primitive at all). Measured cost of the ordering, end-to-end on this
# repo (three timed runs per shape over the same staged diff): ~1.4s -> ~2.3s
# p50, still inside the <5s p99 budget.
#
# CI parity for the `git commit --no-verify` bypass closure (ADR-023 §Axis 2 D-1) is
# enforced via explicit `eslint .` + `prettier --check .` invocations in
# `.github/workflows/ci.yml`. lint-staged reads the git staging index, which is empty
# in a fresh CI checkout — running `lefthook run pre-commit --all-files` from CI
# would be an empirical no-op.

min_version: "2.1.6"

pre-commit:
  # Sequential at the top level so the screens observe lint-staged's re-staged output.
  parallel: false
  jobs:
    - name: lint-staged
      run: pnpm exec lint-staged --concurrent false
      stage_fixed: true

    # All three read what lint-staged just wrote, so they sit after it — but they are
    # mutually independent, so they run concurrently with each other.
    - name: screens
      group:
        parallel: true
        jobs:
          - name: gitleaks
            # Canonical gitleaks version is v8.30.1 per ADR-023 §Axis 4 sub-axis 4,
            # pinned identically here (local fast-feedback) and in
            # `.github/workflows/gitleaks.yml` (`env.GITLEAKS_VERSION`, authoritative
            # CI gate). The floor check below surfaces local-vs-CI drift loudly when
            # the installed binary is below v8.30.1 — v8.25-v8.30 added rules +
            # generic-api-key heuristics older binaries don't catch, so silently
            # running an older version would defeat the hook's fast-feedback purpose
            # (BL-126 closure). Floor (not exact-match) so future minor/patch bumps
            # work without lockstep config; majors trigger a coordinated bump of
            # workflow `env.GITLEAKS_VERSION` + ADR-023 + this floor + CONTRIBUTING.md.
            # `gitleaks protect --staged` was hidden in v8.19+ help and replaced by
            # `gitleaks git --pre-commit --staged`; use the supported invocation.
            # The hook surfaces drift via `WARNING:` (not exit-1) — CI is the
            # authoritative gate, so local drift becomes visible without blocking
            # the developer mid-flow.
            run: |
              if command -v gitleaks >/dev/null 2>&1; then
                required="8.30.1"
                installed=$(gitleaks version 2>/dev/null | sed 's/^v//' | head -1)
                if [ -n "$installed" ] && [ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -1)" != "$required" ]; then
                  echo "WARNING: gitleaks v$installed is below canonical v$required (CI runs v$required)." >&2
                  echo "WARNING: Per CONTRIBUTING.md §Pre-Commit Hooks: brew upgrade gitleaks" >&2
                fi
                gitleaks git --pre-commit --staged --no-banner --redact
              else
                echo "WARNING: gitleaks not installed locally; CI gitleaks job is the authoritative gate." >&2
                echo "WARNING: Install per CONTRIBUTING.md §Pre-Commit Hooks or https://github.com/gitleaks/gitleaks" >&2
              fi

          # Doc-corpus regression checks (extends ADR-023 §Axis 2 pre-commit chain).
          # Staged-impact-only to stay inside the <5s p99 latency budget (current
          # end-to-end measurement: ~2.3s p50 — see the header comment).
          # Full-repo sweep runs in CI (.github/workflows/docs-corpus.yml).
          # See docs/operations/failure-mode-catalog.md for the catalog these enforce.
          - name: docs-anchor-check
            # lychee — inbound `file.md#anchor` + outbound link verification.
            # `pnpm install` provisions lychee at node_modules/.bin/lychee via
            # tools/install-lychee.mjs (postinstall). The conditional remains
            # graceful: if `--ignore-scripts` was used, fresh-clone state without
            # `pnpm install` ran, etc., the WARNING surfaces and CI is the
            # authoritative gate.
            glob: "*.md"
            run: |
              if command -v lychee >/dev/null 2>&1; then
                lychee --offline --no-progress --config .lychee.toml {staged_files}
              elif [ -x node_modules/.bin/lychee ]; then
                node_modules/.bin/lychee --offline --no-progress --config .lychee.toml {staged_files}
              else
                echo "WARNING: lychee not installed locally; CI docs-corpus job is the authoritative gate." >&2
                echo "WARNING: Run 'pnpm install' to provision, or 'cargo install lychee' for a system install." >&2
              fi

          - name: docs-corpus-checks
            # Single dispatch script (tools/docs-corpus/bin/pre-commit-runner.ts) that
            # composes the lib/ checks: path-canonical-ripple (whole-repo sweep),
            # plan-manifest-presence (whole-repo), mermaid-set-coherence (PR #27 round
            # 2 hard-signal), cite-target-existence (file.md:NNN truncation floor),
            # label-cite (governance Spec-NNN:LL cites in packages/+apps/ code comments),
            # and table-total-coherence (corpus:total-check column re-sum vs Total row + prose total).
            run: node --experimental-strip-types tools/docs-corpus/bin/pre-commit-runner.ts {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
