name: Assert better-sqlite3 loads a bundled Node-API prebuild
description: >-
  Asserts the daemon's better-sqlite3 loads the tarball's bundled Node-API prebuild, never a source compile.


runs:
  using: composite
  steps:
    # The daemon's `better-sqlite3` must come from the tarball's bundled Node-API prebuild, never
    # a source compile. This asserts provenance in two conjuncts:
    #
    #   (a) the binding the daemon resolves, read from `require.cache` after a real
    #       `new Database()` (so a prebuild that resolves but will not load also fails), lives
    #       under `prebuilds/<platform>-<arch>.node`; and
    #   (b) `build/Release/` holds no `.node`, the one place a source build writes.
    #
    # `node-gyp` never runs for this package: it declares no install script, and
    # `pnpm-workspace.yaml` denies the implicit `node-gyp rebuild` npm synthesizes for a
    # `binding.gyp` (`allowBuilds: better-sqlite3: false`). Approving that build would fail
    # `pnpm install` on `windows-latest`, where node-gyp 11.5.0 cannot parse the image's Visual
    # Studio 18 install, though the prebuild is in the tarball. Denying it also makes (b)
    # absolute.
    #
    # The `native-prebuilds` job in `ci.yml` is not a duplicate: this step checks the full
    # workspace install on one platform; that job checks a scoped install on all five target
    # platforms and also reads back the database pragmas.
    - name: Assert better-sqlite3 loads a bundled Node-API prebuild
      shell: bash
      run: |
        cat > "${RUNNER_TEMP}/assert-better-sqlite3-prebuild.mjs" <<'NODE'
        import { createRequire } from "node:module";
        import { existsSync, readdirSync } from "node:fs";
        import path from "node:path";
        import { pathToFileURL } from "node:url";

        // `pathToFileURL`, not a `file://` template: a Windows cwd is
        // `D:\a\...` and `file://D:\a\...` is not a valid file URL. The `test`
        // job's matrix is Linux-only, but the `native-prebuilds` job in `ci.yml` runs
        // the same resolution on `windows-latest`, so the two forms must not drift.
        const daemonRequire = createRequire(
          new URL("packages/runtime-daemon/package.json", pathToFileURL(`${process.cwd()}/`)),
        );

        const DatabaseConstructor = daemonRequire("better-sqlite3");
        new DatabaseConstructor(":memory:").close();

        const loadedBindings = Object.keys(daemonRequire.cache).filter((entry) =>
          entry.endsWith(".node"),
        );
        if (loadedBindings.length !== 1) {
          throw new Error(
            `expected exactly one loaded .node binding, saw ${JSON.stringify(loadedBindings)}`,
          );
        }
        const [loadedBinding] = loadedBindings;
        if (!/[/\\]prebuilds[/\\](darwin|linux|linuxmusl|win32)-(x64|arm64)\.node$/.test(loadedBinding)) {
          throw new Error(`better-sqlite3 did not load a tarball prebuild: ${loadedBinding}`);
        }

        const packageRoot = path.dirname(daemonRequire.resolve("better-sqlite3/package.json"));
        const releaseDirectory = path.join(packageRoot, "build", "Release");
        const compiledArtifacts = existsSync(releaseDirectory)
          ? readdirSync(releaseDirectory).filter((entry) => entry.endsWith(".node"))
          : [];
        if (compiledArtifacts.length > 0) {
          throw new Error(
            `build/Release holds compiled artifacts (a source build ran): ${JSON.stringify(compiledArtifacts)}`,
          );
        }

        console.log(`loaded prebuild: ${loadedBinding}`);
        console.log(`build/Release holds no .node: ${releaseDirectory}`);
        NODE
        node "${RUNNER_TEMP}/assert-better-sqlite3-prebuild.mjs"
