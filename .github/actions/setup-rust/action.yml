name: Set up Rust
description: >-
  Installs a Rust toolchain with the targets a job names and, when asked, cargo-nextest.


inputs:
  toolchain:
    description: The Rust toolchain to install; the newest stable Rust unless a job names one.
    required: false
    default: stable
  targets:
    description: Comma-separated extra targets to install with the toolchain.
    required: false
    default: ""
  nextest:
    description: Whether to install cargo-nextest, as `true` or `false`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The one place the toolchain action is pinned, by SHA; Renovate's pinGitHubActionDigests
    # preset (renovate.json5) keeps it current.
    - name: Install the Rust toolchain
      uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}

    # The crates' tests run through `cargo nextest` (`turbo.json`): its prebuilt binary for the
    # runner's system, one exact release, checked against its pinned SHA-256 before it is unpacked.
    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      shell: bash
      run: |
        VERSION="0.9.148"
        case "$RUNNER_OS" in
          Linux)
            ASSET="cargo-nextest-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            SHA256="223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc"
            ;;
          macOS)
            ASSET="cargo-nextest-${VERSION}-universal-apple-darwin.tar.gz"
            SHA256="6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b"
            ;;
          *)
            echo "::error::no pinned cargo-nextest release for $RUNNER_OS"
            exit 1
            ;;
        esac
        curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${VERSION}/${ASSET}" -o "${RUNNER_TEMP}/${ASSET}"
        echo "${SHA256}  ${RUNNER_TEMP}/${ASSET}" | shasum -a 256 -c -
        tar -xzf "${RUNNER_TEMP}/${ASSET}" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
