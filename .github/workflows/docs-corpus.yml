# Doc-corpus integrity CI, two checks and one aggregator.
#
#   1. lychee-inbound — file:// + anchor integrity, offline. The PR-introduced
#      regression we own: a broken `[text](./file.md#anchor)` cite. Required via
#      docs-corpus-gate, and path-filtered — a PR touching no markdown skips it.
#   2. table-check — markdown table shape (every row carries the header's cell
#      count). Dependency-free, so it needs no install.
#   3. lychee-outbound — outbound HTTP probe, online. Third-party drift and link
#      rot we do not own (WAFs rejecting bot user agents, remotes timing out).
#      It runs on a weekly schedule, never on a PR, and files an issue when it
#      finds rot. The split reflects the real error model: an outbound failure
#      means a third-party server misbehaved; an inbound failure means the PR
#      introduced a broken anchor.
#
# Branch protection on main requires the `docs-corpus-gate` job (only); develop
# requires no check. Per ADR-023 §Axis 1, individual jobs are not stable
# required-check targets — the aggregator pattern is. The gate treats a skipped
# job as success, so a path filter never leaves it pending.
#
# The lychee install is duplicated across the inbound + outbound jobs (inline
# curl + sha256 verify against the v0.24.2 musl-static asset). Keep the two
# `LYCHEE_VERSION` constants in sync — two sites, one binary.

name: docs-corpus

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Weekly outbound link-rot sweep. Nothing else in this workflow runs on it.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Did this event touch anything the corpus checks read? A workflow-level
  # `paths:` filter would suppress the check entirely, which a required check on
  # `main` reads as permanently pending; a job-level `if:` reports `skipped`,
  # which the aggregator accepts.
  changes:
    name: changed paths
    # The weekly sweep runs only lychee-outbound, which reads nothing here.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `|| 'true'` is the off-pull-request default: the filter step runs only
      # where a base ref gives it a diff to classify, so a push does the full
      # sweep.
      docs: ${{ steps.filter.outputs.docs || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'tools/docs-corpus/**'
              - '.lychee.toml'

  lychee-inbound:
    name: lychee — inbound anchors (required)
    needs: [changes]
    # A push to `main` always sweeps, whatever the diff touched: it is the
    # branch whose protection names this workflow's gate. On a pull request
    # `github.ref` is the merge ref, so the filter alone decides there.
    if: needs.changes.outputs.docs == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Inline install, pinned to v0.24.2, musl-static, SHA256-verified.
      # `lycheeverse/lychee-action@v2` is broken for v0.24.x: its install script
      # runs `tar -xvzf` without `--strip-components=1` and the binary lands at
      # `lychee-<triple>/lychee` instead of the flat `lychee` it then installs.
      # Keep `LYCHEE_VERSION` here in sync with the lychee-outbound job below.
      - name: Install lychee v0.24.2
        run: |
          set -euo pipefail
          LYCHEE_VERSION="v0.24.2"
          BASE="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}"
          ASSET="lychee-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "${BASE}/${ASSET}" -o /tmp/lychee.tar.gz
          curl -fsSL "${BASE}/${ASSET}.sha256" -o /tmp/lychee.sha256
          EXPECTED=$(awk '{print $1}' /tmp/lychee.sha256)
          ACTUAL=$(sha256sum /tmp/lychee.tar.gz | awk '{print $1}')
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "SHA256 mismatch: expected ${EXPECTED}, got ${ACTUAL}" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/lychee.tar.gz -C "${HOME}/.local/bin" --strip-components=1
          chmod +x "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run lychee (offline — inbound file refs + anchors)
        # file:// resolution + anchor checks (`include_fragments = "full"`
        # from `.lychee.toml`). This is the PR-introduced regression we own: a
        # broken `[text](./file.md#anchor)` cite from a code or doc edit fails
        # here. Pre-commit runs no link check — it is too slow to sit in front
        # of every commit — so this is the only place the invariant is verified.
        run: |
          lychee --offline --no-progress --config .lychee.toml './**/*.md'

  lychee-outbound:
    name: lychee — outbound HTTP (weekly)
    # Weekly only. It used to run on every PR as an advisory check, where its
    # single product was a yellow annotation nobody was accountable for: a
    # third-party 502 is not caused by the PR it appears on and cannot be fixed
    # by its author. On a schedule the same finding becomes an issue with an
    # owner and a log, and PR runs lose a whole-repo HTTP sweep.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh issue create` below is the job's product.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Inline install, pinned to v0.24.2, musl-static, SHA256-verified.
      # `lycheeverse/lychee-action@v2` is broken for v0.24.x: its install script
      # runs `tar -xvzf` without `--strip-components=1` and the binary lands at
      # `lychee-<triple>/lychee` instead of the flat `lychee` it then installs.
      # Keep `LYCHEE_VERSION` here in sync with the lychee-inbound job above.
      - name: Install lychee v0.24.2
        run: |
          set -euo pipefail
          LYCHEE_VERSION="v0.24.2"
          BASE="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}"
          ASSET="lychee-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "${BASE}/${ASSET}" -o /tmp/lychee.tar.gz
          curl -fsSL "${BASE}/${ASSET}.sha256" -o /tmp/lychee.sha256
          EXPECTED=$(awk '{print $1}' /tmp/lychee.sha256)
          ACTUAL=$(sha256sum /tmp/lychee.tar.gz | awk '{print $1}')
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "SHA256 mismatch: expected ${EXPECTED}, got ${ACTUAL}" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/lychee.tar.gz -C "${HOME}/.local/bin" --strip-components=1
          chmod +x "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run lychee (online — outbound HTTP probes) and file an issue on rot
        # Whole-repo HTTP probing for outbound link rot. `--include-fragments=
        # none` disables anchor checking on HTTP-fetched pages (anchors on
        # JS-rendered third-party docs aren't in the static HTML lychee parses
        # — Node.js / NIST / Cloudflare / Docusaurus / Sphinx / Swagger UI all
        # do this). Inbound `file.md#anchor` checks are covered by the offline
        # pass in `lychee-inbound`. The accept-list for 200..=299 and 429 lives
        # in `.lychee.toml` so the same policy applies whichever runner invokes
        # lychee.
        #
        # The retry absorbs transient runner-network flakes ("Connection failed"
        # on healthy hosts that answer 200 from any other vantage). lychee's
        # per-URL `max_retries` is already 2, but a whole-run flake (DNS hiccup,
        # a packet drop in the runner's egress path) retries every URL together.
        # One outer attempt after a 15s pause catches the observed flakes and
        # still surfaces real rot when both passes agree.
        #
        # The step exits 0 after filing the issue: the issue IS the signal, and
        # a red weekly run that nobody owns is the noise this job was moved off
        # pull requests to escape.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt() {
            lychee --no-progress --config .lychee.toml --include-fragments=none './**/*.md' \
              2>&1 | tee -a "${RUNNER_TEMP}/lychee-outbound.log"
            return "${PIPESTATUS[0]}"
          }
          : > "${RUNNER_TEMP}/lychee-outbound.log"
          if attempt; then
            echo "ok: no outbound link rot"
            exit 0
          fi
          echo "lychee online pass failed; retrying once after 15s to absorb runner-network flakes" >&2
          sleep 15
          : > "${RUNNER_TEMP}/lychee-outbound.log"
          if attempt; then
            echo "ok: no outbound link rot (second attempt)"
            exit 0
          fi
          {
            echo "The weekly outbound link sweep found broken external links."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            # Bounded so a wholesale outage cannot exceed the issue-body limit;
            # the full log is in the run linked above.
            tail -c 50000 "${RUNNER_TEMP}/lychee-outbound.log"
            echo '```'
          } > "${RUNNER_TEMP}/issue-body.md"
          gh issue create \
            --title "Outbound link rot: weekly lychee sweep $(date -u +%Y-%m-%d)" \
            --body-file "${RUNNER_TEMP}/issue-body.md"
          echo "::warning title=lychee outbound rot::Outbound HTTP probe found broken external links; an issue was filed."

  table-check:
    name: table shape (markdown)
    # The weekly sweep runs lychee-outbound and nothing else.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No pnpm at all: the checker is dependency-free by design, so this job
      # needs a Node runtime and nothing else. `package-manager-cache: false` is
      # load-bearing — setup-node v5 auto-enables pnpm caching from
      # package.json's `packageManager` field, and its post-job cache save then
      # fails the job over a pnpm store this job never creates.
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          package-manager-cache: false
      - run: git ls-files '*.md' ':!docs/archive/**' | xargs node tools/docs-corpus/table-arity.mjs

  docs-corpus-gate:
    name: docs-corpus-gate
    runs-on: ubuntu-latest
    needs: [changes, lychee-inbound, table-check]
    if: always()
    steps:
      - name: Aggregate required-checks status
        # One predicate for every job: `skipped` counts as success, so a
        # path-filtered job that did not need to run cannot hold the gate
        # pending. `cancelled` and `failure` are neither accepted result and
        # still fail here.
        #
        # `changes` is checked too. A path filter that ERRORS skips every job
        # that needs it, and a skip is indistinguishable from a filter miss — so
        # without this line a broken filter would take `lychee-inbound` down
        # with it and still leave the gate green. On the weekly schedule
        # `changes` is legitimately skipped, which the helper accepts.
        run: |
          fail=0
          check() {
            if [[ "$2" != "success" && "$2" != "skipped" ]]; then
              echo "docs-corpus-gate: job '$1' did not succeed (result=$2)"
              fail=1
            fi
          }
          check changes "${{ needs.changes.result }}"
          check lychee-inbound "${{ needs.lychee-inbound.result }}"
          check table-check "${{ needs.table-check.result }}"
          if [[ $fail -ne 0 ]]; then exit 1; fi
          echo "docs-corpus-gate: all required jobs succeeded or were skipped by path filter"
