# Mutation testing over the packages, called by `ci.yml` as its `mutation` job wherever that
# workflow's `slow-jobs` is set: informational, no score threshold, and outside `ci-gate`, so it
# never holds a merge. StrykerJS has no sharding, so `tools/mutation-shards.mjs` splits each
# package's source files into shards balanced by the tests their mutants ran last time, and the
# matrix runs every shard in parallel against the package's saved results.
#
# A pull request into main mutates only the files it changed, re-tests only the mutants whose code
# or covering tests changed since the saved results, and skips static mutants (module-level code,
# which re-runs the whole suite per mutant). The nightly run and a manual run mutate every file,
# static mutants included, and the merge job saves the combined results. A cold full run is hours
# of runner time (the daemon alone is over three hours on a fast laptop), hence the long time
# limit, which only stops a hung job.
#
# A called workflow reads the caller's `github` context, so the event checks below are `ci.yml`'s
# event. It sets no `concurrency`: its group would name the caller's workflow, the group of the run
# that called it, which GitHub cancels as a deadlock.

name: Mutation

on:
  workflow_call:

permissions:
  contents: read

env:
  # As in `ci.yml`: empty except on `schedule`, where checkout would otherwise test the default
  # branch instead of `develop`.
  SWEEP_REF: ${{ github.event_name == 'schedule' && 'refs/heads/develop' || '' }}

jobs:
  mutation-plan:
    name: mutation plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      # Shards per package, sized from the measured full-run cost and kept to
      # 19 jobs in all, under the 20 jobs a free plan runs at once.
      MUTATION_SHARDS: '{"client-sdk": 1, "contracts": 3, "control-plane": 2, "crypto-paseto": 1, "runtime-daemon": 12}'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}
          # A pull request's changed files are read against its base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job runs no install; with pnpm absent, the cache lookup fails.
          package-manager-cache: false

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Plan shards
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "matrix=$(node tools/mutation-shards.mjs plan)" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation (${{ matrix.package }} ${{ matrix.shard }})
    needs: [mutation-plan]
    if: needs.mutation-plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Restore the daemon's SQLite shell
        uses: ./.github/actions/restore-sqlite-shell

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      # The daemon's unit tests load the session search's addon, which its build compiles from
      # Rust. SHA-pinned.
      - name: Set up Rust
        if: matrix.package == 'runtime-daemon'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Build the session search's addon
        if: matrix.package == 'runtime-daemon'
        run: pnpm --filter @ai-sidekicks/search-index run build

      # A pull request's summary lists the surviving mutants in the files it
      # changed; a full run's summary is the score table.
      - name: Mutation testing
        working-directory: packages/${{ matrix.package }}
        env:
          MUTATE: ${{ matrix.mutate }}
          SHARD: ${{ matrix.shard }}
          PACKAGE: ${{ matrix.package }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          report="$RUNNER_TEMP/mutation.txt"
          status=0
          static=()
          [[ "$PULL_REQUEST" == "true" ]] && static=(--ignoreStatic)
          pnpm exec stryker run ../../stryker.config.json --mutate "$MUTATE" "${static[@]}" > "$report" 2>&1 || status=$?
          {
            echo "### Mutation testing: $PACKAGE, shard $SHARD"
            echo '```text'
            if [[ $status -ne 0 ]]; then
              tail -n 60 "$report"
            elif [[ "$PULL_REQUEST" == "true" ]]; then
              grep -Ev '^[0-9]{2}:[0-9]{2}:[0-9]{2} \([0-9]+\) (INFO|DEBUG)' "$report"
            else
              sed -n '/tests per mutant on average/,$p' "$report" | grep -Ev ' (INFO|DEBUG) '
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Record the shard's files
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MUTATE: ${{ matrix.mutate }}
        run: printf '%s\n' "$MUTATE" > "packages/${{ matrix.package }}/.stryker/mutated-files.txt"

      - name: Upload shard results
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}--${{ matrix.shard }}
          path: |
            packages/${{ matrix.package }}/.stryker/incremental.json
            packages/${{ matrix.package }}/.stryker/mutated-files.txt
          # The results live under the package's `.stryker/` folder, which
          # upload-artifact skips as hidden unless told otherwise.
          include-hidden-files: true
          retention-days: 1

  # Folds every shard's results over the saved ones and saves them for the next
  # run. A shard that failed or timed out leaves its files' earlier results in
  # place. A scheduled run's cache scope is the default branch, which every
  # branch reads; a manual run saves into the scope of the ref it ran on.
  mutation-merge:
    name: mutation merge
    needs: [mutation]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job runs no install; with pnpm absent, the cache lookup fails.
          package-manager-cache: false

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          # Shard artifacts are named `<package>--<shard>`; the run's other artifacts are not shards.
          pattern: "*--*"
          path: ${{ runner.temp }}/mutation-shards

      - name: Merge
        run: node tools/mutation-shards.mjs merge "$RUNNER_TEMP/mutation-shards"

      - name: Save mutation results
        uses: actions/cache/save@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
