# The Rust crates' tests on macOS, called by `ci.yml` as its `macos-crates` job, which `ci-gate`
# needs: the operating-system crate, whose macOS caller read rests on a private system call, so a
# macOS that changes or drops it fails here.
#
# A called workflow reads the caller's `github` context, so the event check below is `ci.yml`'s
# event.

name: macOS crates

on:
  workflow_call:

permissions:
  contents: read

env:
  # As in `ci.yml`: empty except on `schedule`, where checkout would otherwise test the default
  # branch instead of `develop`.
  SWEEP_REF: ${{ github.event_name == 'schedule' && 'refs/heads/develop' || '' }}

jobs:
  platforms-macos:
    name: platforms (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      # Any Cargo warning fails the build, rustdoc's included, without discarding Cargo's cache.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SWEEP_REF }}

      # The same Rust set-up as `ci.yml`'s `test` job, cargo-nextest included.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          nextest: "true"

      - name: Test the operating-system crate
        run: cargo nextest run -p sidekicks-platforms --locked
