# Secret scan with gitleaks. GitHub's native secret scanning and push protection are the primary
# defense; this workflow is the CI-side second pass and complements the local lefthook gitleaks
# step.

name: Secret Scan

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# Same event-split concurrency as ci.yml: pull-request runs cancel superseded pushes; runs on
# develop and main queue serially.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for delta scan)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned to the same version as the lefthook step so local-versus-CI drift cannot mask
          # findings. `gitleaks-action` reads this at runtime and downloads that release.
          GITLEAKS_VERSION: 8.30.1
          # No GITLEAKS_LICENSE is needed for a public repo; a private repo must register that
          # secret or this job fails.
