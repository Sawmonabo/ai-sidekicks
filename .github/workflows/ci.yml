# Default permissions are read-only; a job opts up only where it needs to. Pull-request runs cancel
# in progress; runs on develop and main do not.
#
# Branch protection on main requires only the `ci-gate` job; develop requires no check. Matrix leg
# names embed strategy values, so they are not stable required-check targets.
#
# Most jobs are path-filtered by `changes` and report `skipped` when their paths are untouched;
# `ci-gate` treats `skipped` as success. The nightly schedule runs everything unfiltered so red that
# a filter let through is found within a day.
#
# A pull request into `develop` runs only the fast jobs, so its checks finish within about ten
# minutes. The slow jobs (mutation testing, the desktop end-to-end tier, and the native prebuild
# matrix) run on the nightly schedule, on pull requests into `main`, and on a manual run; `changes`
# sets `slow-jobs` for those events.
#
# The full-repo `eslint .` and `prettier --check .` steps close the `git commit --no-verify` bypass.
# They do not go through lefthook, because lint-staged reads the git index, which is empty in CI.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Nightly full run over `develop`, at 2:00 AM Eastern in daylight time. A scheduled run is
    # dispatched against the default branch (`main`), so every checkout pins `ref` to `SWEEP_REF`;
    # otherwise it would re-test the already protected branch instead of the integration tree it
    # sweeps.
    - cron: "0 6 * * *"
  # A manual run tests the ref it is started on, with every job and no path filter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Empty except on `schedule`: checkout reads an empty `ref` as the event's own ref, which for a
  # scheduled run would be the default branch.
  SWEEP_REF: ${{ github.event_name == 'schedule' && 'refs/heads/develop' || '' }}
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Which parts of the tree this event touched; conditional jobs read these outputs. No workflow
  # uses a `paths:` filter, because a workflow that never triggers never reports its check, which a
  # required check on `main` reads as permanently pending rather than skipped.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `|| 'true'` is the default off a pull request: the filter step runs only there, so a push or
      # scheduled run reports every filter changed and runs unfiltered.
      desktop: ${{ steps.filter.outputs.desktop || 'true' }}
      structure: ${{ steps.filter.outputs.structure || 'true' }}
      deps: ${{ steps.filter.outputs.deps || 'true' }}
      slow-jobs: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}
      # SHA-pinned like every third-party action here; Renovate keeps the pin current.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # Each filter names the workflow itself and the root task config
            # its jobs read: a PR that changes only the matrix, a tier's turbo
            # task, or the workspace build policy must run the job it changed,
            # or a runtime error in that edit merges unexercised and surfaces
            # on the next unrelated run.
            desktop:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              # The root settings the desktop's build and tiers run under: the TypeScript configs
              # its own extend, the shared Vitest settings its Vitest config imports, the Node
              # version and the install settings. A change under `patches/` moves that patch's
              # hash in the lockfile, so the lockfile entry covers it.
              - 'tsconfig.base.json'
              - 'tsconfig.node.json'
              - 'vitest.shared.ts'
              - '.nvmrc'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-electron-display/**'
            # knip reads every workspace, its own config, the manifests and the files that name
            # entries (this workflow, the lefthook config).
            structure:
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'knip.json'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'lefthook.yml'
              - '.github/workflows/ci.yml'
            deps:
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - '.npmrc'
              # `allowBuilds` for `better-sqlite3` lives here, and denying its
              # implicit build is what the native-prebuild matrix asserts.
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/assert-native-prebuild/**'

  # The Node floor as major.minor, read from `.nvmrc`, for the `test` matrix: its job name renders
  # the value, and `.nvmrc` whole would rename the check. Checks out `.nvmrc` alone.
  node-version:
    name: node version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      major-minor: ${{ steps.read.outputs.major-minor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - name: Read .nvmrc
        id: read
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .nvmrc)"
          echo "major-minor=[\"$(cut -d. -f1,2 <<< "$version")\"]" >> "$GITHUB_OUTPUT"

  # Full-repo lint, format check and typecheck on the Node floor, and the build and tests of every
  # workspace but the desktop, whose build and tiers are the `desktop` job's.
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    needs: [node-version]
    runs-on: ${{ matrix.os }}
    # Job-scoped `permissions:` and `env:` are both load-bearing for the Turborepo remote cache:
    #   - A job-level `permissions:` map replaces the workflow-level one, so `contents: read` is
    #     restated. No `actions:` grant is added on purpose: the cache backend authenticates with
    #     the runner-injected `ACTIONS_RUNTIME_TOKEN`, not `GITHUB_TOKEN`, so `actions: write` would
    #     buy the cache nothing while giving PR-authored code Actions-API writes (deleting caches on
    #     any ref, canceling runs) that cache ref-scoping does not contain.
    #   - The signature key is read by the `pnpm turbo run` steps, not the caching action, so it
    #     sits at job scope; a step-level `env:` would silently disable artifact signing.
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        # One OS and one Node version, the floor; `native-prebuilds` covers the other platforms.
        os: [ubuntu-latest]
        node: ${{ fromJSON(needs.node-version.outputs.major-minor) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert better-sqlite3 loads a bundled Node-API prebuild
        uses: ./.github/actions/assert-better-sqlite3-prebuild

      # Backs Turborepo's remote cache with the GitHub Actions cache (no third-party service).
      # SHA-pinned.
      #
      # What keeps a fork PR from poisoning this cache: GitHub withholds secrets from
      # fork-originated workflows, `GITHUB_TOKEN` is read-only on `pull_request`, and every turbo
      # invocation below gets `--cache=local:rw,remote:r` on PR events. `remoteCache.signature` is
      # not one of them: Turborepo documents it as artifact-integrity verification, "not a security
      # feature".
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Set up Electron on a display
        uses: ./.github/actions/setup-electron-display

      # Full-repo `eslint .` and `prettier --check .` close the `git commit --no-verify` bypass;
      # lefthook is not used because lint-staged reads the staging index, empty in CI. Gitleaks runs
      # in `gitleaks.yml`.
      - name: Lint (full repo)
        run: pnpm -w exec eslint .

      - name: Format check (full repo)
        run: pnpm -w exec prettier --check .

      # Every workspace but the desktop: the `desktop` job's tiers build it whenever a file its
      # filter names changes, so building it here too would build it twice.
      - name: Build (excluding desktop)
        run: pnpm turbo run build --filter='!@ai-sidekicks/desktop' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Typecheck
        run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Lint per-package
        run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # The desktop package runs in the `desktop` matrix job, one tier per runner. Under turbo's
      # default concurrency (10), `@ai-sidekicks/desktop#test:smoke`, the one project that spawns a
      # full Electron tree and asserts a wall-clock boot deadline, would share a 4-vCPU runner with
      # `runtime-daemon#test`, `client-sdk#test` and the renderer suite.
      - name: Test (excluding desktop)
        run: pnpm turbo run test --filter='!@ai-sidekicks/desktop' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Public-surface validation of the workspace libraries, run against the packed tarball so it
      # sees what a consumer would install:
      #   - publint --strict: packaging correctness (exports resolve, listed files exist, module
      #     type consistent).
      #   - attw (@arethetypeswrong/cli): how the shipped .d.ts resolves per module-resolution mode.
      #     Each package's .attw.json uses the `esm-only` profile: these are "type": "module"
      #     packages with no CJS export, so node10 and node16-cjs are ignored (a CJS consumer must
      #     dynamic-import) while node16-from-ESM and bundler stay enforced.
      #
      # Libraries are found from `packages/*/package.json`, so a new package needs no list edit;
      # `apps/*` are applications and out of scope.
      - name: Validate package public surface (publint + attw)
        run: |
          fail=0
          tmp=$(mktemp -d)
          for pj in packages/*/package.json; do
            dir=$(dirname "$pj")
            pkg=$(basename "$dir")
            echo "::group::$pkg — publint --strict + attw (esm-only)"
            ( cd "$dir" && pnpm exec publint --strict ) || { echo "::error::publint failed for $pkg"; fail=1; }
            ( cd "$dir" && pnpm pack --pack-destination "$tmp" >/dev/null ) || { echo "::error::pnpm pack failed for $pkg"; fail=1; }
            tgz=$(find "$tmp" -maxdepth 1 -name '*.tgz')
            ( cd "$dir" && pnpm exec attw "$tgz" ) || { echo "::error::attw failed for $pkg"; fail=1; }
            find "$tmp" -maxdepth 1 -name '*.tgz' -delete
            echo "::endgroup::"
          done
          rm -rf "$tmp"
          if [ $fail -ne 0 ]; then
            echo "::error::package public-surface validation failed (publint/attw)"
            exit 1
          fi
          echo "ok: all packages pass publint --strict + attw"

      # Tests of the plan-execution skill.
      #
      # Routed through `tools/run-node-tests.mjs`, not `node --test`: a glob matching nothing makes
      # `node --test` exit 0 having run no tests, which would turn this required check green while
      # executing nothing. The wrapper refuses to spawn on zero matches and enforces a floor;
      # `--min-files` sits at the current file count, so a collapse to one file trips it and a
      # deliberate consolidation lowers the floor in the same commit.
      #
      # The pattern stays a glob: a bare directory argument fails on Node 24.18.0 but exits 0 having
      # run nothing on Node 26.10.0 (measured).
      - name: Run plan-execution skill tests (Layer 1 + Layer 2)
        run: node tools/run-node-tests.mjs --min-files=3 --experimental-strip-types '.claude/skills/plan-execution/scripts/__tests__/**/*.test.mjs'

      # Hook guard tests: `worktree-occupancy.py` and `worktree.sh` driven as subprocesses from
      # node:test. This leg exercises the Linux `/proc` occupancy path only; the darwin `lsof` path
      # is covered by running the guard locally on macOS, since a macOS job cost a full extra runner
      # per PR for one test file.
      #
      # Same fail-closed wrapper as above. No `--min-files`: the tree holds one test file, so a
      # floor of 1 would only repeat the wrapper's zero-match check.
      - name: Run hook guard tests
        run: node tools/run-node-tests.mjs '.claude/hooks/__tests__/**/*.test.mjs'

      # Every test under `tools/`, run through the fail-closed runner, so the tool that guards the
      # other invocations is itself covered. Its tests spawn the runner as a subprocess, which
      # exercises the nested-invocation path. The glob is `tools/**` so a test kept beside its tool
      # still runs; the runner skips `node_modules`.
      - name: Run test-runner tool tests
        run: node tools/run-node-tests.mjs 'tools/**/*.test.mjs'

  # The desktop tiers, one per runner. The three build flavors (`build`, `build:smoke`,
  # `build:fixtures`) all write `apps/desktop/out/**`, so a tier must run against the flavor its
  # own turbo edge produced. A matrix leg has its own checkout and `out/**`, so the tiers run in
  # parallel without colliding.
  #
  # The enumeration is deliberate: a Vitest project added to `apps/desktop/vitest.config.ts` is not
  # picked up here. A project wired into neither this matrix nor the package's aggregate `test`
  # script is a review rejection (`apps/desktop/AGENTS.md`). The `accessibility` and `endurance`
  # projects are in neither on purpose: they run only by name until the accessibility sweeps and
  # the endurance reference run become gates on every PR.
  #
  # The slow tiers sit in `desktop-slow`, which shares these steps and the same check names.
  desktop:
    name: desktop (${{ matrix.tier }})
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        # `serial: true` marks a leg whose tier drives a real browser or Electron window: a build
        # dependency must not overlap the tier it builds for. Unmarked legs are plain Node test
        # projects and the import-graph check, which run at default concurrency. The dead-code
        # check covers every workspace, so it runs in the `structure` job.
        include:
          - tier: "test:main-unit test:renderer"
          - tier: "test:browser"
            serial: true
          # The bundle tier and the bundle budgets read the same release build, so they run in one
          # invocation over one build.
          - tier: "test:bundle budget:bundle"
            serial: true
          - tier: "test:smoke"
            serial: true
          - tier: "structure:layering"
    steps: &desktop-tier-steps
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Backs Turborepo's remote cache with the GitHub Actions cache (no third-party service).
      # SHA-pinned.
      #
      # What keeps a fork PR from poisoning this cache: GitHub withholds secrets from
      # fork-originated workflows, `GITHUB_TOKEN` is read-only on `pull_request`, and every turbo
      # invocation below gets `--cache=local:rw,remote:r` on PR events. `remoteCache.signature` is
      # not one of them: Turborepo documents it as artifact-integrity verification, "not a security
      # feature".
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Set up Electron on a display
        uses: ./.github/actions/setup-electron-display

      # A window manager on that display, for the leg that runs the end-to-end tier. Bare Xvfb has
      # none, and without one a window never minimizes, so the end-to-end check that minimizes a
      # window could only fail here. Openbox is one small package. Readiness comes from openbox
      # itself: it runs its `--startup` command once it manages the display, which writes the file
      # waited on.
      - name: Start a window manager on the display (Linux, end-to-end leg)
        if: runner.os == 'Linux' && contains(matrix.tier, 'e2e')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openbox
          ready_file="${RUNNER_TEMP}/window-manager-ready"
          wm_log="${RUNNER_TEMP}/openbox.log"
          openbox --startup "touch ${ready_file}" >"$wm_log" 2>&1 &
          wm_pid=$!
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ]; then
              echo "openbox managing ${DISPLAY} after ${attempt} attempt(s)"
              exit 0
            fi
            if ! kill -0 "$wm_pid" 2>/dev/null; then
              echo "::error::openbox exited before managing the display"
              cat "$wm_log" || true
              exit 1
            fi
            sleep 0.25
          done
          echo "::error::openbox did not manage the display within 15s"
          cat "$wm_log" || true
          exit 1

      # The browser-mode tiers drive a real Chromium through Vitest browser mode, and `pnpm install`
      # downloads none. `--with-deps` because Playwright's Chromium is not Electron's, and the
      # supported way to satisfy its shared-library set on Ubuntu is the flag, which apt-installs
      # what the pinned revision names. Legs that start no Chromium skip the apt round trip.
      - name: Install Chromium for the browser tiers
        if: contains(matrix.tier, 'browser') || contains(matrix.tier, 'smoke') || contains(matrix.tier, 'e2e')
        run: pnpm --filter @ai-sidekicks/desktop exec playwright install --with-deps chromium

      # No build step of its own: each tier's turbo edges build what it reads, the workspace
      # packages and the one desktop build flavor it needs, so a leg builds each once. A separate
      # `turbo run build` would build the uncached desktop release bundle in every leg: a second
      # time in the bundle leg, and for nothing in the others.
      #
      # `--continue` so a leg naming two tasks reports both results; without it the first failure
      # hides the second. `--concurrency=1` only on legs the matrix marks `serial`.
      - name: Run tier
        run: pnpm turbo run ${{ matrix.tier }} --filter=@ai-sidekicks/desktop --continue ${{ matrix.serial && '--concurrency=1' || '' }} ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

  # The desktop tiers that run only where `slow-jobs` is set.
  desktop-slow:
    name: desktop (${{ matrix.tier }})
    needs: [changes]
    if: needs.changes.outputs.slow-jobs == 'true' && needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: "test:e2e"
            serial: true
    steps: *desktop-tier-steps

  # Dead code across every workspace. It reads source only, so the job installs
  # without the Electron binary.
  structure:
    name: structure (knip)
    needs: [changes]
    if: needs.changes.outputs.structure == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Dead code (knip, every workspace)
        run: pnpm run structure:dead-code

  # Mutation testing over the packages: informational, no score threshold, and outside `ci-gate`, so
  # it never holds a merge. StrykerJS has no sharding, so `tools/mutation-shards.mjs` splits each
  # package's source files into shards balanced by the tests their mutants ran last time, and the
  # matrix runs every shard in parallel against the package's saved results.
  #
  # It runs only where `slow-jobs` is set. A pull request into main mutates only the files it
  # changed, re-tests only the mutants whose code or covering tests changed since the saved results,
  # and skips static mutants (module-level code, which re-runs the whole suite per mutant). The
  # nightly run and a manual run mutate every file, static mutants included, and the merge job saves
  # the combined results. A cold full run is hours of runner time (the daemon alone is over three
  # hours on a fast laptop), hence the long time limit, which only stops a hung job.
  mutation-plan:
    name: mutation plan
    needs: [changes]
    if: needs.changes.outputs.slow-jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      # Shards per package, sized from the measured full-run cost and kept to
      # 19 jobs in all, under the 20 jobs a free plan runs at once.
      MUTATION_SHARDS: '{"client-sdk": 1, "contracts": 3, "control-plane": 2, "crypto-paseto": 1, "runtime-daemon": 12}'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}
          # A pull request's changed files are read against its base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job runs no install; with pnpm absent, the cache lookup fails.
          package-manager-cache: false

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Plan shards
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "matrix=$(node tools/mutation-shards.mjs plan)" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation (${{ matrix.package }} ${{ matrix.shard }})
    needs: [mutation-plan]
    if: needs.mutation-plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      # A pull request's summary lists the surviving mutants in the files it
      # changed; a full run's summary is the score table.
      - name: Mutation testing
        working-directory: packages/${{ matrix.package }}
        env:
          MUTATE: ${{ matrix.mutate }}
          SHARD: ${{ matrix.shard }}
          PACKAGE: ${{ matrix.package }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          report="$RUNNER_TEMP/mutation.txt"
          status=0
          static=()
          [[ "$PULL_REQUEST" == "true" ]] && static=(--ignoreStatic)
          pnpm exec stryker run ../../stryker.config.json --mutate "$MUTATE" "${static[@]}" > "$report" 2>&1 || status=$?
          {
            echo "### Mutation testing: $PACKAGE, shard $SHARD"
            echo '```text'
            if [[ $status -ne 0 ]]; then
              tail -n 60 "$report"
            elif [[ "$PULL_REQUEST" == "true" ]]; then
              grep -Ev '^[0-9]{2}:[0-9]{2}:[0-9]{2} \([0-9]+\) (INFO|DEBUG)' "$report"
            else
              sed -n '/tests per mutant on average/,$p' "$report" | grep -Ev ' (INFO|DEBUG) '
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Record the shard's files
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MUTATE: ${{ matrix.mutate }}
        run: printf '%s\n' "$MUTATE" > "packages/${{ matrix.package }}/.stryker/mutated-files.txt"

      - name: Upload shard results
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}--${{ matrix.shard }}
          path: |
            packages/${{ matrix.package }}/.stryker/incremental.json
            packages/${{ matrix.package }}/.stryker/mutated-files.txt
          # The results live under the package's `.stryker/` folder, which
          # upload-artifact skips as hidden unless told otherwise.
          include-hidden-files: true
          retention-days: 1

  # Folds every shard's results over the saved ones and saves them for the next
  # run. A shard that failed or timed out leaves its files' earlier results in
  # place. A scheduled run's cache scope is the default branch, which every
  # branch reads; a manual run saves into the scope of the ref it ran on.
  mutation-merge:
    name: mutation merge
    needs: [mutation]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job runs no install; with pnpm absent, the cache lookup fails.
          package-manager-cache: false

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          # Shard artifacts are named `<package>--<shard>`; the run's other artifacts are not shards.
          pattern: "*--*"
          path: ${{ runner.temp }}/mutation-shards

      - name: Merge
        run: node tools/mutation-shards.mjs merge "$RUNNER_TEMP/mutation-shards"

      - name: Save mutation results
        uses: actions/cache/save@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}

  # Advisory: absent from `ci-gate`'s `needs`, so a coverage regression never blocks a merge. This
  # is measurement only; no number gates anything.
  #
  # One job rather than a matrix: `tools/coverage-report.mjs` fails closed on a root that declares
  # `test:coverage` but produced no report, which reads as a signal only if every root is measured
  # in the same workspace.
  coverage:
    name: coverage (informational)
    # Informational measurement, so it runs where the measurement is read — the
    # integration branch — rather than on every pull request, where it is a full
    # second install and test sweep nothing gates on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      # `ELECTRON_SKIP_BINARY_DOWNLOAD` because this job never launches Electron: the desktop
      # `test:coverage` is `vitest run --project=renderer`, a happy-dom project, and the smoke
      # project that spawns the binary is not in the coverage set. Otherwise the `apps/desktop`
      # postinstall would pull a 120-160 MB archive this job cannot use. Electron's own `install.js`
      # ignores the variable; `apps/desktop/scripts/materialize-electron.ts` honors it.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Coverage
        run: pnpm turbo run test:coverage

      # Renders one markdown table into the job summary. Writing to the summary rather than a PR
      # comment keeps this workflow's token at `contents: read` and third-party code out of the
      # workflow that carries the required `ci-gate`; the script header has the rationale.
      - name: Render coverage summary
        # The renderer is fail-closed on a root that declares `test:coverage` and
        # produced no report, so on a red run it reports the real partial state
        # rather than being skipped into silence.
        if: ${{ !cancelled() }}
        run: node tools/coverage-report.mjs

      # Retains lcov and json reports per run so a coverage baseline can cite artifacts rather than
      # a scrollback number.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          # 90 days, not the 30-day default: a baseline sampling window can outlive 30 days, and 90
          # is the ceiling for a private repo's default plan.
          retention-days: 90
          if-no-files-found: error

  # The daemon's `better-sqlite3` must load the tarball's bundled Node-API prebuild on every
  # platform the product ships to, not just the one the `test` job runs on (linux-x64). A missing or
  # unloadable prebuild elsewhere would otherwise surface first on a developer's machine or in a
  # release build, as a silent source compile or a crash at first open.
  #
  # Matrix: the five target platforms, on hosted-runner labels generally available for public
  # repositories:
  #   ubuntu-latest    → linux-x64
  #   ubuntu-24.04-arm → linux-arm64
  #   macos-latest     → darwin-arm64
  #   macos-15-intel   → darwin-x64     (the last Intel macOS image)
  #   windows-latest   → win32-x64
  # `win32-arm64` and the two `linuxmusl-*` prebuilds ship in the same tarball and are not covered:
  # `windows-11-arm` is not a target, and no hosted musl runner exists, so a musl check would need a
  # container leg.
  #
  # The install is scoped to the daemon and its workspace dependencies: the question is where one
  # binding comes from, and a full install would download an Electron binary per leg for nothing.
  # `--frozen-lockfile` still applies, so lockfile drift fails here as everywhere else.
  native-prebuilds:
    name: native prebuild (${{ matrix.prebuild }})
    # Five runners across three operating systems, and only the dependency graph (the lockfile, a
    # package.json, or the npm client config) can change which binding resolves. It runs only where
    # `slow-jobs` is set; there a pull request touching none of those files skips it, and `ci-gate`
    # reads the skip as success. The nightly and manual runs run it unconditionally.
    needs: [changes]
    if: needs.changes.outputs.slow-jobs == 'true' && needs.changes.outputs.deps == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            prebuild: linux-x64
          - os: ubuntu-24.04-arm
            prebuild: linux-arm64
          - os: macos-latest
            prebuild: darwin-arm64
          - os: macos-15-intel
            prebuild: darwin-x64
          - os: windows-latest
            prebuild: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      # Runs on the Node floor because asserting the prebuild on another version would not assert
      # the shipped configuration. The 13.x prebuilds are Node-API 10: a Node-API-9 host (22.12,
      # 22.13) cannot load the binding at all, seen as a silent SIGSEGV at the first
      # `new Database()` rather than Node's documented load-time throw.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install (runtime-daemon and its workspace dependencies only)
        run: pnpm install --frozen-lockfile --filter "@ai-sidekicks/runtime-daemon..."

      - name: Assert prebuild provenance and the SQLite pragma readback
        uses: ./.github/actions/assert-native-prebuild
        with:
          expected-prebuild: ${{ matrix.prebuild }}

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [changes, node-version, test, desktop, desktop-slow, structure, native-prebuilds]
    if: always()
    steps:
      - name: Aggregate required-checks status
        # Aggregator-job pattern: branch protection on `main` requires this one job, so renaming or
        # adding matrix legs cannot silently bypass it.
        #
        # One predicate for every job: `skipped` counts as success. A path-filtered job that did not
        # need to run must not hold the gate pending, and a job skipped by its filter carries as
        # much signal as a green one; so does a slow job on a pull request into develop, where it
        # does not run. `test` is never skipped. A dependency whose result is
        # `cancelled` or `failure` still fails, since neither result is accepted.
        #
        # `node-version` is checked for the same reason: `test` needs it, so its failure skips
        # `test`, which this gate would otherwise read as success.
        #
        # `changes` is checked too, and that is load-bearing: a path filter that errors (a transient
        # files-API failure, a bad expression) skips every job that needs it, the same result a
        # filter miss gives. Without this line the gate would read those skips as success and go
        # green having run nothing. `changes` is unconditional, so it is never legitimately skipped.
        run: |
          fail=0
          check() {
            if [[ "$2" != "success" && "$2" != "skipped" ]]; then
              echo "ci-gate: job '$1' did not succeed (result=$2)"
              fail=1
            fi
          }
          check changes "${{ needs.changes.result }}"
          check node-version "${{ needs.node-version.result }}"
          check test "${{ needs.test.result }}"
          check desktop "${{ needs.desktop.result }}"
          check desktop-slow "${{ needs.desktop-slow.result }}"
          check structure "${{ needs.structure.result }}"
          check native-prebuilds "${{ needs.native-prebuilds.result }}"
          if [[ $fail -ne 0 ]]; then exit 1; fi
          echo "ci-gate: all required jobs succeeded or were skipped"
