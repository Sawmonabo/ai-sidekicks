# Default permissions are read-only; a job opts up only where it needs to. Pull-request runs cancel
# in progress; runs on develop and main do not.
#
# Branch protection on main requires only the `ci-gate` job; develop requires no check. Matrix leg
# names embed strategy values, so they are not stable required-check targets.
#
# Most jobs are path-filtered by `changes` and report `skipped` when their paths are untouched;
# `ci-gate` treats `skipped` as success. The nightly schedule runs everything unfiltered so red that
# a filter let through is found within a day.
#
# The full-repo `eslint .` and `prettier --check .` steps close the `git commit --no-verify` bypass.
# They do not go through lefthook, because lint-staged reads the git index, which is empty in CI.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Nightly full run over `develop`. A scheduled run is dispatched against the default branch
    # (`main`), so every checkout pins `ref` to `SWEEP_REF`; otherwise it would re-test the already
    # protected branch instead of the integration tree it sweeps.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Empty except on `schedule`: checkout reads an empty `ref` as the event's own ref, which for a
  # scheduled run would be the default branch.
  SWEEP_REF: ${{ github.event_name == 'schedule' && 'refs/heads/develop' || '' }}
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Which parts of the tree this event touched; conditional jobs read these outputs. No workflow
  # uses a `paths:` filter, because a workflow that never triggers never reports its check, which a
  # required check on `main` reads as permanently pending rather than skipped.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `|| 'true'` is the default off a pull request: the filter step runs only there, so a push or
      # scheduled run reports every filter changed and runs unfiltered.
      desktop: ${{ steps.filter.outputs.desktop || 'true' }}
      deps: ${{ steps.filter.outputs.deps || 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}
      # SHA-pinned like every third-party action here; Renovate keeps the pin current.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # Each filter names the workflow itself and the root task config
            # its jobs read: a PR that changes only the matrix, a tier's turbo
            # task, or the workspace build policy must run the job it changed,
            # or a runtime error in that edit merges unexercised and surfaces
            # on the next unrelated run.
            desktop:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            deps:
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - '.npmrc'
              # `allowBuilds` for `better-sqlite3` lives here, and denying its
              # implicit build is what the native-prebuild matrix asserts.
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  # Full-repo lint, format check, build, typecheck and test on the Node floor.
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Job-scoped `permissions:` and `env:` are both load-bearing for the Turborepo remote cache:
    #   - A job-level `permissions:` map replaces the workflow-level one, so `contents: read` is
    #     restated. No `actions:` grant is added on purpose: the cache backend authenticates with
    #     the runner-injected `ACTIONS_RUNTIME_TOKEN`, not `GITHUB_TOKEN`, so `actions: write` would
    #     buy the cache nothing while giving PR-authored code Actions-API writes (deleting caches on
    #     any ref, cancelling runs) that cache ref-scoping does not contain.
    #   - The signature key is read by the `pnpm turbo run` steps, not the caching action, so it
    #     sits at job scope; a step-level `env:` would silently disable artifact signing.
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        # One OS and one Node version, the floor; `native-prebuilds` covers the other platforms.
        os: [ubuntu-latest]
        node: ["24.16"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The daemon's `better-sqlite3` must come from the tarball's bundled Node-API prebuild, never
      # a source compile. This asserts provenance in two conjuncts:
      #
      #   (a) the binding the daemon resolves, read from `require.cache` after a real
      #       `new Database()` (so a prebuild that resolves but will not load also fails), lives
      #       under `prebuilds/<platform>-<arch>.node`; and
      #   (b) `build/Release/` holds no `.node`, the one place a source build writes.
      #
      # `node-gyp` never runs for this package: it declares no install script, and
      # `pnpm-workspace.yaml` denies the implicit `node-gyp rebuild` npm synthesizes for a
      # `binding.gyp` (`allowBuilds: better-sqlite3: false`). Approving that build would fail
      # `pnpm install` on `windows-latest`, where node-gyp 11.5.0 cannot parse the image's Visual
      # Studio 18 install, though the prebuild is in the tarball. Denying it also makes (b)
      # absolute.
      #
      # `native-prebuilds` below is not a duplicate: this step checks the full workspace install on
      # one platform; that job checks a scoped install on all five target platforms and also reads
      # back the database pragmas.
      - name: Assert better-sqlite3 loads a bundled Node-API prebuild
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/assert-better-sqlite3-prebuild.mjs" <<'NODE'
          import { createRequire } from "node:module";
          import { existsSync, readdirSync } from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          // `pathToFileURL`, not a `file://` template: a Windows cwd is
          // `D:\a\...` and `file://D:\a\...` is not a valid file URL. This job's
          // matrix is Linux-only, but the `native-prebuilds` job below runs the
          // same resolution on `windows-latest`, so the two forms must not drift.
          const daemonRequire = createRequire(
            new URL("packages/runtime-daemon/package.json", pathToFileURL(`${process.cwd()}/`)),
          );

          const DatabaseConstructor = daemonRequire("better-sqlite3");
          new DatabaseConstructor(":memory:").close();

          const loadedBindings = Object.keys(daemonRequire.cache).filter((entry) =>
            entry.endsWith(".node"),
          );
          if (loadedBindings.length !== 1) {
            throw new Error(
              `expected exactly one loaded .node binding, saw ${JSON.stringify(loadedBindings)}`,
            );
          }
          const [loadedBinding] = loadedBindings;
          if (!/[/\\]prebuilds[/\\](darwin|linux|linuxmusl|win32)-(x64|arm64)\.node$/.test(loadedBinding)) {
            throw new Error(`better-sqlite3 did not load a tarball prebuild: ${loadedBinding}`);
          }

          const packageRoot = path.dirname(daemonRequire.resolve("better-sqlite3/package.json"));
          const releaseDirectory = path.join(packageRoot, "build", "Release");
          const compiledArtifacts = existsSync(releaseDirectory)
            ? readdirSync(releaseDirectory).filter((entry) => entry.endsWith(".node"))
            : [];
          if (compiledArtifacts.length > 0) {
            throw new Error(
              `build/Release holds compiled artifacts (a source build ran): ${JSON.stringify(compiledArtifacts)}`,
            );
          }

          console.log(`loaded prebuild: ${loadedBinding}`);
          console.log(`build/Release holds no .node: ${releaseDirectory}`);
          NODE
          node "${RUNNER_TEMP}/assert-better-sqlite3-prebuild.mjs"

      # Backs Turborepo's remote cache with the GitHub Actions cache (no third-party service).
      # SHA-pinned.
      #
      # What keeps a fork PR from poisoning this cache: GitHub withholds secrets from
      # fork-originated workflows, `GITHUB_TOKEN` is read-only on `pull_request`, and every turbo
      # invocation below gets `--cache=local:rw,remote:r` on PR events. `remoteCache.signature` is
      # not one of them: Turborepo documents it as artifact-integrity verification, "not a security
      # feature".
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      # Electron 44 ships no install script, so `pnpm install` alone leaves no `dist/`;
      # `apps/desktop/scripts/materialize-electron.ts` explains why. The `postinstall` normally ran
      # it already, so this step is a fast check plus the path extraction the SUID step needs.
      # Running the same script, not a second download path, means a skipped postinstall is repaired
      # and a download failure is its own red step rather than a test timeout. `node -p` runs after
      # `dist/` is populated so it prints only the path.
      - name: Materialize the Electron binary
        id: electron
        working-directory: apps/desktop
        run: |
          node --experimental-strip-types scripts/materialize-electron.ts
          executable=$(node -p "require('electron')")
          [ -x "$executable" ] || { echo "::error::electron did not resolve to an executable: '$executable'"; exit 1; }
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
          ls -l "$executable"

      # Electron on Ubuntu runners needs the SUID sandbox helper (`chrome-sandbox`) owned by root
      # with mode 4755 for the renderer's Linux namespace sandbox to start, and `pnpm install`
      # cannot chown it. Running with `--no-sandbox` instead would defeat the invariant
      # `apps/desktop/tests/launch.smoke.test.ts` asserts: `webPreferences.sandbox: true`, so the
      # renderer sees `require`, `process` and `global` as `undefined`.
      #
      # The helper is taken from beside the executable the previous step resolved, not searched for
      # under `.pnpm`: a tree holding two Electron versions has two `chrome-sandbox` files and
      # `find` would return whichever it reached first. The guard fails fast if the `dist/` layout
      # changed.
      - name: Configure Electron SUID sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          sandbox="$(dirname "${{ steps.electron.outputs.executable }}")/chrome-sandbox"
          [ -f "$sandbox" ] || { echo "::error::chrome-sandbox not beside the resolved Electron executable — dist layout drift?"; exit 1; }
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"

      # One X server for the whole job, ready before any test runs, with `$DISPLAY` exported for
      # every later step. The Electron test harnesses fall back to a per-spawn `xvfb-run -a` only
      # when no display is set, because that was unsound on a hosted runner:
      #
      #   1. `xvfb-run -a` picks its display number with a plain `while [ -f /tmp/.X$i-lock ]` scan,
      #      a documented race between concurrent invocations.
      #   2. Each spawn stood up its own Xvfb and wrapper shell, two X servers on a 4-vCPU box for
      #      no benefit.
      #   3. `xvfb-run` merges the child's stderr into stdout, which silently disabled every
      #      stderr-keyed diagnosis branch in the smoke harness.
      #
      # `-nolisten tcp` keeps the server on its unix socket.
      #
      # Readiness comes from Xvfb's own `-displayfd`: the server picks a free display and writes its
      # number only once listening, so reading the number is the readiness proof and there is no
      # display-number race. `xdpyinfo` is not used because the ubuntu-24.04 image has `xvfb` but
      # not `x11-utils`, so a probe built on it can never succeed.
      #
      # Nothing here passes `--no-sandbox`; the SUID helper configured above makes the sandbox work.
      - name: Start Xvfb and wait for the display to answer (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          display_file="${RUNNER_TEMP}/xvfb-display"
          xvfb_log="${RUNNER_TEMP}/xvfb.log"
          : > "$display_file"
          # No `:N` argument: with `-displayfd` the server allocates a free
          # display itself and reports it on fd 3, which we point at a file.
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp \
            3>"$display_file" >"$xvfb_log" 2>&1 &
          xvfb_pid=$!
          # Deliberately no teardown step: the display is meant to outlive every
          # test in the job, and the runner reclaims the VM afterwards. This is
          # also what removes the per-spawn teardown race the old `xvfb-run`
          # posture had, where each spawn tore its own X server down.
          for attempt in $(seq 1 60); do
            display_number=$(tr -d '[:space:]' < "$display_file")
            if [ -n "$display_number" ]; then
              echo "Xvfb serving :${display_number} after ${attempt} attempt(s)"
              echo "DISPLAY=:${display_number}" >> "$GITHUB_ENV"
              exit 0
            fi
            # Checked AFTER the read, not before: a server that came up and
            # wrote its number is a success even if this loop notices the pid
            # later, and checking first would race the write.
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "::error::Xvfb exited before reporting a display number"
              cat "$xvfb_log" || true
              exit 1
            fi
            sleep 0.25
          done
          echo "::error::Xvfb reported no display number within 15s"
          cat "$xvfb_log" || true
          exit 1

      # Chromium probes the session bus for portals and the secret service on boot. A hosted runner
      # has none, and with `DBUS_SESSION_BUS_ADDRESS` unset libdbus tries an autolaunch that only
      # costs time. `disabled:` is not a valid bus address, so the lookup fails at once.
      # `NO_AT_BRIDGE=1` stops the accessibility bridge opening its own bus connection. Neither
      # changes any sandbox or `webPreferences` setting.
      - name: Harden D-Bus / portal environment for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DBUS_SESSION_BUS_ADDRESS=disabled:" >> "$GITHUB_ENV"
          echo "NO_AT_BRIDGE=1" >> "$GITHUB_ENV"

      # Full-repo `eslint .` and `prettier --check .` close the `git commit --no-verify` bypass;
      # lefthook is not used because lint-staged reads the staging index, empty in CI. Gitleaks runs
      # in `gitleaks.yml`.
      - name: Lint (full repo)
        run: pnpm -w exec eslint .

      - name: Format check (full repo)
        run: pnpm -w exec prettier --check .

      - name: Build
        run: pnpm turbo run build ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Production safety: the smoke and GC-reachability probes in `apps/desktop/src/main/index.ts`
      # are gated by the compile-time constant `__SIDEKICKS_SMOKE_BUILD__` (a Vite `define` in
      # `apps/desktop/electron.vite.config.ts`). A release build substitutes `false`, and Rollup
      # then strips the probe markers below from `apps/desktop/out/main/index.js`. This step greps
      # the bundle for them; a match means dead-code elimination regressed (a Vite or Rollup change,
      # or a runtime-only gate replacing the compile-time one). The renderer is untrusted, so a
      # reachable `executeJavaScript` or `queryObjects` weakens the security posture.
      - name: Assert release bundle excludes test-machinery markers (apps/desktop)
        run: |
          bundle=apps/desktop/out/main/index.js
          [ -f "$bundle" ] || { echo "::error::$bundle not found — release build skipped or output path drifted"; exit 1; }
          fail=0
          for marker in "SIDEKICKS_SMOKE_PROBE" "executeJavaScript" "about:blank" "SIDEKICKS_GC_PROBE" "queryObjects" "runGcProbe"; do
            count=$(grep -c -- "$marker" "$bundle" || true)
            if [ "$count" -ne 0 ]; then
              echo "::error::release bundle contains test-machinery marker '$marker' ($count occurrences in $bundle) — dead-code-elimination regressed"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::compile-time-static gate __SIDEKICKS_SMOKE_BUILD__ should substitute to 'false' in release builds; check apps/desktop/electron.vite.config.ts define block"
            exit 1
          fi
          echo "ok: release bundle excludes test-machinery markers"

      - name: Typecheck
        run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Lint per-package
        run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # The desktop package runs in the `desktop` matrix job, one tier per runner. Under turbo's
      # default concurrency (10), `@ai-sidekicks/desktop#test:smoke`, the one project that spawns a
      # full Electron tree and asserts a wall-clock boot deadline, would share a 4-vCPU runner with
      # `runtime-daemon#test`, `client-sdk#test` and the renderer suite.
      - name: Test (excluding desktop)
        run: pnpm turbo run test --filter='!@ai-sidekicks/desktop' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Public-surface validation of the workspace libraries, run against the packed tarball so it
      # sees what a consumer would install:
      #   - publint --strict: packaging correctness (exports resolve, listed files exist, module
      #     type consistent).
      #   - attw (@arethetypeswrong/cli): how the shipped .d.ts resolves per module-resolution mode.
      #     Each package's .attw.json uses the `esm-only` profile: these are "type": "module"
      #     packages with no CJS export, so node10 and node16-cjs are ignored (a CJS consumer must
      #     dynamic-import) while node16-from-ESM and bundler stay enforced.
      #
      # attw's dependency fflate is pinned to 0.8.2 by a pnpm override (see `pnpm-workspace.yaml`)
      # because 0.8.3 broke its tarball extraction. Libraries are found from
      # `packages/*/package.json`, so a new package needs no list edit; `apps/*` are applications
      # and out of scope.
      - name: Validate package public surface (publint + attw)
        run: |
          fail=0
          tmp=$(mktemp -d)
          for pj in packages/*/package.json; do
            dir=$(dirname "$pj")
            pkg=$(basename "$dir")
            echo "::group::$pkg — publint --strict + attw (esm-only)"
            ( cd "$dir" && pnpm exec publint --strict ) || { echo "::error::publint failed for $pkg"; fail=1; }
            ( cd "$dir" && pnpm pack --pack-destination "$tmp" >/dev/null ) || { echo "::error::pnpm pack failed for $pkg"; fail=1; }
            tgz=$(find "$tmp" -maxdepth 1 -name '*.tgz')
            ( cd "$dir" && pnpm exec attw "$tgz" ) || { echo "::error::attw failed for $pkg"; fail=1; }
            find "$tmp" -maxdepth 1 -name '*.tgz' -delete
            echo "::endgroup::"
          done
          rm -rf "$tmp"
          if [ $fail -ne 0 ]; then
            echo "::error::package public-surface validation failed (publint/attw)"
            exit 1
          fi
          echo "ok: all packages pass publint --strict + attw"

      # Tests of the plan-execution skill.
      #
      # Routed through `tools/run-node-tests.mjs`, not `node --test`: a glob matching nothing makes
      # `node --test` exit 0 having run no tests, which would turn this required check green while
      # executing nothing. The wrapper refuses to spawn on zero matches and enforces a floor;
      # `--min-files` sits at the current file count, so a collapse to one file trips it and a
      # deliberate consolidation lowers the floor in the same commit.
      #
      # The pattern stays a glob: a bare directory argument fails on Node 24.18.0 but exits 0 having
      # run nothing on Node 26.10.0 (measured).
      - name: Run plan-execution skill tests (Layer 1 + Layer 2)
        run: node tools/run-node-tests.mjs --min-files=3 --experimental-strip-types '.claude/skills/plan-execution/scripts/__tests__/**/*.test.mjs'

      # Hook guard tests: `worktree-occupancy.py` and `worktree.sh` driven as subprocesses from
      # node:test. This leg exercises the Linux `/proc` occupancy path only; the darwin `lsof` path
      # is covered by running the guard locally on macOS, since a macOS job cost a full extra runner
      # per PR for one test file.
      #
      # Same fail-closed wrapper as above. No `--min-files`: the tree holds one test file, so a
      # floor of 1 would only repeat the wrapper's zero-match check.
      - name: Run hook guard tests
        run: node tools/run-node-tests.mjs '.claude/hooks/__tests__/**/*.test.mjs'

      # Every test under `tools/`, run through the fail-closed runner, so the tool that guards the
      # other invocations is itself covered. Its tests spawn the runner as a subprocess, which
      # exercises the nested-invocation path. The glob is `tools/**` so a test kept beside its tool
      # still runs; the runner skips `node_modules`.
      - name: Run test-runner tool tests
        run: node tools/run-node-tests.mjs 'tools/**/*.test.mjs'

  # The desktop tiers, one per runner. The three build flavours (`build`, `build:smoke`,
  # `build:fixtures`) all write `apps/desktop/out/**`, so a tier must run against the flavour its
  # own turbo edge produced. A matrix leg has its own checkout and `out/**`, so the tiers run in
  # parallel without colliding.
  #
  # `--concurrency=1` stays inside each leg: a leg naming two tasks must not put two Chromium or
  # Electron processes on one 4-vCPU runner.
  #
  # The enumeration is deliberate: a Vitest project added to `apps/desktop/vitest.config.ts` is not
  # picked up here. A project wired into neither this matrix nor the package's aggregate `test`
  # script is a review rejection (`apps/desktop/AGENTS.md`).
  desktop:
    name: desktop (${{ matrix.tier }})
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        # `serial: true` marks a leg whose tasks drive a real browser or Electron window: only one
        # such process may be alive at a time, and a build dependency must not overlap the tier it
        # builds for. Unmarked legs are plain Node test projects and the import-graph check, which
        # run at default concurrency. The dead-code check covers every workspace, so it runs in the
        # `structure` job.
        include:
          - tier: "test:main-unit test:renderer"
          - tier: "test:browser test:accessibility"
            serial: true
          - tier: "test:bundle"
            serial: true
          - tier: "test:smoke"
            serial: true
          - tier: "test:e2e test:endurance"
            serial: true
          - tier: "test:bench"
          - tier: "structure:layering"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Backs Turborepo's remote cache with the GitHub Actions cache (no third-party service).
      # SHA-pinned.
      #
      # What keeps a fork PR from poisoning this cache: GitHub withholds secrets from
      # fork-originated workflows, `GITHUB_TOKEN` is read-only on `pull_request`, and every turbo
      # invocation below gets `--cache=local:rw,remote:r` on PR events. `remoteCache.signature` is
      # not one of them: Turborepo documents it as artifact-integrity verification, "not a security
      # feature".
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      # Electron 44 ships no install script, so `pnpm install` alone leaves no `dist/`;
      # `apps/desktop/scripts/materialize-electron.ts` explains why. The `postinstall` normally ran
      # it already, so this step is a fast check plus the path extraction the SUID step needs.
      # Running the same script, not a second download path, means a skipped postinstall is repaired
      # and a download failure is its own red step rather than a test timeout. `node -p` runs after
      # `dist/` is populated so it prints only the path.
      - name: Materialize the Electron binary
        id: electron
        working-directory: apps/desktop
        run: |
          node --experimental-strip-types scripts/materialize-electron.ts
          executable=$(node -p "require('electron')")
          [ -x "$executable" ] || { echo "::error::electron did not resolve to an executable: '$executable'"; exit 1; }
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
          ls -l "$executable"

      # Electron on Ubuntu runners needs the SUID sandbox helper (`chrome-sandbox`) owned by root
      # with mode 4755 for the renderer's Linux namespace sandbox to start, and `pnpm install`
      # cannot chown it. Running with `--no-sandbox` instead would defeat the invariant
      # `apps/desktop/tests/launch.smoke.test.ts` asserts: `webPreferences.sandbox: true`, so the
      # renderer sees `require`, `process` and `global` as `undefined`.
      #
      # The helper is taken from beside the executable the previous step resolved, not searched for
      # under `.pnpm`: a tree holding two Electron versions has two `chrome-sandbox` files and
      # `find` would return whichever it reached first. The guard fails fast if the `dist/` layout
      # changed.
      - name: Configure Electron SUID sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          sandbox="$(dirname "${{ steps.electron.outputs.executable }}")/chrome-sandbox"
          [ -f "$sandbox" ] || { echo "::error::chrome-sandbox not beside the resolved Electron executable — dist layout drift?"; exit 1; }
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"

      # One X server for the whole job, ready before any test runs, with `$DISPLAY` exported for
      # every later step. The Electron test harnesses fall back to a per-spawn `xvfb-run -a` only
      # when no display is set, because that was unsound on a hosted runner:
      #
      #   1. `xvfb-run -a` picks its display number with a plain `while [ -f /tmp/.X$i-lock ]` scan,
      #      a documented race between concurrent invocations.
      #   2. Each spawn stood up its own Xvfb and wrapper shell, two X servers on a 4-vCPU box for
      #      no benefit.
      #   3. `xvfb-run` merges the child's stderr into stdout, which silently disabled every
      #      stderr-keyed diagnosis branch in the smoke harness.
      #
      # `-nolisten tcp` keeps the server on its unix socket.
      #
      # Readiness comes from Xvfb's own `-displayfd`: the server picks a free display and writes its
      # number only once listening, so reading the number is the readiness proof and there is no
      # display-number race. `xdpyinfo` is not used because the ubuntu-24.04 image has `xvfb` but
      # not `x11-utils`, so a probe built on it can never succeed.
      #
      # Nothing here passes `--no-sandbox`; the SUID helper configured above makes the sandbox work.
      - name: Start Xvfb and wait for the display to answer (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          display_file="${RUNNER_TEMP}/xvfb-display"
          xvfb_log="${RUNNER_TEMP}/xvfb.log"
          : > "$display_file"
          # No `:N` argument: with `-displayfd` the server allocates a free
          # display itself and reports it on fd 3, which we point at a file.
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp \
            3>"$display_file" >"$xvfb_log" 2>&1 &
          xvfb_pid=$!
          # Deliberately no teardown step: the display is meant to outlive every
          # test in the job, and the runner reclaims the VM afterwards. This is
          # also what removes the per-spawn teardown race the old `xvfb-run`
          # posture had, where each spawn tore its own X server down.
          for attempt in $(seq 1 60); do
            display_number=$(tr -d '[:space:]' < "$display_file")
            if [ -n "$display_number" ]; then
              echo "Xvfb serving :${display_number} after ${attempt} attempt(s)"
              echo "DISPLAY=:${display_number}" >> "$GITHUB_ENV"
              exit 0
            fi
            # Checked AFTER the read, not before: a server that came up and
            # wrote its number is a success even if this loop notices the pid
            # later, and checking first would race the write.
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "::error::Xvfb exited before reporting a display number"
              cat "$xvfb_log" || true
              exit 1
            fi
            sleep 0.25
          done
          echo "::error::Xvfb reported no display number within 15s"
          cat "$xvfb_log" || true
          exit 1

      # Chromium probes the session bus for portals and the secret service on boot. A hosted runner
      # has none, and with `DBUS_SESSION_BUS_ADDRESS` unset libdbus tries an autolaunch that only
      # costs time. `disabled:` is not a valid bus address, so the lookup fails at once.
      # `NO_AT_BRIDGE=1` stops the accessibility bridge opening its own bus connection. Neither
      # changes any sandbox or `webPreferences` setting.
      - name: Harden D-Bus / portal environment for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DBUS_SESSION_BUS_ADDRESS=disabled:" >> "$GITHUB_ENV"
          echo "NO_AT_BRIDGE=1" >> "$GITHUB_ENV"

      - name: Build (excluding control-plane, which the desktop does not use)
        run: pnpm turbo run build --filter='!@ai-sidekicks/control-plane' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # The browser-mode tiers drive a real Chromium through Vitest browser mode, and `pnpm install`
      # downloads none. `--with-deps` because Playwright's Chromium is not Electron's, and the
      # supported way to satisfy its shared-library set on Ubuntu is the flag, which apt-installs
      # what the pinned revision names. Legs that start no Chromium skip the apt round trip.
      - name: Install Chromium for the browser tiers
        if: contains(matrix.tier, 'browser') || contains(matrix.tier, 'smoke') || contains(matrix.tier, 'e2e')
        run: pnpm --filter @ai-sidekicks/desktop exec playwright install --with-deps chromium

      # `--continue` so a leg naming two tasks reports both results; without it the first failure
      # hides the second. `--concurrency=1` only on legs the matrix marks `serial`.
      #
      # `CONSOLE_BENCH_LEDGER_PATH` redirects the bench tier's absolutes to the runner's temp
      # directory: `apps/desktop/tests/bench/ledger.json` is a curated record a person reads, and no
      # CI run should rewrite it. The runner's own numbers are in this step's log. Other legs ignore
      # the variable.
      - name: Run tier
        env:
          CONSOLE_BENCH_LEDGER_PATH: ${{ runner.temp }}/console-bench-ledger.json
        run: pnpm turbo run ${{ matrix.tier }} --filter=@ai-sidekicks/desktop --continue ${{ matrix.serial && '--concurrency=1' || '' }} ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

  # Dead code across every workspace. It reads source only, so the job installs
  # without the Electron binary.
  structure:
    name: structure (knip)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: "pnpm"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Dead code (knip, every workspace)
        run: pnpm run structure:dead-code

  # Mutation testing over the packages: informational, no score threshold, and outside `ci-gate`, so
  # it never holds a merge. StrykerJS has no sharding, so `tools/mutation-shards.mjs` splits each
  # package's source files into shards balanced by the tests their mutants ran last time, and the
  # matrix runs every shard in parallel against the package's saved results.
  #
  # A pull request mutates only the files it changed, re-tests only the mutants whose code or
  # covering tests changed since develop's saved results, and skips static mutants (module-level
  # code, which re-runs the whole suite per mutant). A push to develop and the nightly run mutate
  # every file, static mutants included, and the merge job saves the combined results. A cold full
  # run is hours of runner time (the daemon alone is over three hours on a fast laptop), hence the
  # long time limit, which only stops a hung job.
  mutation-plan:
    name: mutation plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      # Shards per package, sized from the measured full-run cost and kept to
      # 19 jobs in all, under the 20 jobs a free plan runs at once.
      MUTATION_SHARDS: '{"client-sdk": 1, "contracts": 3, "control-plane": 2, "crypto-paseto": 1, "runtime-daemon": 12}'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}
          # A pull request's changed files are read against its base commit.
          fetch-depth: 0

      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          # This job runs no install; with pnpm absent, the cache lookup fails.
          package-manager-cache: false

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Plan shards
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "matrix=$(node tools/mutation-shards.mjs plan)" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation (${{ matrix.package }} ${{ matrix.shard }})
    needs: [mutation-plan]
    if: needs.mutation-plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: "pnpm"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      # A pull request's summary lists the surviving mutants in the files it
      # changed; a full run's summary is the score table.
      - name: Mutation testing
        working-directory: packages/${{ matrix.package }}
        env:
          MUTATE: ${{ matrix.mutate }}
          SHARD: ${{ matrix.shard }}
          PACKAGE: ${{ matrix.package }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          report="$RUNNER_TEMP/mutation.txt"
          status=0
          static=()
          [[ "$PULL_REQUEST" == "true" ]] && static=(--ignoreStatic)
          pnpm exec stryker run ../../stryker.config.json --mutate "$MUTATE" "${static[@]}" > "$report" 2>&1 || status=$?
          {
            echo "### Mutation testing: $PACKAGE, shard $SHARD"
            echo '```text'
            if [[ $status -ne 0 ]]; then
              tail -n 60 "$report"
            elif [[ "$PULL_REQUEST" == "true" ]]; then
              grep -Ev '^[0-9]{2}:[0-9]{2}:[0-9]{2} \([0-9]+\) (INFO|DEBUG)' "$report"
            else
              sed -n '/tests per mutant on average/,$p' "$report" | grep -Ev ' (INFO|DEBUG) '
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Record the shard's files
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MUTATE: ${{ matrix.mutate }}
        run: printf '%s\n' "$MUTATE" > "packages/${{ matrix.package }}/.stryker/mutated-files.txt"

      - name: Upload shard results
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}--${{ matrix.shard }}
          path: |
            packages/${{ matrix.package }}/.stryker/incremental.json
            packages/${{ matrix.package }}/.stryker/mutated-files.txt
          # The results live under the package's `.stryker/` folder, which
          # upload-artifact skips as hidden unless told otherwise.
          include-hidden-files: true
          retention-days: 1

  # Folds every shard's results over the saved ones and saves them for the next
  # run. A shard that failed or timed out leaves its files' earlier results in
  # place.
  mutation-merge:
    name: mutation merge
    needs: [mutation]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          # This job runs no install; with pnpm absent, the cache lookup fails.
          package-manager-cache: false

      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/mutation-shards

      - name: Merge
        run: node tools/mutation-shards.mjs merge "$RUNNER_TEMP/mutation-shards"

      - name: Save mutation results
        uses: actions/cache/save@v4
        with:
          path: packages/*/.stryker/incremental.json
          key: stryker-incremental-${{ github.sha }}

  # Advisory: absent from `ci-gate`'s `needs`, so a coverage regression never blocks a merge. This
  # is measurement only; no number gates anything.
  #
  # One job rather than a matrix: `tools/coverage-report.mjs` fails closed on a root that declares
  # `test:coverage` but produced no report, which reads as a signal only if every root is measured
  # in the same workspace.
  coverage:
    name: coverage (informational)
    # Informational measurement, so it runs where the measurement is read — the
    # integration branch — rather than on every pull request, where it is a full
    # second install and test sweep nothing gates on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: "pnpm"

      # `ELECTRON_SKIP_BINARY_DOWNLOAD` because this job never launches Electron: the desktop
      # `test:coverage` is `vitest run --project=renderer`, a happy-dom project, and the smoke
      # project that spawns the binary is not in the coverage set. Otherwise the `apps/desktop`
      # postinstall would pull a 120-160 MB archive this job cannot use. Electron's own `install.js`
      # ignores the variable; `apps/desktop/scripts/materialize-electron.ts` honours it.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Coverage
        run: pnpm turbo run test:coverage

      # Renders one markdown table into the job summary. Writing to the summary rather than a PR
      # comment keeps this workflow's token at `contents: read` and third-party code out of the
      # workflow that carries the required `ci-gate`; the script header has the rationale.
      - name: Render coverage summary
        # The renderer is fail-closed on a root that declares `test:coverage` and
        # produced no report, so on a red run it reports the real partial state
        # rather than being skipped into silence.
        if: ${{ !cancelled() }}
        run: node tools/coverage-report.mjs

      # Retains lcov and json reports per run so a coverage baseline can cite artifacts rather than
      # a scrollback number.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          # 90 days, not the 30-day default: a baseline sampling window can outlive 30 days, and 90
          # is the ceiling for a private repo's default plan.
          retention-days: 90
          if-no-files-found: error

  # The daemon's `better-sqlite3` must load the tarball's bundled Node-API prebuild on every
  # platform the product ships to, not just the one the `test` job runs on (linux-x64). A missing or
  # unloadable prebuild elsewhere would otherwise surface first on a developer's machine or in a
  # release build, as a silent source compile or a crash at first open.
  #
  # Matrix: the five target platforms, on hosted-runner labels generally available for public
  # repositories:
  #   ubuntu-latest    → linux-x64
  #   ubuntu-24.04-arm → linux-arm64
  #   macos-latest     → darwin-arm64
  #   macos-15-intel   → darwin-x64     (the last Intel macOS image)
  #   windows-latest   → win32-x64
  # `win32-arm64` and the two `linuxmusl-*` prebuilds ship in the same tarball and are not covered:
  # `windows-11-arm` is not a target, and no hosted musl runner exists, so a musl check would need a
  # container leg.
  #
  # The install is scoped to the daemon and its workspace dependencies: the question is where one
  # binding comes from, and a full install would download an Electron binary per leg for nothing.
  # `--frozen-lockfile` still applies, so lockfile drift fails here as everywhere else.
  native-prebuilds:
    name: native prebuild (${{ matrix.prebuild }})
    # Five runners across three operating systems, and only the dependency graph (the lockfile, a
    # package.json, or the npm client config) can change which binding resolves. A pull request
    # touching none of them skips this job, and `ci-gate` reads the skip as success. The nightly
    # schedule runs it unconditionally.
    needs: [changes]
    if: needs.changes.outputs.deps == 'true' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            prebuild: linux-x64
          - os: ubuntu-24.04-arm
            prebuild: linux-arm64
          - os: macos-latest
            prebuild: darwin-arm64
          - os: macos-15-intel
            prebuild: darwin-x64
          - os: windows-latest
            prebuild: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SWEEP_REF }}

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      # Runs on the Node floor because asserting the prebuild on another version would not assert
      # the shipped configuration. The 13.x prebuilds are Node-API 10: a Node-API-9 host (22.12,
      # 22.13) cannot load the binding at all, seen as a silent SIGSEGV at the first
      # `new Database()` rather than Node's documented load-time throw.
      - name: Setup Node.js 24.16
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: "pnpm"

      - name: Install (runtime-daemon and its workspace dependencies only)
        run: pnpm install --frozen-lockfile --filter "@ai-sidekicks/runtime-daemon..."

      - name: Assert prebuild provenance and the SQLite pragma readback
        shell: bash
        env:
          EXPECTED_PREBUILD: ${{ matrix.prebuild }}
        run: |
          cat > "${RUNNER_TEMP}/assert-native-prebuild.mjs" <<'NODE'
          import { createRequire } from "node:module";
          import { existsSync, mkdtempSync, readdirSync, rmSync } from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const expectedPrebuild = process.env["EXPECTED_PREBUILD"];
          if (expectedPrebuild === undefined || expectedPrebuild === "") {
            throw new Error("EXPECTED_PREBUILD is unset — the matrix leg names the platform");
          }

          // `pathToFileURL`, not a `file://` template: a Windows cwd is
          // `D:\a\...`, which is not a valid file URL.
          const daemonRequire = createRequire(
            new URL("packages/runtime-daemon/package.json", pathToFileURL(`${process.cwd()}/`)),
          );

          const DatabaseConstructor = daemonRequire("better-sqlite3");

          // Conjunct (a): the binding the daemon RESOLVES, read back off
          // `require.cache` after a real open, so a prebuild that resolves but
          // will not load fails here too.
          const probeDirectory = mkdtempSync(path.join(os.tmpdir(), "sidekicks-prebuild-"));
          const databasePath = path.join(probeDirectory, "probe.db");
          try {
            const seedDatabase = new DatabaseConstructor(databasePath);
            seedDatabase.pragma("journal_mode = wal");
            seedDatabase.exec("CREATE TABLE probe (id INTEGER PRIMARY KEY)");
            seedDatabase.close();

            const loadedBindings = Object.keys(daemonRequire.cache).filter((entry) =>
              entry.endsWith(".node"),
            );
            if (loadedBindings.length !== 1) {
              throw new Error(
                `expected exactly one loaded .node binding, saw ${JSON.stringify(loadedBindings)}`,
              );
            }
            const [loadedBinding] = loadedBindings;
            if (
              !/[/\\]prebuilds[/\\](darwin|linux|linuxmusl|win32)-(x64|arm64)\.node$/.test(
                loadedBinding,
              )
            ) {
              throw new Error(`better-sqlite3 did not load a tarball prebuild: ${loadedBinding}`);
            }
            // ...and it is THIS platform's prebuild. Without this the assertion
            // would pass on a leg that silently loaded the wrong architecture.
            const loadedName = path.basename(loadedBinding, ".node");
            if (loadedName !== expectedPrebuild) {
              throw new Error(
                `expected the ${expectedPrebuild} prebuild, loaded ${loadedName} (${loadedBinding})`,
              );
            }

            // Conjunct (b): `build/Release/` holds no `.node` — the one location
            // a source build writes and, with `prebuild-install` gone from the
            // 13.x line, the only writer left.
            const packageRoot = path.dirname(daemonRequire.resolve("better-sqlite3/package.json"));
            const releaseDirectory = path.join(packageRoot, "build", "Release");
            const compiledArtifacts = existsSync(releaseDirectory)
              ? readdirSync(releaseDirectory).filter((entry) => entry.endsWith(".node"))
              : [];
            if (compiledArtifacts.length > 0) {
              throw new Error(
                `build/Release holds compiled artifacts (a source build ran): ${JSON.stringify(compiledArtifacts)}`,
              );
            }

            // The daemon's pragmas, on the REOPEN path — the only path that tests
            // the override. A freshly created database is in delete mode and
            // reads `synchronous = 2` from `SQLITE_DEFAULT_SYNCHRONOUS`, which
            // says nothing about the WAL default the override exists for. A
            // connection opening an ALREADY-WAL database reads
            // `SQLITE_DEFAULT_WAL_SYNCHRONOUS`, and the daemon's durability
            // rule is that this must be raised to FULL, not inherited.
            const database = new DatabaseConstructor(databasePath);
            const compileOptions = database.pragma("compile_options").map((row) => row.compile_options);
            const walSynchronousDefault = database.pragma("synchronous", { simple: true });
            if (walSynchronousDefault !== 1) {
              throw new Error(
                `expected the WAL default synchronous = 1 (NORMAL) before the override, read ${String(walSynchronousDefault)}`,
              );
            }

            database.pragma("journal_mode = wal");
            database.pragma("synchronous = FULL");
            database.pragma("foreign_keys = ON");
            database.pragma("busy_timeout = 5000");

            const sqliteVersion = database.prepare("SELECT sqlite_version() AS version").get().version;
            const readback = {
              journal_mode: database.pragma("journal_mode", { simple: true }),
              synchronous: database.pragma("synchronous", { simple: true }),
              foreign_keys: database.pragma("foreign_keys", { simple: true }),
              busy_timeout: database.pragma("busy_timeout", { simple: true }),
            };
            const expectedReadback = {
              journal_mode: "wal",
              synchronous: 2,
              foreign_keys: 1,
              busy_timeout: 5000,
            };
            for (const [pragmaName, expectedValue] of Object.entries(expectedReadback)) {
              if (readback[pragmaName] !== expectedValue) {
                throw new Error(
                  `pragma ${pragmaName}: expected ${String(expectedValue)}, read ${String(readback[pragmaName])}`,
                );
              }
            }
            database.close();

            console.log(`platform:            ${process.platform}-${process.arch}`);
            console.log(`node:                ${process.version} (Node-API ${process.versions.napi})`);
            console.log(`loaded prebuild:     ${loadedBinding}`);
            console.log(`build/Release .node: none (${releaseDirectory})`);
            console.log(`better-sqlite3:      ${daemonRequire("better-sqlite3/package.json").version}`);
            console.log(`embedded sqlite:     ${sqliteVersion}`);
            console.log(
              `wal synchronous default: ${String(walSynchronousDefault)} (SQLITE_DEFAULT_WAL_SYNCHRONOUS present: ${String(compileOptions.includes("DEFAULT_WAL_SYNCHRONOUS=1"))})`,
            );
            console.log(`pragma readback:     ${JSON.stringify(readback)}`);
          } finally {
            rmSync(probeDirectory, { recursive: true, force: true });
          }
          NODE
          node "${RUNNER_TEMP}/assert-native-prebuild.mjs"

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [changes, test, desktop, structure, native-prebuilds]
    if: always()
    steps:
      - name: Aggregate required-checks status
        # Aggregator-job pattern: branch protection on `main` requires this one job, so renaming or
        # adding matrix legs cannot silently bypass it.
        #
        # One predicate for every job: `skipped` counts as success. A path-filtered job that did not
        # need to run must not hold the gate pending, and a job skipped by its filter carries as
        # much signal as a green one. `test` is never skipped. A cancelled or failed dependency
        # still fails, since neither result is accepted.
        #
        # `changes` is checked too, and that is load-bearing: a path filter that errors (a transient
        # files-API failure, a bad expression) skips every job that needs it, the same result a
        # filter miss gives. Without this line the gate would read those skips as success and go
        # green having run nothing. `changes` is unconditional, so it is never legitimately skipped.
        run: |
          fail=0
          check() {
            if [[ "$2" != "success" && "$2" != "skipped" ]]; then
              echo "ci-gate: job '$1' did not succeed (result=$2)"
              fail=1
            fi
          }
          check changes "${{ needs.changes.result }}"
          check test "${{ needs.test.result }}"
          check desktop "${{ needs.desktop.result }}"
          check structure "${{ needs.structure.result }}"
          check native-prebuilds "${{ needs.native-prebuilds.result }}"
          if [[ $fail -ne 0 ]]; then exit 1; fi
          echo "ci-gate: all required jobs succeeded or were skipped by path filter"
