# Engineering CI surface per ADR-023 §Axis 1.
#
# This is the V1 PR #1 skeleton: one test job on linux/macOS/windows + one ci-gate
# aggregator. The 5-platform Rust PTY sidecar matrix and the explicit two-ABI rebuild
# step land in later PRs (no sidecar source yet; no Electron installed yet).
#
# Default workflow permissions are read-only; per-job permissions opt up to write
# only where required. Event-split concurrency: PR runs cancel-in-progress, integration
# branch (develop, main) runs do not.
#
# Branch protection on develop and main MUST require the `ci-gate` job (only). Matrix
# leg names embed strategy values and are not stable required-check targets per
# https://github.com/orgs/community/discussions/26822.
#
# `--no-verify` bypass closure (ADR-023 §Axis 2 D-1): explicit `eslint .` and
# `prettier --check .` over the entire repo. Earlier iterations used
# `lefthook run pre-commit --all-files` for parity, but lint-staged reads the git
# staging index (empty in CI), making that invocation an empirical no-op.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Tier-1 (Node 22.14 — daemon + Electron renderer + shared packages per ADR-022
  # §Decision row 8). Runs the full repo-wide lint + format check + build +
  # typecheck + lint + test against the daemon-tier Node version.
  test-node22:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Turborepo remote cache (BL-122 experiment — see ADR-023 §Axis 1 + §Decision
    # Log 2026-08-25). `permissions:` and `env:` are job-scoped and BOTH are
    # load-bearing:
    #   - A job-level `permissions:` map REPLACES the workflow-level one, so
    #     `contents: read` must be restated or `actions/checkout` loses its
    #     grant. No `actions:` grant is added, and that is deliberate: the cache
    #     backend authenticates with the runner-injected `ACTIONS_RUNTIME_TOKEN`
    #     (`@actions/cache`'s `getRuntimeToken()`), never with `GITHUB_TOKEN`,
    #     so `actions: write` buys the cache nothing while handing PR-authored
    #     code repo-wide Actions-API writes — deleting caches on any ref,
    #     cancelling runs — which cache ref-scoping does NOT contain. Corrected
    #     2026-08-25; see the Decision Log row.
    #   - The signature key is consumed at run time by the `pnpm turbo run …`
    #     steps, not by the caching action, so it must sit at job scope; a
    #     step-level `env:` would silently disable artifact signing. The
    #     repository secret is set, so signing is live; were it ever unset the
    #     value would interpolate empty and the cache would degrade inertly.
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        # Per ADR-023 §Axis 1 drift correction: macos-13 fully deprecated 2025-12-04.
        # macos-15-intel is the last x86_64 macOS runner (supported through Aug 2027).
        # PR #1 keeps the matrix small (one OS, one node tier) until later PRs widen it.
        os: [ubuntu-latest]
        node: ["22.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned per ADR-023 §Axis 4 supply-chain hygiene; Renovate's
        # helpers:pinGitHubActionDigests preset (renovate.json5) keeps this current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-022 §Decision Log 2026-09-01 / Spec-015 §Driver Pin: the daemon's
      # `better-sqlite3` 13.0.3 must come from the tarball's bundled Node-API
      # prebuild, never from a source compile. This asserts PROVENANCE in two
      # conjuncts rather than absence in one:
      #
      #   (a) the binding the daemon actually resolves — the file `lib/binding.js`
      #       selects, read back off `require.cache` after a real `new Database()`
      #       so a prebuild that resolves but will not load also fails here —
      #       lives under `prebuilds/<platform>-<arch>.node`; and
      #   (b) the package's `build/Release/` holds no `.node`, the one location a
      #       source build writes and, with `prebuild-install` gone from the 13.x
      #       line, the only writer left.
      #
      # `node-gyp` does not run at all for this package. 13.0.3 declares no
      # install script, so the only candidate is the implicit `node-gyp rebuild`
      # npm synthesizes for a package shipping a `binding.gyp`, and
      # `pnpm-workspace.yaml` denies it (`allowBuilds: better-sqlite3: false`).
      # Upstream writes that `binding.gyp` to no-op when a host prebuild exists,
      # but CONFIGURE runs before gyp evaluates the condition, and on
      # `windows-latest` node-gyp 11.5.0 cannot parse the image's Visual Studio
      # 18 install — so approving the build fails `pnpm install` outright on a
      # platform whose prebuild is sitting in the tarball. Denying it is also
      # what makes conjunct (b) absolute: `build/Release/` cannot hold a `.node`
      # if no build ever runs. Conjunct (b) alone was ambiguous on the 12.x line,
      # which downloaded its prebuild INTO `build/Release/`; on 13.x it is not.
      #
      # This step and the `native-prebuilds` job below are not duplicates. They
      # answer different questions on purpose: this one asserts provenance under
      # the FULL workspace install every other job in this file performs, on the
      # one platform this matrix runs; that one asserts it under a scoped install
      # on each of the five ADR-022 target platforms and additionally exercises
      # the `Spec-015 §Pragmas` readback the prebuild has to actually support.
      - name: Assert better-sqlite3 loads a bundled Node-API prebuild
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/assert-better-sqlite3-prebuild.mjs" <<'NODE'
          import { createRequire } from "node:module";
          import { existsSync, readdirSync } from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          // `pathToFileURL`, not a `file://` template: a Windows cwd is
          // `D:\a\...` and `file://D:\a\...` is not a valid file URL. This job's
          // matrix is Linux-only, but the `native-prebuilds` job below runs the
          // same resolution on `windows-latest`, so the two forms must not drift.
          const daemonRequire = createRequire(
            new URL("packages/runtime-daemon/package.json", pathToFileURL(`${process.cwd()}/`)),
          );

          const DatabaseConstructor = daemonRequire("better-sqlite3");
          new DatabaseConstructor(":memory:").close();

          const loadedBindings = Object.keys(daemonRequire.cache).filter((entry) =>
            entry.endsWith(".node"),
          );
          if (loadedBindings.length !== 1) {
            throw new Error(
              `expected exactly one loaded .node binding, saw ${JSON.stringify(loadedBindings)}`,
            );
          }
          const [loadedBinding] = loadedBindings;
          if (!/[/\\]prebuilds[/\\](darwin|linux|linuxmusl|win32)-(x64|arm64)\.node$/.test(loadedBinding)) {
            throw new Error(`better-sqlite3 did not load a tarball prebuild: ${loadedBinding}`);
          }

          const packageRoot = path.dirname(daemonRequire.resolve("better-sqlite3/package.json"));
          const releaseDirectory = path.join(packageRoot, "build", "Release");
          const compiledArtifacts = existsSync(releaseDirectory)
            ? readdirSync(releaseDirectory).filter((entry) => entry.endsWith(".node"))
            : [];
          if (compiledArtifacts.length > 0) {
            throw new Error(
              `build/Release holds compiled artifacts (a source build ran): ${JSON.stringify(compiledArtifacts)}`,
            );
          }

          console.log(`loaded prebuild: ${loadedBinding}`);
          console.log(`build/Release holds no .node: ${releaseDirectory}`);
          NODE
          node "${RUNNER_TEMP}/assert-better-sqlite3-prebuild.mjs"

      # Backs Turborepo's remote cache with the GitHub Actions cache (no
      # third-party service, no spend). SHA-pinned per ADR-023 §Axis 4.
      #
      # Threat model, stated honestly: the controls that keep a fork PR from
      # poisoning this cache are GitHub withholding secrets from fork-originated
      # workflows, the read-only `GITHUB_TOKEN` on `pull_request`, and the
      # `--cache=local:rw,remote:r` switch appended to every turbo invocation
      # below on PR events. `remoteCache.signature` is NOT one of them —
      # Turborepo documents it as artifact-integrity verification and states it
      # "is not a security feature". ADR-023 §Axis 1's "HMAC >=32 bytes"
      # requirement is still met; only the rationale is corrected.
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      # Electron 44 ships NO install script, so `pnpm install` alone leaves no
      # `dist/` — see `apps/desktop/scripts/materialize-electron.ts` for the
      # measurement and the reasoning. `apps/desktop`'s `postinstall` runs that
      # script, so by this point the binary is normally already present and
      # this step is a fast verification plus the path extraction the SUID step
      # below needs.
      #
      # It runs the SAME script rather than a second acquisition path: if the
      # postinstall was skipped (or a later step deleted `dist/`), this repairs
      # it, and a download failure is still its own red step rather than a test
      # timeout. `node -p` runs afterwards against a populated `dist/`, so it
      # prints only the path — the script's own progress output goes to the log
      # rather than into the captured value.
      - name: Materialize the Electron binary
        id: electron
        working-directory: apps/desktop
        run: |
          node --experimental-strip-types scripts/materialize-electron.ts
          executable=$(node -p "require('electron')")
          [ -x "$executable" ] || { echo "::error::electron did not resolve to an executable: '$executable'"; exit 1; }
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
          ls -l "$executable"

      # Electron 44.x on Ubuntu 24.04 GitHub Actions runners requires the
      # SUID sandbox helper (`chrome-sandbox`) to be owned by root and have
      # mode 4755 for the renderer's Linux namespace sandbox to initialize.
      # pnpm install cannot run the Electron post-install step under root,
      # so we chown/chmod the binary here. This preserves `webPreferences.sandbox: true`
      # (`Spec-023 §Security Hardening Baseline` — the mandatory webPreferences
      # block: contextIsolation, sandbox and webSecurity true, nodeIntegration
      # false) — running Electron with `--no-sandbox` would defeat the very
      # invariant apps/desktop/test/launch.smoke.test.ts asserts (the
      # three-globals set, per `Spec-023 §Acceptance Criteria`: "Renderer
      # attempts to access `require`, `process`, or `global` return
      # `undefined`").
      #
      # The helper is taken from beside the executable the step above
      # resolved, not searched for under `.pnpm`: a tree that holds two
      # Electron versions (a stale one and the pinned one) has two
      # `chrome-sandbox` files, and `find -print -quit` would return whichever
      # it walked into first. The guard fails fast if it is absent, which
      # would mean the `dist/` layout changed.
      - name: Configure Electron SUID sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          sandbox="$(dirname "${{ steps.electron.outputs.executable }}")/chrome-sandbox"
          [ -f "$sandbox" ] || { echo "::error::chrome-sandbox not beside the resolved Electron executable — dist layout drift?"; exit 1; }
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"

      # One X server for the whole job, gated on ACTUALLY ANSWERING before any
      # test runs, with `$DISPLAY` exported for every later step.
      #
      # Replaces a per-spawn `xvfb-run -a` inside the Electron test harnesses
      # (apps/desktop/test/launch.smoke.test.ts, lifecycle.gc.test.ts), which
      # was unsound in three ways on a hosted runner:
      #
      #   1. `xvfb-run -a` picks its display number with `find_free_servernum()`
      #      — a plain `while [ -f /tmp/.X$i-lock ]` scan. That is a documented
      #      TOCTOU (Debian #521075 / Launchpad #348052): two concurrent
      #      invocations can select the same number. The script's retry loop
      #      recovers, so this was not the root cause of the boot flake, but it
      #      is real and it is free to remove.
      #   2. Each spawn stood up its OWN Xvfb plus a wrapper shell, so the two
      #      Electron test files put two X servers and two extra shells on a
      #      4-vCPU box for no benefit.
      #   3. `xvfb-run` runs the command as `... "$@" 2>&1` — it MERGES the
      #      child's stderr into stdout. That silently disabled every
      #      stderr-keyed diagnosis branch in the smoke harness on exactly the
      #      platform CI runs (observed in run 33571210321: the electron shim's
      #      `console.error` notice arrived in the harness's stdout capture
      #      while `--- stderr ---` was empty).
      #
      # `-nolisten tcp` keeps the server on its unix socket only.
      #
      # Readiness uses Xvfb's OWN `-displayfd` signal rather than an external
      # client probe. The server picks a free display itself and writes the
      # number to that descriptor only after it is listening, so reading the
      # number IS the readiness proof — and because the SERVER allocates it, the
      # display-number race is gone by construction rather than by retry.
      #
      # This deliberately does not use `xdpyinfo`: the ubuntu-24.04 image ships
      # `xvfb` but NOT `x11-utils`, so `xdpyinfo` is absent and a probe built on
      # it can never succeed. Measured, not assumed — the first revision of this
      # step did exactly that and failed with "Xvfb did not answer on :99 within
      # 15s" while the Xvfb process was alive the whole time (run 33573354839).
      # Installing `x11-utils` would fix the probe but adds an apt round trip to
      # every run for a signal the server already gives us for free.
      #
      # NOTE: nothing here passes `--no-sandbox`. That switch would disable the
      # renderer's Linux namespace sandbox and thereby defeat the very invariant
      # apps/desktop/test/launch.smoke.test.ts asserts (`require` / `process` /
      # `global` all `undefined`, which follow from `webPreferences.sandbox:
      # true`). The SUID helper configured in the step above is what makes that
      # sandbox work, and it stays.
      - name: Start Xvfb and wait for the display to answer (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          display_file="${RUNNER_TEMP}/xvfb-display"
          xvfb_log="${RUNNER_TEMP}/xvfb.log"
          : > "$display_file"
          # No `:N` argument: with `-displayfd` the server allocates a free
          # display itself and reports it on fd 3, which we point at a file.
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp \
            3>"$display_file" >"$xvfb_log" 2>&1 &
          xvfb_pid=$!
          # Deliberately no teardown step: the display is meant to outlive every
          # test in the job, and the runner reclaims the VM afterwards. This is
          # also what removes the per-spawn teardown race the old `xvfb-run`
          # posture had, where each spawn tore its own X server down.
          for attempt in $(seq 1 60); do
            display_number=$(tr -d '[:space:]' < "$display_file")
            if [ -n "$display_number" ]; then
              echo "Xvfb serving :${display_number} after ${attempt} attempt(s)"
              echo "DISPLAY=:${display_number}" >> "$GITHUB_ENV"
              exit 0
            fi
            # Checked AFTER the read, not before: a server that came up and
            # wrote its number is a success even if this loop notices the pid
            # later, and checking first would race the write.
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "::error::Xvfb exited before reporting a display number"
              cat "$xvfb_log" || true
              exit 1
            fi
            sleep 0.25
          done
          echo "::error::Xvfb reported no display number within 15s"
          cat "$xvfb_log" || true
          exit 1

      # Chromium probes the session bus for portals and the secret service on
      # boot. There is no session bus on a hosted runner, and with
      # `DBUS_SESSION_BUS_ADDRESS` unset libdbus falls back to an autolaunch
      # attempt — a boot-path round trip that can only cost time here.
      # `disabled:` is unparseable as a bus address, so the lookup fails
      # immediately instead. `NO_AT_BRIDGE=1` suppresses the accessibility
      # bridge's own bus connection. Neither changes any sandbox or
      # `webPreferences` setting; both only remove a probe that cannot succeed.
      - name: Harden D-Bus / portal environment for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DBUS_SESSION_BUS_ADDRESS=disabled:" >> "$GITHUB_ENV"
          echo "NO_AT_BRIDGE=1" >> "$GITHUB_ENV"

      # ADR-023 §Axis 2 D-1: closure for `git commit --no-verify` bypass. Explicit
      # full-repo invocations (NOT `lefthook run pre-commit --all-files` — lint-staged
      # reads the git staging index, which is empty in the CI checkout, so that
      # invocation is an empirical no-op). Gitleaks runs in .github/workflows/gitleaks.yml.
      - name: Lint (full repo)
        run: pnpm -w exec eslint .

      - name: Format check (full repo)
        run: pnpm -w exec prettier --check .

      - name: Build (Node 22 tier — excluding control-plane)
        run: pnpm turbo run build --filter='!@ai-sidekicks/control-plane' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Production-safety check: the test-machinery probe paths in
      # apps/desktop/src/main/index.ts (the smoke probe and the GC-reachability
      # probe) are gated by the compile-time-static `__SIDEKICKS_SMOKE_BUILD__`
      # identifier (Vite `define` substitution per
      # apps/desktop/electron.vite.config.ts). The default `electron-vite build`
      # substitutes `false`; Rollup's tree-shaker eliminates the entire
      # `if (false && expr) { ... }` body, physically stripping the probe
      # markers — `SIDEKICKS_SMOKE_PROBE`, `executeJavaScript`, `about:blank`
      # (smoke probe) and `SIDEKICKS_GC_PROBE`, `queryObjects`, `runGcProbe`
      # (GC probe) — from `apps/desktop/out/main/index.js`. This step asserts
      # that guarantee by grepping the release artifact; any match means
      # dead-code-elimination silently regressed (Vite/Rollup version drift,
      # define-substitution change, or someone replaced the compile-time gate
      # with a runtime-only one). The "no test machinery in production
      # binaries" invariant derives from Spec-023 §Trust Stance + §Pitfalls
      # To Avoid (renderer-untrusted; any reachable `executeJavaScript` or
      # `queryObjects` call weakens that posture).
      - name: Assert release bundle excludes test-machinery markers (apps/desktop)
        run: |
          bundle=apps/desktop/out/main/index.js
          [ -f "$bundle" ] || { echo "::error::$bundle not found — release build skipped or output path drifted"; exit 1; }
          fail=0
          for marker in "SIDEKICKS_SMOKE_PROBE" "executeJavaScript" "about:blank" "SIDEKICKS_GC_PROBE" "queryObjects" "runGcProbe"; do
            count=$(grep -c -- "$marker" "$bundle" || true)
            if [ "$count" -ne 0 ]; then
              echo "::error::release bundle contains test-machinery marker '$marker' ($count occurrences in $bundle) — dead-code-elimination regressed"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::compile-time-static gate __SIDEKICKS_SMOKE_BUILD__ should substitute to 'false' in release builds; check apps/desktop/electron.vite.config.ts define block"
            exit 1
          fi
          echo "ok: release bundle excludes test-machinery markers"

      - name: Typecheck (Node 22 tier — excluding control-plane)
        run: pnpm turbo run typecheck --filter='!@ai-sidekicks/control-plane' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Lint per-package (Node 22 tier — excluding control-plane)
        run: pnpm turbo run lint --filter='!@ai-sidekicks/control-plane' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Split into a parallel step and a serial one, because turbo's default
      # concurrency (10) otherwise runs `@ai-sidekicks/desktop#test:smoke`
      # alongside `runtime-daemon#test` (a ~40 s suite), `client-sdk#test` and
      # the desktop renderer suite on one 4-vCPU runner — and that project is
      # the only one that spawns a full Electron/Chromium tree and asserts a
      # wall-clock boot deadline against it.
      #
      # This is the second half of one fix. The first half was intra-project:
      # the `main` vitest project globs two Electron-spawning files and ran them
      # concurrently (see `apps/desktop/vitest.config.ts`). Serialising those
      # made the gate pass, but three consecutive green runs of the fixed tree
      # still measured the same boot at 4129 / 6732 / 13008 ms — a 3.2x spread
      # on identical code, with the slowest sample inside 13% of its ceiling.
      # That residual is this concurrency, one level up, and it is what the two
      # steps below remove.
      #
      # The desktop step below enumerates the package's tiers one Turbo task
      # group at a time rather than running the package's own `test`, because
      # that is what makes the serialisation real. The two negative filters here
      # are both applied as exclusions rather than OR'd into a selection.
      #
      # The enumeration is deliberate and it has a known cost: a vitest project
      # added to `apps/desktop/vitest.config.ts` is NOT picked up here by
      # construction. `main-unit` landed that way and for one push ran in
      # `pnpm test` and in no required check, so every `src/main/**` and
      # `build/**` unit — protocol containment, navigation policy, window
      # hardening, startup ordering, load recovery — was unguarded on merge.
      # That cost is now paid by a checker rather than by a convention:
      # `apps/desktop/test/console/architecture/ci-tier-coverage.test.ts` reads
      # this file, resolves the real project set through `createVitest`, and
      # fails when a project is named by no job `ci-gate` requires or is missing
      # from the package's aggregate `test` script. A new project still joins the
      # enumeration below in the PR that introduces it — that test is what makes
      # forgetting it a red check instead of a silent gap.
      - name: Test (Node 22 tier — excluding control-plane and desktop)
        run: pnpm turbo run test --filter='!@ai-sidekicks/control-plane' --filter='!@ai-sidekicks/desktop' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # The three browser-mode console tiers drive a real Chromium through
      # Vitest browser mode, and `pnpm install` downloads no browser. Only two of
      # the three run on this job — the screenshot tier is pinned to its own
      # macOS job, whose references this repository commits — but the download is
      # one browser either way.
      #
      # `--with-deps` rather than a bare install: Playwright's own chromium build
      # is not Electron's, and the supported way to satisfy its shared-library
      # set on Ubuntu is the flag, which apt-installs exactly what the pinned
      # revision names. Skipping it would trade a documented apt round trip for a
      # loader error that surfaces as a red required check with no obvious cause.
      - name: Install the Chromium build the console browser-mode tiers drive
        run: pnpm --filter @ai-sidekicks/desktop exec playwright install --with-deps chromium

      # The desktop package, alone on the runner, in the order the three build
      # flavours allow. This mirrors `apps/desktop/package.json`'s aggregate
      # `test` script group for group, and `ci-tier-coverage.test.ts` fails if
      # the two drift apart.
      #
      # The ORDER is load-bearing rather than stylistic. `build`, `build:smoke`,
      # and `build:fixtures` all write `apps/desktop/out/**` and differ in the
      # `define` that decides what the console talks to, so a tier must run
      # against the flavour its own Turbo edge produced and before the next
      # flavour overwrites it. Groups, in order:
      #
      #   1. Source-only tiers — `renderer` (happy-dom), `main-unit` (node, a
      #      stubbed `electron`, one `node`-only spawn), and the console `unit`,
      #      `architecture`, and `assets` tiers. All parallel-safe, none starts a
      #      Chromium tree, none builds.
      #   2. The two browser-mode tiers, `--concurrency=1` so two headless
      #      Chromium instances never share the runner. Neither builds.
      #   3. The bundle tier, on the RELEASE build this job already made and
      #      grepped above — it measures `out/renderer` against `budgets.json`
      #      and asserts what a release bundle does not contain, so it must run
      #      before any other flavour is written.
      #   4. The Electron smoke project, `--concurrency=1` so not even its own
      #      `build:smoke` dependency overlaps it.
      #   5. The two Electron console tiers, on the FIXTURE build, one invocation
      #      so `build:fixtures` runs once and `--concurrency=1` so only one
      #      Electron process is alive at a time. Both drive a real window
      #      through Playwright's `_electron` against the `$DISPLAY` the Xvfb
      #      step above exported and the SUID sandbox helper it configured.
      #
      # Nothing else is scheduled against any of them.
      - name: Test (desktop — source tiers, browser mode, then each build flavour serially)
        run: |
          set -euo pipefail
          cache_flag='${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}'
          pnpm turbo run test:renderer test:main-unit test:console-unit test:console-architecture test:console-assets --filter=@ai-sidekicks/desktop ${cache_flag}
          pnpm turbo run test:console-browser test:console-accessibility --filter=@ai-sidekicks/desktop --concurrency=1 ${cache_flag}
          pnpm turbo run test:console-bundle --filter=@ai-sidekicks/desktop --concurrency=1 ${cache_flag}
          pnpm turbo run test:smoke --filter=@ai-sidekicks/desktop --concurrency=1 ${cache_flag}
          pnpm turbo run test:console-e2e test:console-endurance --filter=@ai-sidekicks/desktop --concurrency=1 ${cache_flag}

      # The desktop structure gates (Plan-023 Phase 1C): `knip` for dead code, then
      # `dependency-cruiser` for the import DAG. Both are scoped to `apps/desktop` — a desktop
      # PR never sweeps the daemon or the control plane — and both fail this job, which
      # `ci-gate` already depends on, so neither needs a new required check.
      #
      # Two tasks with `--continue` rather than one fused task: `knip` answers "does an entry
      # point reach this?" and `dependency-cruiser` answers "is this import allowed to exist?",
      # neither claim subsumes the other, and a sequential aggregate would hide the second
      # leg's findings behind the first leg's exit code.
      - name: Structure gates (apps/desktop — dead code + layering)
        run: pnpm turbo run structure:dead-code structure:layering --filter=@ai-sidekicks/desktop --continue ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Public-surface validation for the workspace libraries. Two complementary
      # linters run against the *packed* tarball (not the source tree), so they
      # see exactly what a consumer would install:
      #   - publint --strict: packaging correctness (exports map resolves, files
      #     listed in "files" exist, module type is consistent). --strict makes
      #     warnings fatal; the packages are clean at this bar.
      #   - attw (@arethetypeswrong/cli): how the shipped .d.ts resolves under
      #     each module-resolution mode. Each package carries an .attw.json with
      #     the `esm-only` profile — these are "type": "module" packages with no
      #     CJS export, so the node10 / node16-cjs resolutions are intentionally
      #     ignored (a CJS consumer must dynamic-import) while node16-from-ESM
      #     and bundler stay enforced.
      # attw's transitive dep fflate is pinned to 0.8.2 via a pnpm override (see
      # pnpm-workspace.yaml); fflate 0.8.3 broke attw's tarball extraction.
      # Libraries are discovered from packages/*/package.json and partitioned by
      # their minimum supported Node major (semver.minVersion of engines.node) —
      # no hardcoded list to drift as packages are added. This step validates the
      # Node 22 tier (floor < 24); the matching step in the Node 24 job validates
      # floor >= 24. minVersion (not the first numeric token) is used so reordered
      # OR-ranges like "^24 || >=22.14.0" bucket by their true minimum (22), not a
      # higher leading clause. The split mirrors the build-filter partition above
      # (control-plane is carved to Node 24 for the same engines.node reason), so a
      # new library is validated on the tier it is built on. apps/* are
      # applications, not published libraries, and are intentionally out of scope.
      - name: Validate package public surface (publint + attw — Node 22 tier)
        run: |
          fail=0
          tmp=$(mktemp -d)
          for pj in packages/*/package.json; do
            dir=$(dirname "$pj")
            pkg=$(basename "$dir")
            major=$(node -e 'const s=require("semver");const e=require("./"+process.argv[1]).engines?.node;let m=null;try{if(e)m=s.minVersion(e)}catch{}process.stdout.write(m?String(m.major):"")' "$pj" 2>/dev/null)
            [ "${major:-22}" -ge 24 ] && continue  # Node 24 tier handles floor >= 24
            echo "::group::$pkg — publint --strict + attw (esm-only)"
            ( cd "$dir" && pnpm exec publint --strict ) || { echo "::error::publint failed for $pkg"; fail=1; }
            ( cd "$dir" && pnpm pack --pack-destination "$tmp" >/dev/null ) || { echo "::error::pnpm pack failed for $pkg"; fail=1; }
            tgz=$(find "$tmp" -maxdepth 1 -name '*.tgz')
            ( cd "$dir" && pnpm exec attw "$tgz" ) || { echo "::error::attw failed for $pkg"; fail=1; }
            find "$tmp" -maxdepth 1 -name '*.tgz' -delete
            echo "::endgroup::"
          done
          rm -rf "$tmp"
          if [ $fail -ne 0 ]; then
            echo "::error::package public-surface validation failed (publint/attw)"
            exit 1
          fi
          echo "ok: all Node 22 tier packages pass publint --strict + attw"

      # Plan-execution skill tests (Layer 1 fixture-driven + Layer 2 unit). Closes the gap
      # noted in spec §10.4(a) — pre-housekeeper, the .claude/skills/plan-execution/scripts/
      # tests had no CI run. Uses --experimental-strip-types per ADR-022 + repo precedent
      # (tools/docs-corpus/bin/pre-commit-runner.ts ships with the same flag).
      #
      # Routed through tools/run-node-tests.mjs rather than `node --test` directly: a glob
      # that matches nothing makes `node --test` exit 0 having run no tests, and this job is
      # a `ci-gate` dependency — so a directory rename would turn a REQUIRED check green
      # while executing nothing. The wrapper refuses to spawn on a zero-match and enforces
      # a floor. --min-files is set below the current 13 so ordinary consolidation does not
      # trip it while a collapse to one file still does.
      #
      # The pattern stays in glob form, now resolved by the wrapper rather than by Node:
      # on Node 22.12 — this repo's floor when the behavior was measured, since moved to
      # 22.14 — `node --test <dir>` treats a bare directory arg as
      # a module specifier and fails it as a test (`not ok 1 - <dir>`, ERR_TEST_FAILURE,
      # "Cannot find module") — measured on an empty dir, a dir holding a .test.mjs, and a
      # dir holding a non-test file alike. That form is loud, not silent; the silent shapes
      # the wrapper exists to catch are the zero-match glob and the dropped missing path.
      - name: Run plan-execution skill tests (Layer 1 + Layer 2)
        run: node tools/run-node-tests.mjs --min-files=10 --experimental-strip-types '.claude/skills/plan-execution/scripts/__tests__/**/*.test.mjs'

      # Hook guard tests (command-guard.py + worktree.sh, driven as
      # subprocesses from node:test — no Python test framework per ADR-023).
      # This leg exercises the Linux /proc occupancy path; the darwin/lsof
      # path — the platform of the 2026-07-07 occupied-worktree incident —
      # runs in the dedicated `hook-tests-macos` job below.
      #
      # Same fail-closed wrapper as the step above. No --min-files here: this tree
      # holds a single test file, so a floor of 1 would be exactly the wrapper's
      # built-in zero-match check and would add no signal.
      - name: Run hook guard tests
        run: node tools/run-node-tests.mjs '.claude/hooks/__tests__/**/*.test.mjs'

      # The fail-closed test runner's own suite, run THROUGH the runner. Without
      # this the tool that guards every other test invocation would itself have no
      # CI coverage — the exact gap it exists to close. Its tests spawn the runner
      # as a subprocess, so this step also exercises the nested-invocation path.
      - name: Run test-runner tool tests
        run: node tools/run-node-tests.mjs 'tools/__tests__/**/*.test.mjs'

  # Tier-2 (Node 24 — control-plane + CLI per ADR-022 §Decision row 8). The
  # control-plane package declares `engines.node: ">=24.0.0"`, so its build /
  # typecheck / test must run against Node 24 to validate the floor. Other
  # packages stay on Node 22 in `test-node22` above.
  test-node24:
    name: test (${{ matrix.os }} / node ${{ matrix.node }} / control-plane)
    runs-on: ${{ matrix.os }}
    # Turborepo remote cache (BL-122 experiment — see ADR-023 §Axis 1 + §Decision
    # Log 2026-08-25). `permissions:` and `env:` are job-scoped and BOTH are
    # load-bearing:
    #   - A job-level `permissions:` map REPLACES the workflow-level one, so
    #     `contents: read` must be restated or `actions/checkout` loses its
    #     grant. No `actions:` grant is added, and that is deliberate: the cache
    #     backend authenticates with the runner-injected `ACTIONS_RUNTIME_TOKEN`
    #     (`@actions/cache`'s `getRuntimeToken()`), never with `GITHUB_TOKEN`,
    #     so `actions: write` buys the cache nothing while handing PR-authored
    #     code repo-wide Actions-API writes — deleting caches on any ref,
    #     cancelling runs — which cache ref-scoping does NOT contain. Corrected
    #     2026-08-25; see the Decision Log row.
    #   - The signature key is consumed at run time by the `pnpm turbo run …`
    #     steps, not by the caching action, so it must sit at job scope; a
    #     step-level `env:` would silently disable artifact signing. The
    #     repository secret is set, so signing is live; were it ever unset the
    #     value would interpolate empty and the cache would degrade inertly.
    permissions:
      contents: read
    env:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned per ADR-023 §Axis 4 supply-chain hygiene; Renovate's
        # helpers:pinGitHubActionDigests preset (renovate.json5) keeps this current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      # `ELECTRON_SKIP_BINARY_DOWNLOAD` because this job never launches Electron.
      # `apps/desktop`'s `postinstall` materializes the binary (Electron 44
      # publishes no install script of its own), and a full workspace install
      # runs that script — so without this every install here would pull the
      # 120-160 MB platform archive this job has no use for. `electron-vite build` needs only the package's
      # `version` field, verified 2026-09-01 by building with `dist/` absent.
      # 44.1.0's own `install.js` no longer honours this variable (41.6.1's did);
      # `apps/desktop/scripts/materialize-electron.ts` is what honours it now.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      # Backs Turborepo's remote cache with the GitHub Actions cache (no
      # third-party service, no spend). SHA-pinned per ADR-023 §Axis 4.
      #
      # Threat model, stated honestly: the controls that keep a fork PR from
      # poisoning this cache are GitHub withholding secrets from fork-originated
      # workflows, the read-only `GITHUB_TOKEN` on `pull_request`, and the
      # `--cache=local:rw,remote:r` switch appended to every turbo invocation
      # below on PR events. `remoteCache.signature` is NOT one of them —
      # Turborepo documents it as artifact-integrity verification and states it
      # "is not a security feature". ADR-023 §Axis 1's "HMAC >=32 bytes"
      # requirement is still met; only the rationale is corrected.
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Build (control-plane only)
        run: pnpm turbo run build --filter='@ai-sidekicks/control-plane...' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Typecheck (control-plane only)
        run: pnpm turbo run typecheck --filter='@ai-sidekicks/control-plane...' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Lint (control-plane only)
        run: pnpm turbo run lint --filter='@ai-sidekicks/control-plane...' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      - name: Test (control-plane only)
        run: pnpm turbo run test --filter='@ai-sidekicks/control-plane...' ${{ github.event_name == 'pull_request' && '--cache=local:rw,remote:r' || '' }}

      # Same publint + attw public-surface validation as the Node 22 tier above
      # (see that step's comment for the esm-only-profile + fflate-pin rationale,
      # and for how libraries are discovered and partitioned by engines.node).
      # This step validates the Node 24 tier (floor >= 24) — currently just
      # control-plane (engines.node >= 24), but discovered dynamically.
      - name: Validate package public surface (publint + attw — Node 24 tier)
        run: |
          fail=0
          tmp=$(mktemp -d)
          for pj in packages/*/package.json; do
            dir=$(dirname "$pj")
            pkg=$(basename "$dir")
            major=$(node -e 'const s=require("semver");const e=require("./"+process.argv[1]).engines?.node;let m=null;try{if(e)m=s.minVersion(e)}catch{}process.stdout.write(m?String(m.major):"")' "$pj" 2>/dev/null)
            [ "${major:-22}" -lt 24 ] && continue  # Node 22 tier handles floor < 24
            echo "::group::$pkg — publint --strict + attw (esm-only)"
            ( cd "$dir" && pnpm exec publint --strict ) || { echo "::error::publint failed for $pkg"; fail=1; }
            ( cd "$dir" && pnpm pack --pack-destination "$tmp" >/dev/null ) || { echo "::error::pnpm pack failed for $pkg"; fail=1; }
            tgz=$(find "$tmp" -maxdepth 1 -name '*.tgz')
            ( cd "$dir" && pnpm exec attw "$tgz" ) || { echo "::error::attw failed for $pkg"; fail=1; }
            find "$tmp" -maxdepth 1 -name '*.tgz' -delete
            echo "::endgroup::"
          done
          rm -rf "$tmp"
          if [ $fail -ne 0 ]; then
            echo "::error::package public-surface validation failed (publint/attw)"
            exit 1
          fi
          echo "ok: all Node 24 tier packages pass publint --strict + attw"

  # Minimal darwin leg for the hook guard tests only: the occupancy engine
  # has a platform fork (lsof on darwin, /proc on linux) and the incident it
  # guards against happened on macOS — an ubuntu-only matrix would ship the
  # lsof invocation, its -F parser wiring, and the exit-1 convention with
  # zero CI coverage. Deliberately skips pnpm install: the hook tests need
  # only node + git + python3 + jq (all on the macos-latest image).
  hook-tests-macos:
    name: hook tests (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          # This job never installs dependencies; without this, setup-node@v5
          # sees `packageManager: pnpm` in package.json and fails looking for
          # a pnpm binary that is deliberately absent here.
          package-manager-cache: false

      - name: Run hook guard tests
        run: node tools/run-node-tests.mjs '.claude/hooks/__tests__/**/*.test.mjs'

  # ADVISORY job — deliberately absent from `ci-gate`'s `needs` list below, so a
  # coverage regression never blocks a merge. BL-123 Stage 1 is measurement
  # substrate only: exit criteria (b)-(d) require the per-package floors to be
  # derived from a >=5-PR sample before any number gates anything, and ADR-023
  # §Axis 1's "branch protection requires only `ci-gate`" posture is unchanged.
  #
  # One job rather than a matrix. `tools/coverage-report.mjs` is fail-closed on a
  # root that declares `test:coverage` but produced no report, which only reads
  # as a signal if every root is measured in the same workspace. The Node tier
  # split from the required jobs is preserved by switching the runtime mid-job
  # (control-plane declares `engines.node: ">=24.0.0"`), not by splitting the
  # measurement across legs that would each see a partial set. Only
  # `@ai-sidekicks/control-plane` runs on the second runtime and it is
  # WASM-backed (PGlite), so no native binding is asked to cross an ABI.
  #
  # `tools/docs-corpus` has no package.json and is not a workspace member, so
  # turbo cannot fan out to it; it is invoked directly, in the same shape
  # .github/workflows/docs-corpus.yml already uses to run those tests.
  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned per ADR-023 §Axis 4 supply-chain hygiene; Renovate's
        # helpers:pinGitHubActionDigests preset (renovate.json5) keeps this current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 22.14
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: "pnpm"

      # `ELECTRON_SKIP_BINARY_DOWNLOAD` because this job never launches Electron:
      # the desktop package's `test:coverage` is `vitest run --project=renderer`,
      # a jsdom project, and the `main` (smoke) project — the only one that
      # spawns the binary — is not in the coverage set. Without this the
      # `apps/desktop` postinstall would pull the 120-160 MB platform archive
      # this job cannot use.
      # 44.1.0's own `install.js` no longer honours this variable (41.6.1's did);
      # `scripts/materialize-electron.ts` is what honours it now.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Coverage (Node 22 tier — excluding control-plane)
        run: pnpm turbo run test:coverage --filter='!@ai-sidekicks/control-plane'

      - name: Coverage (doc-corpus tooling)
        # `!cancelled()` (not the default success condition) so a red suite in an
        # earlier tier still yields this tier's report. vitest is configured with
        # `reportOnFailure: true`, which only pays off if the step actually runs.
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --root tools/docs-corpus --coverage

      - name: Setup Node.js 24 (control-plane tier)
        # Must carry the same condition as the tier it sets up: if this were
        # skipped while the tier below ran, control-plane would measure on Node 22.
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # Dependencies are already installed under the 22.14 step above; this
          # step only swaps the runtime, so re-priming the pnpm store cache here
          # would be wasted work.
          package-manager-cache: false

      - name: Coverage (Node 24 tier — control-plane only)
        if: ${{ !cancelled() }}
        run: pnpm turbo run test:coverage --filter='@ai-sidekicks/control-plane'

      # Renders one markdown table into the job summary. Writing the numbers to
      # the summary rather than a PR comment keeps this workflow's token grant at
      # `contents: read` and keeps third-party code out of the workflow that
      # carries the required `ci-gate` — see the script header for the full
      # rationale and the named upgrade path.
      - name: Render coverage summary
        # The renderer is fail-closed on a root that declares `test:coverage` and
        # produced no report, so on a red run it reports the real partial state
        # rather than being skipped into silence.
        if: ${{ !cancelled() }}
        run: node tools/coverage-report.mjs

      # The durable pointers BL-123 exit criterion (b) asks for: lcov + json
      # reports retained per run, so the >=5-PR baseline sample cites artifacts
      # rather than a scrollback number.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
            tools/docs-corpus/coverage/
          # 90, not the 30-day default: BL-123 exit (b) calls these artifacts the
          # durable pointer for a >=5-PR sampling window, and that window can
          # outlive 30 days. 90 is the ceiling for a private repo's default plan.
          retention-days: 90
          if-no-files-found: error

  # ADR-022 §Decision Log 2026-09-01 / Spec-015 §Driver Pin — Plan-023 T-023p-1B-4.
  #
  # The daemon's `better-sqlite3` 13.0.3 must load the tarball's bundled Node-API
  # prebuild on EVERY platform V1 ships to, not just the one the tier-1 matrix
  # happens to run. Before this job the provenance assertion covered linux-x64
  # alone: `test-node22` is `ubuntu-latest`, `hook-tests-macos` installs nothing,
  # and there is no Windows job at all. A missing or unloadable prebuild on the
  # other four targets would have surfaced first on a developer's machine or in
  # a release build, as a silent source compile or a crash at first open.
  #
  # Matrix = the five ADR-022 targets, on labels GitHub documents as generally
  # available for public repositories (checked against GitHub's hosted-runner
  # reference 2026-09-01; none of the five is a preview or deprecated image):
  #   ubuntu-latest    → linux-x64
  #   ubuntu-24.04-arm → linux-arm64    (arm64 Linux, free for public repos)
  #   macos-latest     → darwin-arm64   (Apple silicon)
  #   macos-15-intel   → darwin-x64     (the last Intel macOS image)
  #   windows-latest   → win32-x64
  # `win32-arm64` and the two `linuxmusl-*` prebuilds ship in the same tarball
  # and are deliberately NOT covered: `windows-11-arm` is outside the ADR-022
  # target set, and no hosted musl runner exists — a musl assertion would need a
  # container leg, which is its own task rather than a widened matrix here.
  #
  # The install is scoped to the daemon and its workspace dependencies rather
  # than the whole repo: this job's question is where one binding comes from,
  # and a full install would additionally download an Electron binary per leg
  # for nothing. `--frozen-lockfile` still applies, so a lockfile drift fails
  # here exactly as it does everywhere else.
  native-prebuilds:
    name: native prebuild (${{ matrix.prebuild }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            prebuild: linux-x64
          - os: ubuntu-24.04-arm
            prebuild: linux-arm64
          - os: macos-latest
            prebuild: darwin-arm64
          - os: macos-15-intel
            prebuild: darwin-x64
          - os: windows-latest
            prebuild: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned per ADR-023 §Axis 4; Renovate's helpers:pinGitHubActionDigests
        # preset (renovate.json5) keeps this current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      # 22.14.0 is the tier-1 floor ADR-022 §Decision Log moved to on 2026-09-01,
      # and it is the floor BECAUSE of this binding: the 13.x prebuilds are
      # Node-API 10, and a Node-API-9 host (22.12, 22.13) cannot load the binding
      # at all — observed here as a silent SIGSEGV at the first `new Database()`,
      # where Node's documented refusal is a load-time throw; Spec-015 §Driver Pin
      # states both grades. Asserting the prebuild on any other version would not
      # be asserting the shipped configuration.
      - name: Setup Node.js 22.14
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: "pnpm"

      - name: Install (runtime-daemon and its workspace dependencies only)
        run: pnpm install --frozen-lockfile --filter "@ai-sidekicks/runtime-daemon..."

      - name: Assert prebuild provenance and the Spec-015 pragma readback
        shell: bash
        env:
          EXPECTED_PREBUILD: ${{ matrix.prebuild }}
        run: |
          cat > "${RUNNER_TEMP}/assert-native-prebuild.mjs" <<'NODE'
          import { createRequire } from "node:module";
          import { existsSync, mkdtempSync, readdirSync, rmSync } from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const expectedPrebuild = process.env["EXPECTED_PREBUILD"];
          if (expectedPrebuild === undefined || expectedPrebuild === "") {
            throw new Error("EXPECTED_PREBUILD is unset — the matrix leg names the platform");
          }

          // `pathToFileURL`, not a `file://` template: a Windows cwd is
          // `D:\a\...`, which is not a valid file URL.
          const daemonRequire = createRequire(
            new URL("packages/runtime-daemon/package.json", pathToFileURL(`${process.cwd()}/`)),
          );

          const DatabaseConstructor = daemonRequire("better-sqlite3");

          // Conjunct (a): the binding the daemon RESOLVES, read back off
          // `require.cache` after a real open, so a prebuild that resolves but
          // will not load fails here too.
          const probeDirectory = mkdtempSync(path.join(os.tmpdir(), "sidekicks-prebuild-"));
          const databasePath = path.join(probeDirectory, "probe.db");
          try {
            const seedDatabase = new DatabaseConstructor(databasePath);
            seedDatabase.pragma("journal_mode = wal");
            seedDatabase.exec("CREATE TABLE probe (id INTEGER PRIMARY KEY)");
            seedDatabase.close();

            const loadedBindings = Object.keys(daemonRequire.cache).filter((entry) =>
              entry.endsWith(".node"),
            );
            if (loadedBindings.length !== 1) {
              throw new Error(
                `expected exactly one loaded .node binding, saw ${JSON.stringify(loadedBindings)}`,
              );
            }
            const [loadedBinding] = loadedBindings;
            if (
              !/[/\\]prebuilds[/\\](darwin|linux|linuxmusl|win32)-(x64|arm64)\.node$/.test(
                loadedBinding,
              )
            ) {
              throw new Error(`better-sqlite3 did not load a tarball prebuild: ${loadedBinding}`);
            }
            // ...and it is THIS platform's prebuild. Without this the assertion
            // would pass on a leg that silently loaded the wrong architecture.
            const loadedName = path.basename(loadedBinding, ".node");
            if (loadedName !== expectedPrebuild) {
              throw new Error(
                `expected the ${expectedPrebuild} prebuild, loaded ${loadedName} (${loadedBinding})`,
              );
            }

            // Conjunct (b): `build/Release/` holds no `.node` — the one location
            // a source build writes and, with `prebuild-install` gone from the
            // 13.x line, the only writer left.
            const packageRoot = path.dirname(daemonRequire.resolve("better-sqlite3/package.json"));
            const releaseDirectory = path.join(packageRoot, "build", "Release");
            const compiledArtifacts = existsSync(releaseDirectory)
              ? readdirSync(releaseDirectory).filter((entry) => entry.endsWith(".node"))
              : [];
            if (compiledArtifacts.length > 0) {
              throw new Error(
                `build/Release holds compiled artifacts (a source build ran): ${JSON.stringify(compiledArtifacts)}`,
              );
            }

            // `Spec-015 §Pragmas`, on the REOPEN path — the only path that tests
            // the override. A freshly created database is in delete mode and
            // reads `synchronous = 2` from `SQLITE_DEFAULT_SYNCHRONOUS`, which
            // says nothing about the WAL default the override exists for. A
            // connection opening an ALREADY-WAL database reads
            // `SQLITE_DEFAULT_WAL_SYNCHRONOUS`, and Spec-015's durability
            // posture is that this must be raised, not inherited.
            const database = new DatabaseConstructor(databasePath);
            const compileOptions = database.pragma("compile_options").map((row) => row.compile_options);
            const walSynchronousDefault = database.pragma("synchronous", { simple: true });
            if (walSynchronousDefault !== 1) {
              throw new Error(
                `expected the WAL default synchronous = 1 (NORMAL) before the override, read ${String(walSynchronousDefault)}`,
              );
            }

            database.pragma("journal_mode = wal");
            database.pragma("synchronous = FULL");
            database.pragma("foreign_keys = ON");
            database.pragma("busy_timeout = 5000");

            const sqliteVersion = database.prepare("SELECT sqlite_version() AS version").get().version;
            const readback = {
              journal_mode: database.pragma("journal_mode", { simple: true }),
              synchronous: database.pragma("synchronous", { simple: true }),
              foreign_keys: database.pragma("foreign_keys", { simple: true }),
              busy_timeout: database.pragma("busy_timeout", { simple: true }),
            };
            const expectedReadback = {
              journal_mode: "wal",
              synchronous: 2,
              foreign_keys: 1,
              busy_timeout: 5000,
            };
            for (const [pragmaName, expectedValue] of Object.entries(expectedReadback)) {
              if (readback[pragmaName] !== expectedValue) {
                throw new Error(
                  `pragma ${pragmaName}: expected ${String(expectedValue)}, read ${String(readback[pragmaName])}`,
                );
              }
            }
            database.close();

            console.log(`platform:            ${process.platform}-${process.arch}`);
            console.log(`node:                ${process.version} (Node-API ${process.versions.napi})`);
            console.log(`loaded prebuild:     ${loadedBinding}`);
            console.log(`build/Release .node: none (${releaseDirectory})`);
            console.log(`better-sqlite3:      ${daemonRequire("better-sqlite3/package.json").version}`);
            console.log(`embedded sqlite:     ${sqliteVersion}`);
            console.log(
              `wal synchronous default: ${String(walSynchronousDefault)} (SQLITE_DEFAULT_WAL_SYNCHRONOUS present: ${String(compileOptions.includes("DEFAULT_WAL_SYNCHRONOUS=1"))})`,
            );
            console.log(`pragma readback:     ${JSON.stringify(readback)}`);
          } finally {
            rmSync(probeDirectory, { recursive: true, force: true });
          }
          NODE
          node "${RUNNER_TEMP}/assert-native-prebuild.mjs"

  # `Spec-023 §Console Test Tiers` — the console screenshot tier, on the ONE
  # platform whose references this repository commits.
  #
  # Vitest keys a reference by browser AND platform, so a Linux or Windows run of
  # this tier compares a fresh capture against a file that is not in the
  # repository. What that does depends on the run's snapshot-update mode, and
  # neither outcome is a gate: off CI it writes the missing reference into
  # `__screenshots__` and fails once, so the NEXT run passes against an image
  # nobody reviewed; on CI it fails every time, on an ephemeral checkout, forever.
  # Committing a reference set per platform is the alternative, and it would mean
  # every visual change reviewed three times over two images no one can
  # regenerate locally.
  #
  # So the tier runs here and only here. `macos-15` rather than `macos-latest`
  # because the reference is a rendering: font stack and rasteriser move with the
  # image, and a floating label would silently re-point the comparison at a
  # different renderer between one merge and the next. Moving this label is a
  # deliberate act that comes with regenerating the references (`-u`) in the same
  # PR — which is exactly what the tier's own fail-closed guard forces.
  #
  # THIS RUNNER IS THE BASELINE AUTHORITY. The committed references are the ones
  # this job's image renders, and they are minted by running
  # `.github/workflows/console-screenshot-baselines.yml` with `mode: regenerate`
  # on the branch that changes them, then committing the artifact it uploads. A
  # developer's own machine is a different macOS with a different system UI face
  # (the console's sans stack falls through to it), so a local run is ADVISORY:
  # green means it agrees with this image within the tier's stated pixel budget,
  # and red on that budget alone means it does not — not that the change is
  # wrong. Nothing but this runner mints a reference.
  #
  # The install is scoped to the desktop package and its workspace dependencies:
  # this job runs one browser-mode Vitest project and needs nothing else built.
  # `playwright install` is required because browser mode drives a real Chromium
  # and the tier-1 job's own Chromium install does not reach this runner.
  console-screenshot-macos:
    name: console screenshot tier (macos-15)
    runs-on: macos-15
    permissions:
      contents: read
    # The tier compares its committed references only where this says so, and this
    # is one of exactly two places that says so (the other is
    # `console-screenshot-baselines.yml`, which mints them). It is checked by VALUE
    # in `apps/desktop/test/console/screenshot/baseline-platform.ts`, so copying
    # this job onto another runner class and keeping the line skips the comparisons
    # rather than measuring that runner's font stack against this one's images.
    #
    # It is read inside a browser page, so it carries the prefix Vite publishes to
    # one — `vitest/console-projects.ts` widens `envPrefix` by exactly it, from the
    # same constant that module exports. Renaming it here alone makes it invisible
    # and every comparison SKIP, which is why that name is asserted rather than
    # trusted.
    env:
      SIDEKICKS_SCREENSHOT_BASELINE_RUNNER: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned per ADR-023 §Axis 4; Renovate's helpers:pinGitHubActionDigests
        # preset (renovate.json5) keeps this current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 22.14
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: "pnpm"

      - name: Install (desktop and its workspace dependencies only)
        run: pnpm install --frozen-lockfile --filter "@ai-sidekicks/desktop..."

      - name: Install the Chromium build browser mode drives
        run: pnpm --filter @ai-sidekicks/desktop exec playwright install chromium

      # The script pins `UPDATE_SNAPSHOT=none`, and the runner sets `CI`, so the
      # mode is fail-closed twice over: a reference this checkout does not carry
      # fails here and its candidate is written to the gitignored attachments
      # directory rather than beside the committed set.
      - name: Test (desktop — console screenshot tier)
        run: pnpm --filter @ai-sidekicks/desktop run test:console-screenshot

      # A mismatch is only actionable with the images. Vitest writes the
      # reference / actual / diff triple into the attachments directory, which is
      # gitignored precisely so it can be collected here instead.
      #
      # `include-hidden-files` is load-bearing, not belt-and-braces. The action
      # skips any path segment beginning with a dot by default, and every file
      # this step wants is under `.vitest-attachments/` — so without it the step
      # runs, succeeds, and reports "No files were found with the provided path",
      # which is what happened on run 33592834676 and is why the three mismatches
      # on that run could not be looked at. `if-no-files-found: ignore` is kept
      # because a failure with no attachments is a real case (the tier can fail
      # on its own guards, which capture nothing), and it must not turn a red
      # test into a red upload.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-screenshot-diffs
          path: apps/desktop/.vitest-attachments/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [test-node22, test-node24, hook-tests-macos, native-prebuilds, console-screenshot-macos]
    if: always()
    steps:
      - name: Aggregate required-checks status
        # Aggregator-job pattern per ADR-023 §Axis 1 (and the canonical GitHub
        # Community Discussion #26822 recipe). Branch protection requires this
        # single job; renaming or adding matrix legs cannot silently bypass.
        run: |
          fail=0
          if [[ "${{ needs.test-node22.result }}" != "success" ]]; then
            echo "ci-gate: required job 'test-node22' did not succeed (result=${{ needs.test-node22.result }})"
            fail=1
          fi
          if [[ "${{ needs.test-node24.result }}" != "success" ]]; then
            echo "ci-gate: required job 'test-node24' did not succeed (result=${{ needs.test-node24.result }})"
            fail=1
          fi
          if [[ "${{ needs.hook-tests-macos.result }}" != "success" ]]; then
            echo "ci-gate: required job 'hook-tests-macos' did not succeed (result=${{ needs.hook-tests-macos.result }})"
            fail=1
          fi
          if [[ "${{ needs.native-prebuilds.result }}" != "success" ]]; then
            echo "ci-gate: required job 'native-prebuilds' did not succeed (result=${{ needs.native-prebuilds.result }})"
            fail=1
          fi
          if [[ "${{ needs.console-screenshot-macos.result }}" != "success" ]]; then
            echo "ci-gate: required job 'console-screenshot-macos' did not succeed (result=${{ needs.console-screenshot-macos.result }})"
            fail=1
          fi
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "ci-gate: all required jobs succeeded"
