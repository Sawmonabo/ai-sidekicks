# Release automation, currently a skeleton: release-please is wired, but the publish and SBOM jobs
# stay behind `if: false` until each package's npm Trusted Publisher is registered (bootstrap needs
# one traditional NPM_TOKEN publish per package before Trusted Publisher works).
#
# The workflow runs only on `workflow_dispatch`, never on a push. release-please reads commits on
# `develop`, the integration branch, and opens the release PR against it; merging bumps versions,
# and the publish job is to fast-forward develop to main and tag on main. Only the npm packages
# (`@ai-sidekicks/contracts`, `@ai-sidekicks/client-sdk`) are wired.
#
# OIDC environment gate: federated credentials bind to `repo:<org>/<repo>:environment:production`,
# not to a tag ref. Without the gate, a compromised contributor pushing a malicious tag still mints
# a valid OIDC token.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Release runs serialize on the integration branch — never cancel-in-progress (a
# half-finished release-please PR or a cancelled npm publish leaves the registry
# in an indeterminate state). Independent runs on the same ref queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  release-please:
    name: release-please (open release PR)
    runs-on: ubuntu-latest
    permissions:
      contents: write # release-please needs to push the release branch
      pull-requests: write # and open the release PR
      issues: write # and label release PRs
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run release-please
        id: release
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          # A dispatched run reads commits on `develop`, the integration branch.
          # Without `target-branch`, the action queries the repo's default branch from
          # GitHub (currently `main`), which would skip every commit on `develop`.
          target-branch: develop
          # Manifest mode — config + manifest files are committed in the repo root.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # release-please-action@v5 reads the GH token from the env by default.

  publish-npm:
    name: publish-npm (Trusted Publisher / OIDC)
    runs-on: ubuntu-latest
    needs: [release-please]
    # Skeleton gate: keeps publish inert until npm Trusted Publishers are registered for each
    # published package. Flip to
    # `if: ${{ needs.release-please.outputs.releases_created == 'true' }}` when bootstrap is
    # complete.
    if: false
    environment: production # OIDC environment gate.
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing.
      attestations: write # actions/attest@v4 outputs.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js (24.16 — Trusted Publishing requires npm CLI >= 11.5.1)
        # Release CI runs on the Node floor every package declares; 24.16.0 ships npm 11.13.0.
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      # `ELECTRON_SKIP_BINARY_DOWNLOAD` because this job never launches Electron. A full workspace
      # install runs `apps/desktop`'s `postinstall`, which downloads the 120-160 MB platform archive
      # this job has no use for. `electron-vite build` needs only the package's `version` field
      # (verified by building with `dist/` absent). Electron's own `install.js` ignores the
      # variable; `apps/desktop/scripts/materialize-electron.ts` honours it.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Publish via Trusted Publishing
        # Provenance is emitted automatically under Trusted Publishing; no `--provenance` flag.
        # `paths_released` is a JSON array (e.g. `["packages/contracts","packages/client-sdk"]`),
        # which `for path in ${...}` would expand as one shell token, so jq iterates it.
        run: |
          echo '${{ needs.release-please.outputs.paths_released }}' | jq -r '.[]' | while IFS= read -r path; do
            echo "Publishing $path"
            (cd "$path" && pnpm publish --no-git-checks --access public)
          done

  sbom:
    name: sbom (Anchore Syft + actions/attest@v4)
    runs-on: ubuntu-latest
    needs: [release-please]
    # Skeleton gate: keeps SBOM emission inert until the first real release. Flip to
    # `if: ${{ needs.release-please.outputs.releases_created == 'true' }}` together with
    # publish-npm.
    #
    # Full-surface SBOM via Anchore Syft v1.43+ (catalogs pnpm-lockfile; CycloneDX and SPDX), signed
    # via actions/attest@v4 with `--predicate-type sbom`. Avoid actions/attest-sbom (a deprecated
    # wrapper) and `npm sbom` (CycloneDX 1.5 only, no pnpm-lockfile parsing).
    if: false
    environment: production # OIDC environment gate.
    permissions:
      contents: read
      id-token: write # OIDC for Sigstore keyless signing (actions/attest@v4).
      attestations: write # actions/attest@v4 outputs.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: pnpm/action-setup@8b2eead6074fefa43a68bf4c9e0f03ea4126b5ba # v6.0.3
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.16"
          cache: "pnpm"

      # `ELECTRON_SKIP_BINARY_DOWNLOAD` because this job never launches Electron. A full workspace
      # install runs `apps/desktop`'s `postinstall`, which downloads the 120-160 MB platform archive
      # this job has no use for. `electron-vite build` needs only the package's `version` field
      # (verified by building with `dist/` absent). Electron's own `install.js` ignores the
      # variable; `apps/desktop/scripts/materialize-electron.ts` honours it.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Generate SBOM (Anchore Syft, full surface)
        # Syft v1.43+ catalogs pnpm-lockfile natively. SHA-pinned; Renovate's pinGitHubActionDigests
        # preset (renovate.json5) keeps it current.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest SBOM via actions/attest@v4
        uses: actions/attest@v4
        with:
          subject-path: sbom.cdx.json
          predicate-type: https://cyclonedx.org/bom/v1.5
          predicate-path: sbom.cdx.json
