# Release automation: release-please reads commits on `develop`, the integration branch, and opens
# the release PR against it; merging bumps the versions it tracks. The workflow runs only on
# `workflow_dispatch`, never on a push.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Release runs serialize on the integration branch, never cancel-in-progress: a half-finished
# release-please PR is left in an indeterminate state. Independent runs on the same ref queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please (open release PR)
    runs-on: ubuntu-latest
    permissions:
      contents: write # release-please needs to push the release branch
      pull-requests: write # and open the release PR
      issues: write # and label release PRs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run release-please
        # SHA-pinned; Renovate's pinGitHubActionDigests preset (renovate.json5) keeps it current.
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          # A dispatched run reads commits on `develop`, the integration branch.
          # Without `target-branch`, the action queries the repo's default branch from
          # GitHub (currently `main`), which would skip every commit on `develop`.
          target-branch: develop
          # Manifest mode — config + manifest files are committed in the repo root.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # release-please-action@v5 reads the GH token from the env by default.
