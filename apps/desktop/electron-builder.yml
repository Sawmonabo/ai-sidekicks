# Packages the desktop app. `package` builds the bundles with electron-vite, then
# `build/package-mac.ts` builds the service programs and packages everything, from `out/`, into a
# signed macOS app in `dist/`; it also sets `appId` from the contracts' bundle identifier. The
# archive holds the bundles and the `dependencies`, which the bundles leave for main to load at run
# time; everything the bundles carry is a devDependency.
files:
  - out/**
  # The renderer's type-check output, which the app never loads.
  - "!out/tsc-renderer/**"
  # The hidden source maps, read only to symbolicate a crash report off the machine.
  - "!out/**/*.map"
  # The renderer build's chunk manifest, which only the bundle budget reads.
  - "!out/renderer/.vite/**"
  # The third-party notices, which ship beside the archive (`extraResources` below).
  - "!out/third-party-notices/**"
  # The service programs, which ship beside the archive (`mac.extraResources` below).
  - "!out/service/**"
  # `notify-status` loads the binary in its own folder for this system and processor first, so its
  # per-platform packages and the binaries for other targets never load.
  - "!node_modules/notify-status-*/**"
  - "!node_modules/notify-status/!(notify-status.${platform}-${arch}*).node"
# The client helper's daemon addon stays outside the archive, where the system loads it as a file
# of its own; on macOS the signing walk then signs it as its own Mach-O, as the daemon's caller check
# needs.
asarUnpack:
  - "**/node_modules/@ai-sidekicks/client-sdk/*.node"
# The `sidekicks://` links. electron-builder declares the scheme in the macOS bundle's
# `CFBundleURLTypes` and in the Linux targets' `.desktop` file as `x-scheme-handler/sidekicks`, which
# only makes the app eligible to open them. The installed app's own `setAsDefaultProtocolClient` at
# every start makes it the handler on all three platforms; on Windows it also writes the registry
# entry, which the installer does not.
protocols:
  - name: AI Sidekicks
    schemes:
      - sidekicks
# Every platform carries the third-party notices the build wrote, one file per bundle, beside the
# archive in `third-party-notices/`; electron-builder adds each platform's own list below to this one.
extraResources:
  - from: out/third-party-notices
    to: third-party-notices
# Copies Electron's V8 snapshot as the main process's own, which the snapshot fuse below needs.
afterPack: ./build/browser-snapshot.ts
# The hardened fuse wire every packaged app carries. `WasmTrapHandlers` is left at Electron's
# default, which is on; electron-builder has no setting for it.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: true
  grantFileProtocolExtraPrivileges: false
  # Flipping a fuse breaks the binary's ad-hoc signature, which Apple silicon refuses to launch, so
  # the binary is signed ad hoc again; the signing step after it replaces that signature.
  resetAdHocDarwinSignature: true
# Each platform puts the `resources/` files its installed app reads at run time beside the archive,
# where `process.resourcesPath` finds them.
mac:
  # Signed with the identity `CSC_NAME` names, each Mach-O on its own, the hardened runtime on. No
  # notarization: Apple notarizes only Developer ID code.
  hardenedRuntime: true
  notarize: false
  # The app and every program inside it carry only `allow-jit`, never electron-builder's template:
  # its `disable-library-validation` makes the daemon refuse the client helper's signature.
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements.plist
  extraResources:
    # The menu-bar icon's resting face.
    - from: resources
      to: .
      filter:
        - menu-bar-idleTemplate.png
        - menu-bar-idleTemplate@2x.png
    # The daemon main starts and the command line, from Cargo's release build; signed with the
    # app's identity, so the daemon reads the app's team from its own signature.
    - from: out/service
      to: service
  # The Icon Composer document: electron-builder compiles it with Xcode's `actool` into the
  # bundle's asset catalog, and into an `.icns` for macOS before 26.
  icon: build/icon.icon
# The About panel's icon.
win:
  extraResources:
    - from: resources
      to: .
      filter:
        - icon.png
linux:
  extraResources:
    - from: resources
      to: .
      filter:
        - icon.png
