<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Renderer Tier 1 substrate entry HTML (Plan-023 Phase 1 T-023p-1-5).

      Loaded by the Electron main process over the `sidekicks-renderer://`
      custom protocol registered at Plan-023 Phase 1B (apps/desktop/src/main/
      protocol.ts). This file ships as the `electron-vite` renderer-target input
      declared in apps/desktop/electron.vite.config.ts (renderer.rollupOptions.input).

      The renderer is the UNTRUSTED process per Spec-023 §Trust Stance — every
      capability reaches the renderer only through window.sidekicks (exposed by
      the preload bridge at apps/desktop/src/preload/index.ts). No CSP meta tag
      here: Spec-023 §Security Hardening Baseline places the Content-Security-
      Policy on the response header served by the sidekicks-renderer:// protocol
      handler, not on the document. That header is the policy's only carrier, so
      a meta tag here would be a second, drifting source of it.
    -->
    <title>AI Sidekicks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
