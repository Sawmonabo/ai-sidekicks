packages:
  - "packages/*"
  - "apps/*"

# pnpm 10 hardening per ADR-023 §Axis 4 (sub-axis 5):
# - minimumReleaseAge: blocks installs of brand-new package versions for the floor below
# - blockExoticSubdeps: refuses transitive deps that switch to git-tarball/registry-exotic URLs
# Defaults flip on in pnpm 11; opt in early per ADR-023.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# Transitive-dependency pin for the public-surface validator (`attw` / publint CI).
# fflate@0.8.3 (2026-05-16) changed Gunzip's chunking so one input chunk no longer
# yields one output chunk; @arethetypeswrong/core's extractTarball assumes one chunk
# out, so it reads an undefined tarball entry and crashes with
# "Cannot read properties of undefined (reading 'filename')". This breaks every attw
# version 0.13.10–0.18.2 (they all float fflate via a caret range). Pin the prior
# good 0.8.2 only where attw-core consumes it; nothing else in the tree uses fflate.
# Tracking arethetypeswrong/arethetypeswrong.github.io#258 (open) — remove this
# override when attw ships a release that pins fflate or fixes extractTarball.
# Added 2026-05-25.
overrides:
  "@arethetypeswrong/core>fflate": "0.8.2"

# Strict build-script allowlist per ADR-022 §Decision row 1 + ADR-023 §Axis 4 sub-axis 5.
# `allowBuilds` (pnpm 10.26+) replaces deprecated `pnpm.onlyBuiltDependencies` /
# `ignoredBuiltDependencies` and is configured in pnpm-workspace.yaml per pnpm.io/settings.
# Only allowlisted packages may run install-time scripts (paired with
# `strict-dep-builds=true` in .npmrc).
#
# Listing a package — true OR false — marks it as "reviewed" for strictDepBuilds
# per pnpm.io/settings: "Packages not listed in allowBuilds are disallowed by
# default and a warning is printed. If strictDepBuilds is set to true, an error
# will be printed instead." Both true and false are explicit decisions.
allowBuilds:
  # DENIED, deliberately — 13.0.3 declares no install script of its own, so the
  # script pnpm would run here is the implicit `node-gyp rebuild` npm synthesizes
  # for any package shipping a `binding.gyp`. Upstream's binding.gyp is written to
  # make that a no-op (`force_build%: 0`, `prebuild_exists%: '<!(node lib/binding.js)'`
  # — the target takes no sources when a host prebuild is present), and the Node-API
  # prebuild is resolved at require time by `lib/binding.js` from
  # `prebuilds/<platform>-<arch>.node` with no install step involved. So approving it
  # buys nothing and costs a full node-gyp configure on every install.
  #
  # It also breaks Windows outright. Configure runs BEFORE gyp evaluates that
  # condition, and on `windows-latest` node-gyp 11.5.0 cannot parse the image's
  # Visual Studio 18 Enterprise install ("unknown version undefined", after a
  # PowerShell probe that overflows its stdio buffer), so `pnpm install` exits 1 on
  # a platform whose prebuild is sitting in the tarball unused. Measured 2026-09-01
  # on the `native-prebuilds` matrix: linux-x64, linux-arm64, darwin-arm64 and
  # darwin-x64 green with the build approved; win32-x64 red. Denied, all five green.
  #
  # Denial is also what makes the provenance check's second conjunct absolute:
  # `build/Release/` cannot hold a `.node` if no build ever runs.
  better-sqlite3: false
  lefthook: true
  # Cloudflare Workers tooling (Plan-008 Tier 1 / BL-104 — wrangler@^4.86.0):
  # - workerd: local Workers runtime invoked by `wrangler dev`. Approve: required.
  # - esbuild: Worker-bundle compiler invoked by wrangler. Approve: required.
  # - sharp: Cloudflare Images binding emulation pulled in via miniflare.
  #   Plan-008 Tier 1 does not use the Images binding (tRPC + SSE substrate
  #   only); deny postinstall to keep the build-script footprint minimal.
  #   Flip to `true` if/when a future plan exercises Images locally.
  workerd: true
  esbuild: true
  sharp: false
  # Plan-024 Phase 2 (T-024-2-2) — runtime-daemon PTY backend dependencies:
  # - node-pty: prebuild-install pulls a platform-specific .node binding
  #   for the in-process PTY backend. Required on every dev + CI platform
  #   (the daemon's local NodePtyHost cannot construct without it).
  # - koffi: FFI bindings used by NodePtyHost on Windows to call
  #   `kernel32!GenerateConsoleCtrlEvent` for I-024-1 (Windows kill
  #   semantics). Listed in `optionalDependencies` so non-Windows installs
  #   skip the .node prebuild gracefully, but the build script itself
  #   must be approved for the cases where the prebuild does land
  #   (Windows CI today, the Phase 5 sidecar fallback path later).
  node-pty: true
  koffi: true
  # Plan-023 Phase 1 (T-023p-1-1) — apps/desktop Electron substrate:
  # - electron: postinstall downloads the platform-specific Electron
  #   binary into node_modules/electron/dist via @electron/get. Required
  #   on every dev + CI platform that builds or runs the desktop shell;
  #   without the binary `electron-vite` and `electron .` cannot launch.
  electron: true

# Workspace-wide dependency unification per ADR-022 §Decision row 1 (pnpm catalogs).
# Catalogs eliminate per-package version drift for cross-cutting devDependencies (testing
# runner first; expand on demand). Consumers reference via `"vitest": "catalog:testing"`.
catalogs:
  testing:
    # Exact pins, moved in lockstep. `@vitest/coverage-v8` declares an EXACT peer
    # on its runner (`peerDependencies: { vitest: "4.1.5" }`, verified 2026-08-25
    # against the published manifest) rather than a range, so a caret on either
    # entry lets the two drift apart on the next resolution and the install fails
    # with an unmet peer. The catalog is the one place they move together; a
    # runner bump is its own PR that edits both lines.
    vitest: 4.1.5
    "@vitest/coverage-v8": 4.1.5
    # Plan-023 Phase 1C (T-023p-1C-1) — the console's browser tier per
    # `Spec-023 §Console Test Tiers`. `@vitest/browser-playwright` declares the
    # same EXACT peer on its runner (`peerDependencies: { vitest: "4.1.5" }`,
    # verified 2026-09-01 against the published manifest) that
    # `@vitest/coverage-v8` does, so it belongs in the lockstep set rather than
    # carrying its own caret in `apps/desktop`. Its second peer, `playwright`,
    # is `*` and is satisfied by that package's own `@playwright/test` pin.
    "@vitest/browser-playwright": 4.1.5
    # `@vitest/browser` is a transitive dependency of the provider above, but it
    # is also declared DIRECTLY by `apps/desktop`, because the screenshot tier's
    # `toMatchScreenshot` matcher is typed in `@vitest/browser/matchers` and a
    # `types` entry must resolve against a package the consumer can see. Under
    # pnpm's strict layout a transitive dependency is not visible, so without the
    # direct declaration the tier runs and does not compile. Same exact peer on
    # the runner, so the same lockstep set.
    "@vitest/browser": 4.1.5
