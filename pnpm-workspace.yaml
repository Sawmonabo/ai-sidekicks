packages:
  - "packages/*"
  - "apps/*"

# pnpm 10 hardening (both flip on by default in pnpm 11):
# - minimumReleaseAge: blocks installs of brand-new package versions for the floor below
# - blockExoticSubdeps: refuses transitive deps that switch to git-tarball/registry-exotic URLs
minimumReleaseAge: 1440
blockExoticSubdeps: true

# Strict build-script allowlist. `allowBuilds` (pnpm 10.26+) replaces the deprecated
# `pnpm.onlyBuiltDependencies` / `ignoredBuiltDependencies`. Only allowlisted packages may run
# install-time scripts (paired with `strict-dep-builds=true` in .npmrc). Listing a package, true or
# false, marks it as reviewed for strictDepBuilds: unlisted packages are disallowed by default and,
# with strictDepBuilds set, an error is printed. Both true and false are explicit decisions.
allowBuilds:
  # Denied, deliberately. 13.0.3 declares no install script of its own, so the script pnpm would run
  # here is the implicit `node-gyp rebuild` npm synthesizes for any package shipping a
  # `binding.gyp`. Upstream's binding.gyp makes that a no-op (`force_build%: 0`,
  # `prebuild_exists%: '<!(node lib/binding.js)'`: the target takes no sources when a host prebuild
  # exists), and the Node-API prebuild is resolved at require time by `lib/binding.js` from
  # `prebuilds/<platform>-<arch>.node` with no install step. So approving it buys nothing and costs
  # a full node-gyp configure on every install.
  #
  # It also breaks Windows outright. Configure runs before gyp evaluates that condition, and on
  # `windows-latest` node-gyp 11.5.0 cannot parse the image's Visual Studio 18 Enterprise install
  # ("unknown version undefined", after a PowerShell probe that overflows its stdio buffer), so
  # `pnpm install` exits 1 on a platform whose prebuild is sitting in the tarball unused. Measured
  # on the `native-prebuilds` matrix: linux-x64, linux-arm64, darwin-arm64 and darwin-x64 green with
  # the build approved; win32-x64 red. Denied, all five green.
  #
  # Denial is also what makes the provenance check's second conjunct absolute: `build/Release/`
  # cannot hold a `.node` if no build ever runs.
  better-sqlite3: false
  lefthook: true
  # Cloudflare Workers tooling (wrangler@^4.145.0):
  # - workerd: local Workers runtime invoked by `wrangler dev`. Approve: required.
  # - esbuild: Worker-bundle compiler invoked by wrangler. Approve: required.
  # - sharp: Cloudflare Images binding emulation pulled in via miniflare. The control plane does not
  #   use the Images binding, so its postinstall is denied to keep the build-script footprint
  #   minimal. Flip to `true` if the control plane ever uses Images locally.
  workerd: true
  esbuild: true
  sharp: false
  # Runtime-daemon PTY backend dependencies:
  # - node-pty: prebuild-install pulls a platform-specific .node binding for the in-process PTY
  #   backend. Required on every dev and CI platform (the daemon's local NodePtyHost cannot
  #   construct without it).
  # - koffi: FFI bindings NodePtyHost uses on Windows to call `kernel32!GenerateConsoleCtrlEvent`
  #   for the Windows kill semantics. Listed in `optionalDependencies` so non-Windows installs skip
  #   the .node prebuild gracefully, but the build script must be approved for the cases where the
  #   prebuild does land (Windows CI, the sidecar fallback path).
  node-pty: true
  koffi: true
  # apps/desktop Electron substrate:
  # - electron: the binary is downloaded by `apps/desktop/scripts/materialize-electron.ts`, the
  #   desktop package's `postinstall`, because Electron 42 and later ship no install script of their
  #   own. Required on every dev and CI platform that builds or runs the desktop shell; without the
  #   binary `electron-vite` and `electron .` cannot launch.
  electron: true
  # The endurance tier's heap-snapshot reader
  # (`apps/desktop/tests/endurance/heap-snapshot-analysis.ts`) calls memlab's `getHeapFromFile` on a
  # `.heapsnapshot` this repo captures itself over Electron's own CDP session. Denied, all four,
  # deliberately:
  # - memlab / @memlab/cli: the install script builds the CLI's browser automation, which upstream
  #   says is the only thing it drives (facebook/memlab#51: "MemLab's CLI only supports E2E
  #   automation for web pages"). This tier never invokes the CLI; it imports one parser.
  # - puppeteer: @memlab/cli's driver. Its install script downloads a Chrome build of its own, a
  #   second browser beside the Electron this package already materializes, for an automation path
  #   no test here takes.
  # - sleep: a native timer add-on pulled in under that same CLI tree; the implicit
  #   `node-gyp rebuild` npm synthesizes for it would compile on every install for a module the
  #   parser never loads.
  memlab: false
  "@memlab/cli": false
  puppeteer: false
  sleep: false
  # The console's self-hosted IBM Plex faces. Denied, all three. Neither font package builds
  # anything: the `woff2` files ship in the tarball and Vite emits them as build assets, so nothing
  # is compiled, fetched or generated at install time. What their postinstall scripts do is run
  # `@ibm/telemetry-js`, which collects and transmits usage data about the consuming repository.
  # That is not a build, and a font that renders identically without it does not earn a network call
  # on every install.
  #
  # The third entry is that collector itself: denying only the two fonts did not settle the install,
  # since its own script made `strict-dep-builds` report it unreviewed and fail the run. Listing all
  # three explicitly is what makes this a reviewed decision rather than the absence of one.
  "@ibm/plex-sans-variable": false
  "@ibm/plex-mono-variable": false
  "@ibm/telemetry-js": false

# Workspace-wide dependency unification via pnpm catalogs. Catalogs eliminate per-package version
# drift for a dependency several packages declare. Consumers reference the default catalog as
# `"zod": "catalog:"` and a named one as `"vitest": "catalog:testing"`.
catalog:
  # One version across every package: the contracts build their schemas with it and every other
  # package parses with those schemas, so two versions would be two schema runtimes.
  zod: 4.6.5
catalogs:
  testing:
    # Exact pins, moved in lockstep. `@vitest/coverage-v8` declares an exact peer on its runner
    # (`peerDependencies: { vitest: "4.1.11" }`) rather than a range, so a caret on either entry
    # lets the two drift apart on the next resolution and the install fails with an unmet peer. The
    # catalog is the one place they move together; a runner bump is its own PR that edits both
    # lines.
    vitest: 4.1.11
    "@vitest/coverage-v8": 4.1.11
    # The browser tier. `@vitest/browser-playwright` declares the same exact peer on its runner
    # (`peerDependencies: { vitest: "4.1.11" }`) that `@vitest/coverage-v8` does, so it belongs in
    # the lockstep set rather than carrying its own caret in `apps/desktop`. Its second peer,
    # `playwright`, is `*` and is satisfied by that package's own `@playwright/test` pin.
    "@vitest/browser-playwright": 4.1.11
    # `@vitest/browser` is a transitive dependency of the provider above, but `apps/desktop` also
    # declares it directly, because the screenshot tier's `toMatchScreenshot` matcher is typed in
    # `@vitest/browser/matchers` and a `types` entry must resolve against a package the consumer can
    # see. Under pnpm's strict layout a transitive dependency is not visible, so without the direct
    # declaration the tier runs and does not compile. Same exact peer on the runner, so the same
    # lockstep set.
    "@vitest/browser": 4.1.11
