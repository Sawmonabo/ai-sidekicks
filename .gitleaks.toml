title = "ai-sidekicks gitleaks config"

# Extend the upstream default ruleset; do not replace it.
# https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

# AWS KMS public-API enum constants are not secrets — they are documented
# algorithm/keyspec enum values published in the AWS KMS API reference
# (https://docs.aws.amazon.com/kms/latest/APIReference/API_Sign.html and
# https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html).
# The gitleaks generic-api-key heuristic flags `KEY = VALUE` assignments
# where VALUE is a long uppercase identifier with high entropy; the AWS
# KMS Ed25519 enum names satisfy that shape but carry no secret material.
#
# Allowlist by `regexTarget = "match"` so the suppression fires on the
# matched substring itself rather than on the surrounding line context.
#
# Uses `[[allowlists]]` (plural array) form per gitleaks v8.25.0+ — the legacy
# singular `[allowlist]` block was deprecated and gitleaks v8.30+ rejects
# configs that mix the two forms. Each `[[allowlists]]` entry is evaluated
# independently (OR semantics across entries), which keeps the AWS KMS
# suppression decoupled from the PASETO fixture suppression below.
[[allowlists]]
description = "AWS KMS Ed25519 public-API enum constants are not secrets"
regexTarget = "match"
regexes = [
  '''ECC_NIST_EDWARDS25519''',
  '''ED25519_SHA_512''',
  '''ED25519_PH_SHA_512''',
]

# Vendored RFC test vectors carry deliberate test keys (hex Ed25519 secret keys
# and PEM-encoded private keys) published in paseto-standard/test-vectors. They
# are public, deterministic, and pinned by sha256 in PROVENANCE.md alongside an
# upstream commit-SHA audit log. The `paths` field scopes this allowlist to the
# fixture path only.
[[allowlists]]
description = "PASETO v4 RFC test vectors (hex keys are deliberate; vendored from paseto-standard/test-vectors)"
paths = [
  '''packages/crypto-paseto/src/__tests__/__fixtures__/v4\.json''',
]
