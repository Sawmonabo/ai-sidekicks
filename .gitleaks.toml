title = "ai-sidekicks gitleaks config"

# Extend the upstream default ruleset; do not replace it.
# https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

# Single global [allowlist] block (singular form) — canonical schema form per
# ADR-023 §Axis 4 sub-axis 4. Compatible across all gitleaks v8.x binaries.
# The top-level [[allowlists]] (plural array) form was added in v8.25.0
# (release 2025-04-29 — "feat(config): define multiple global allowlists
# (#1777)"); singular form preserves cross-version audit traceability and
# is deferred-replaced only at the next gitleaks major-version bump.
#
# Both the local lefthook and the CI workflow now pin gitleaks v8.30.1 (CI
# via `env.GITLEAKS_VERSION` in `.github/workflows/gitleaks.yml`).
#
# condition = "OR" unifies three distinct suppressions under one block; each
# criterion fires independently (a finding is allowlisted if its match string
# matches `regexes` OR its file path matches `paths`):
#
# 1. AWS KMS public-API enum constants — not secrets; they are documented
#    algorithm/keyspec enum values published in the AWS KMS API reference
#    (https://docs.aws.amazon.com/kms/latest/APIReference/API_Sign.html and
#    https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html).
#    The gitleaks generic-api-key heuristic flags `KEY = VALUE` assignments
#    where VALUE is a long uppercase identifier with high entropy; the AWS
#    KMS Ed25519 enum names satisfy that shape but carry no secret material.
#    `regexTarget = "match"` so the suppression fires on the matched
#    substring rather than the surrounding line context (governs `regexes`
#    only — `paths` is matched against file paths regardless).
#
# 2. Cryptographic algorithm identifiers in prose. v8.30.1's generic-api-key
#    heuristic also fires on documentation phrases like
#    `XChaCha20-Poly1305-wrapped` and `Argon2id-encrypted` (high-entropy
#    hyphenated token following `key,` or `keystore cache,` — the rule
#    treats them as `KEY, VALUE` assignments). These are algorithm names,
#    not secrets; surfaced when CI moved from v8.24.3 → v8.30.1.
#
# 3. PASETO v4 RFC test vectors — deliberate test keys (hex Ed25519 secret
#    keys and PEM-encoded private keys) published in
#    paseto-standard/test-vectors. Public, deterministic, pinned by sha256
#    in PROVENANCE.md alongside an upstream commit-SHA audit log. Path-only
#    suppression scopes this allowlist to the fixture file.
[allowlist]
description = "AWS KMS Ed25519 enum constants + crypto-algorithm prose tokens + PASETO v4 RFC test vectors"
condition = "OR"
regexTarget = "match"
regexes = [
  '''ECC_NIST_EDWARDS25519''',
  '''ED25519_SHA_512''',
  '''ED25519_PH_SHA_512''',
  '''XChaCha20-Poly1305-wrapped''',
  '''Argon2id-encrypted''',
]
paths = [
  '''packages/crypto-paseto/src/__tests__/__fixtures__/v4\.json''',
]
