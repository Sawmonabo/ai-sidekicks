# mbx policy for this workspace: the shared compiler cache and the machine-wide compile scheduler.
# Builds run as `mbx <cargo command>`; the scheduler paces compiler and test processes across every
# checkout so parallel worktrees share the machine instead of multiplying its load.

[scheduler]
# Leave one core, and 6 GiB of the 16 for the Linux container's VM with about 4 GiB for macOS and the
# editor: three daemon-sized compilers at 1.7 GiB each fit in 6 GiB without swapping.
reserve_cpus = 1
memory = "6GiB"
# nextest tests take permits one at a time, so several suites at once cannot start a thread storm.
tests = true
