# mbx policy for this workspace: the shared compiler cache and the machine-wide compile scheduler.
# Builds run as `mbx <cargo command>`; the scheduler paces compiler and test processes across every
# checkout so parallel worktrees share the machine instead of multiplying its load.

# Remap the workspace root so a crate compiled in one checkout is reused by every other checkout
# with the same sources; without it every worktree recompiles the whole workspace chain itself.
share_workspace_root = true

[scheduler]
# Leave two cores, and 10 GiB of the 16 for compilers and test binaries, which leaves about 6 GiB
# for macOS and the editor; the scheduler also backs off under memory pressure. A run beside the
# Linux container's VM exports `MBX_SCHEDULER_MEMORY=6GiB`, which wins over this file.
reserve_cpus = 2
memory = "10GiB"
# A test binary takes no permit: a test queued behind compilers counts the wait toward nextest's
# two-minute limit and is ended as hung. nextest bounds each run's own parallelism.
tests = false
