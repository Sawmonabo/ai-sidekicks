[workspace]
# The edition-2024 default, which a virtual workspace must state.
resolver = "3"
# `packages/search-index` and `packages/sidecar-rust-pty` move into `crates/` with the code that
# replaces them. The fuzz targets are a member so they share the lock and the reader list; a build
# from the root without `--workspace` leaves them out.
members = [
  "crates/*",
  "crates/sidekicks-daemon/fuzz",
  "packages/search-index",
  "packages/sidecar-rust-pty",
]
default-members = ["crates/*", "packages/search-index", "packages/sidecar-rust-pty"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The release `rust-toolchain.toml` pins.
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Every outside version once; members write `name.workspace = true` and add only features.
[workspace.dependencies]
# The workspace's own crates.
sidekicks-client = { path = "crates/sidekicks-client" }
sidekicks-contracts = { path = "crates/sidekicks-contracts" }
sidekicks-platforms = { path = "crates/sidekicks-platforms" }
sidekicks-search = { path = "crates/sidekicks-search" }
sidekicks-terminal = { path = "crates/sidekicks-terminal" }

# Runtime, errors and logs.
anstream = { version = "1.0.0", default-features = false, features = ["auto"] }
anstyle-query = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flexi_logger = { version = "0.31.10", default-features = false }
futures = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
futures-util = { version = "0.3.34", default-features = false }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = "0.1.52"
opentelemetry-proto.version = "0.33.1"
opentelemetry-proto.default-features = false
opentelemetry-proto.features = ["gen-tonic-messages", "logs", "trace", "with-serde"]
thiserror = "2.0.21"
tokio.version = "1.53.3"
tokio.features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time"
]
tracing = "0.1.44"
tracing-subscriber.version = "0.3.23"
tracing-subscriber.default-features = false
tracing-subscriber.features = ["fmt", "std", "tracing-log"]

# Storage.
deadpool = { version = "0.13.1", default-features = false, features = ["managed"] }
libsqlite3-sys = "0.38.2"
rusqlite = { version = "0.40.2", features = ["backup", "blob", "bundled", "hooks"] }
tantivy = { version = "0.26.2", default-features = false }
tantivy-common = "0.11.0"
tempfile = "3.27.0"

# Processes and the operating system.
alacritty_terminal = "0.26.0"
async-io = "2.6.0"
block2 = "0.6.2"
command-fds = { version = "0.3.3", features = ["tokio"] }
dispatch2 = { version = "0.3.1", default-features = false }
junction = "2.1.0"
keepawake = "0.6.1"
libc = "0.2.190"
mach2 = "0.7.0"
nix.version = "0.31.3"
nix.features = ["event", "feature", "fs", "hostname", "process", "signal", "time", "user"]
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL"] }
objc2-io-kit = { version = "0.3.2", default-features = false }
objc2-security = { version = "0.3.2", default-features = false }
objc2-service-management.version = "0.3.2"
objc2-service-management.default-features = false
objc2-service-management.features = ["SMAppService", "objc2", "objc2-foundation", "std"]
polling = "3.8"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
# Ends the command line as a Ctrl-C does once it has flushed: SIGINT's default action put back and
# raised. `tokio::signal` holds the wait, and has no call that ends the process by a signal.
signal-hook = "0.4.5"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
uds_windows = "1.2.1"
vte = "0.15.0"
windows = "0.62.2"
windows-sys = "0.61.2"
zbus = { version = "5.19.0", features = ["tokio"] }

# Credentials.
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
keyring-core = "1.0.1"
security-framework = "3.7.0"
windows-native-keyring-store.version = "1.1.0"
windows-native-keyring-store.default-features = false
windows-native-keyring-store.features = ["search"]

# Files, folders and git.
cc = "1.8.0"
flate2.version = "1.1.10"
flate2.default-features = false
flate2.features = ["runtime_detection", "zlib-rs"]
ignore = "0.4.33"
notify = "=9.0.0-rc.6"
reflink-copy = "0.1.30"
sha3 = "0.12.0"
tar = "0.4.46"
typed-path = "0.12.3"
walkdir = "2.5.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Wire, contracts and network.
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64 = "0.23.1"
bytes = "1.12.1"
chromiumoxide_cdp = "0.9.1"
form_urlencoded = "1.2.2"
garde = { version = "0.23.0", features = ["derive", "regex", "serde"] }
h2 = "0.4.20"
hickory-server = "0.26.3"
hyper-util = "0.1.21"
instant-acme = "0.8.5"
interprocess = { version = "2.4.6", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
percent-encoding = "2.3.2"
psl = "2.1.241"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
rustls = "0.23.45"
rustls-platform-verifier = "0.7.1"
ryu-js = "1.0.3"
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order", "raw_value"] }
serde_json_canonicalizer = "0.3.2"
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", features = ["base64"] }
sse-stream = "0.3.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
tower-service = "0.3.3"
typify = { version = "0.8.0", default-features = false }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }

# Signing, sealing and secrets.
# `starlark` pins `=1.8.2`, so no newer 1.x resolves.
blake3 = "1.8.2"
cedar-policy = "4.13.0"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
gcp_auth = { version = "0.12.7", default-features = false, features = ["aws-lc-rs"] }
getrandom = "0.4.3"
getrandom_03 = { package = "getrandom", version = "0.3.4" }
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", features = ["aes"] }
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"] }
p256 = "0.14.0"
pasetors = "0.8.1"
rpassword = "7.5.4"
secrecy = "0.10.3"
sha2 = "0.11.1"
snow = { version = "0.10.0", features = ["ring-accelerated"] }
subtle = "2.6.1"
time = "0.3.55"
web-push-native = { version = "0.5.0", default-features = false, features = ["serialization"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

# Content, text and time.
base16ct = { version = "1.0.0", features = ["alloc"] }
# Strips the terminal escapes from the provider's reason line an approval card shows: CSI, 8-bit
# CSI and OSC ending in BEL or ST, with none of its terminal code.
console = { version = "0.16.6", default-features = false, features = ["alloc", "ansi-parsing"] }
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
csv = "1.4.0"
diffy = "0.5.2"
dugong = "0.9.0"
fast_image_resize = "6.1.0"
fast_qr = "0.14.0"
# The colorer's TextMate engine, shiki's grammars on `ferroni`'s Oniguruma, driven line by line.
ferriki-textmate = "1.0.0"
ferroni = "2.1.3"
# A payload's media type from its leading bytes. ZIP, CFB and ID3v2 need bytes past that prefix and
# ASF overflows on a crafted size, so those readers stay off and their formats are named by their
# signatures alone. The daemon and its fuzz target take this one reader list.
file-format.version = "0.29.0"
file-format.features = [
  "reader-ebml",
  "reader-exe",
  "reader-mp4",
  "reader-pdf",
  "reader-sqlite3",
  "reader-xml"
]
# A GIF's header read with its metadata bounded: `image`'s GIF decoder passes no memory limit.
gif = "0.14.2"
icu_casemap = "2.3.0"
icu_collator = "2.3.1"
icu_datetime = "2.3.0"
# Groups the counts the command line writes, in the person's number format, from ICU4X's
# compiled CLDR data.
icu_decimal = "2.3.0"
icu_locale_core = "2.3.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# A WebP's header read with its metadata bounded: `image`'s WebP decoder passes no memory limit.
image-webp = "0.2.4"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
jsonata-core = { version = "2.2.11", default-features = false }
jsonc-parser = { version = "0.34.0", features = ["cst"] }
lettre.version = "0.11.23"
lettre.default-features = false
lettre.features = [
  "aws-lc-rs",
  "builder",
  "hostname",
  "pool",
  "rustls-platform-verifier",
  "smtp-transport",
  "tokio1-rustls"
]
lru = "0.19.0"
lz4_flex.version = "0.14.0"
lz4_flex.default-features = false
lz4_flex.features = ["safe-decode", "safe-encode"]
memchr = "2.8.3"
pdfium-render = "0.9.4"
# A PNG's header read with its text and color-profile chunks skipped: `image`'s PNG decoder reads
# both.
png = "0.18.1"
quick_cache = "0.7.0"
regex = "1.13.1"
satteri-pulldown-cmark = { version = "0.6.3", default-features = false, features = ["std"] }
serde-saphyr = "1.3.0"
# 2.0 kept 1.3's `split`, `try_join` and quoting byte for byte and dropped only the deprecated
# `join` and `quote`, so a line joined by 1.3 reads back exactly, and the build holds one copy.
shlex = "2.0.1"
# Codex's own rule-file evaluator, the release its rule loader runs.
starlark = "0.14.2"
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
unicode-normalization = "0.1.25"
unicode-properties.version = "0.1.4"
unicode-properties.default-features = false
unicode-properties.features = ["general-category"]
unicode-segmentation = "1.13.3"
webp = "0.3.1"
writeable = { version = "0.6.4", default-features = false }
yaml-edit = "0.3.2"
zstd = "0.14.2"
# A JPEG's header read: `image`'s JPEG decoder reads the whole file before its header.
zune-jpeg = "0.5.15"

# The JavaScript engines: QuickJS and the web APIs the bundled modules call, held at the commit
# whose crates build against this exact engine release.
llrt_buffer.git = "https://github.com/awslabs/llrt"
llrt_buffer.rev = "71dab66c9074d64ff3243de936b67ebdc1c67196"
llrt_crypto.git = "https://github.com/awslabs/llrt"
llrt_crypto.rev = "71dab66c9074d64ff3243de936b67ebdc1c67196"
rquickjs = { version = "=0.14.0", features = ["futures", "rust-alloc"] }

# Crash reports.
crash-handler = "0.8.1"
minidump = "0.27.0"
minidump-processor = { version = "0.27.0", default-features = false }
minidump-unwind = "0.27.0"
minidumper = "0.11.0"

# The desktop's Node-API addon.
napi.version = "3.14.2"
napi.default-features = false
napi.features = ["async", "napi10", "serde-json", "tokio_rt"]
napi-build = "2.6.0"
napi-derive = "3.6.12"

# The Cloudflare Worker.
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
worker = { version = "0.8.7", features = ["axum", "http"] }

# Tests.
caseless = "0.2.2"
insta = { version = "1.49.0", features = ["json"] }
libfuzzer-sys = "0.4.13"
mockall = "0.15.0"
proptest = "1.12.0"
rstest = "0.27.0"
standardwebhooks = "1.0.1"
x-wing = { version = "0.1.1", features = ["hazmat"] }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
# Scoped to crate-visible items by `clippy.toml`.
missing_docs_in_private_items = "warn"
# The error contract is in the doc's one or two sentences.
missing_errors_doc = "allow"
# Panics are linted away below.
missing_panics_doc = "allow"
mod_module_files = "warn"
# `#[must_use]` goes by hand where ignoring a value is a bug.
must_use_candidate = "allow"
panic = "warn"
# The group sits below the single lints, which override it.
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
redundant_clone = "warn"
# Noise for full descriptive names.
similar_names = "allow"
todo = "warn"
# A per-function count, not a project rule.
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
missing_docs = "warn"
redundant_lifetimes = "warn"
# `fuzzing` is the cfg `cargo fuzz` sets.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unit_bindings = "warn"
unreachable_pub = "warn"
# Not forbid: a crate that binds a C or Node-API interface lowers it at its root.
unsafe_code = "deny"
unused_lifetimes = "warn"

# Turbo's name for the Cargo workspace in its task graph.
[workspace.metadata]
name = "sidekicks-crates"

[patch.crates-io]
# Sätteri's markdown parser is its 0.10.5 release with our indented-code-block fix, one commit on
# the user's fork, which the markdown parser's WebAssembly build reads too.
satteri-pulldown-cmark.git = "https://github.com/Sawmonabo/satteri"
satteri-pulldown-cmark.rev = "e16b7bcd04445ce2435fa3f0efbd21835821294d"
# The bash grammar's scanner reads a run of `)` or `|` in time quadratic in its length; this is
# upstream's pull-request commit fixing it, the 0.25.1 release but for that one guard
# (https://github.com/tree-sitter/tree-sitter-bash/issues/357). The line goes when a release
# carries the fix.
tree-sitter-bash.git = "https://github.com/tree-sitter/tree-sitter-bash"
tree-sitter-bash.rev = "35cc06e9e460a6c8066eae72df1698bb42c3d756"

# Development and test builds carry line tables only: a backtrace keeps its file and line, and the
# workspace's rlibs and test binaries drop the variable and type records no debugger reads here.
[profile.dev]
debug = "line-tables-only"

# The WebAssembly builds: small and fast, with no unwinding to carry. The release profile the other
# crates build with stays as it is.
[profile.wasm-release]
inherits = "release"
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
